<style>
:root{
  --bg:#0a0c18; --bezel:#161a33; --line:#343a74; --ink:#eef0ff; --dim:#8d93c4;
  --yellow:#ffd84a; --red:#e8455a; --u:20px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:radial-gradient(ellipse at 50% 0%,#1b2046 0%,var(--bg) 62%) fixed,var(--bg);

}
button{touch-action:manipulation;font-family:inherit}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}

.logo .home{color:inherit;text-decoration:none}
.logo .home:hover{color:var(--ink);text-decoration:underline}
.tb{display:flex;gap:6px}
.icon{font:inherit;font-size:12px;min-width:44px;height:30px;color:var(--ink);background:var(--bezel);
  border:2px solid var(--line);border-radius:4px;cursor:pointer}
.icon[aria-pressed="true"]{color:var(--dim);text-decoration:line-through}
#stage{position:relative;max-width:100%;min-width:280px;min-height:420px;display:flex;align-items:center;justify-content:center}
#boardScroll{overflow:auto;max-width:100%;border-radius:6px;-webkit-overflow-scrolling:touch;
  box-shadow:0 0 0 3px #20254a,0 10px 40px rgba(0,0,0,.6)}
canvas{display:block;touch-action:none}
canvas.scrollx{touch-action:pan-x pan-y}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:#0a0c16;border-radius:6px;padding:12px;font-size:clamp(11px,calc(var(--u)*.62),17px)}
.hidden{display:none!important}
.scr{width:100%;max-width:26em;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.75em}
h1{margin:0;font-family:Galmuri14,Galmuri11,monospace;font-weight:400;font-size:2.1em;line-height:1.05;letter-spacing:.08em;
  text-shadow:.08em .08em 0 #000}
p{margin:0}
.sub{color:var(--dim)}
.row{display:flex;align-items:center;justify-content:center;gap:.5em;flex-wrap:wrap}
.k{color:var(--dim);margin-right:.2em}
.btn{font:inherit;color:var(--ink);background:#23284c;border:2px solid #4a5196;border-bottom-width:4px;
  border-radius:4px;padding:.45em .8em;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.sel{background:var(--yellow);color:#1a1400;border-color:#b3902a}
.lv{min-width:2.2em;display:inline-block;font-size:1.15em;color:var(--yellow);font-weight:400}

#btnStart{animation:blink 1.1s steps(2) infinite}

.big{font-size:1.9em;color:var(--yellow);text-shadow:.08em .08em 0 #000}

.stat dt{color:var(--dim)} .stat dd{margin:0;text-align:right}
ol.rank{margin:0;padding:0;list-style:none;width:100%;max-width:17em}
ol.rank li{display:flex;justify-content:space-between;padding:.12em .5em}
ol.rank li.me{background:var(--yellow);color:#1a1400}
.keys{color:var(--dim);font-size:.85em;line-height:1.6}
.help{color:var(--dim);font-size:12px;text-align:center;line-height:1.9;max-width:760px;margin:0}
.help kbd{font-family:inherit;color:var(--ink);background:var(--bezel);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:3px;padding:0 .35em}
.txt{font:inherit;color:var(--ink);background:#10132a;border:2px solid var(--line);border-radius:4px;
  padding:.4em .6em;width:7em;text-align:center}
#mobileBar{display:none;gap:8px}
body.touch #mobileBar{display:flex}
body.touch .help{display:none}
#btnFlagMode.sel{background:var(--red);color:#fff;border-color:#8e2232}
</style>

<body>
<div id="app">
  <header id="hdr">
    <div class="logo"><b>MINE FINDER</b> · <a href="../../#arcade" class="home">추억의 오락실</a></div>
    <div class="tb">
      <button class="icon" id="btnPause" title="일시정지 (P)">II</button>
      <button class="icon" id="btnMute" title="소리 켜기/끄기 (M)" aria-pressed="false">♪</button>
    </div>
  </header>

  <div id="stage">
    <div id="boardScroll"><canvas id="cv"></canvas></div>
    <div class="overlay" id="ov">
      <section class="scr" id="scrTitle">
        <h1><span style="color:#eb4747">지</span><span style="color:#f59a2a">뢰</span> <span style="color:#35d6ea">찾</span><span style="color:#4acb5a">기</span></h1>
        <p class="sub">추억의 오락실 · 지뢰 찾기</p>
        <div class="row"><span class="k">난이도</span>
          <button class="btn" data-diff="beg">초급</button>
          <button class="btn" data-diff="int">중급</button>
          <button class="btn" data-diff="exp">고급</button>
          <button class="btn" data-diff="custom">사용자 지정</button>
        </div>
        <p class="desc" id="diffDesc"></p>
        <div class="row hidden" id="customRows">
          <span class="k">가로</span><button class="btn" id="cwDn" aria-label="가로 줄이기">◀</button><b class="lv" id="cwVal">16</b><button class="btn" id="cwUp" aria-label="가로 늘리기">▶</button>
          <span class="k">세로</span><button class="btn" id="chDn" aria-label="세로 줄이기">◀</button><b class="lv" id="chVal">16</b><button class="btn" id="chUp" aria-label="세로 늘리기">▶</button>
          <span class="k">지뢰</span><button class="btn" id="cmDn" aria-label="지뢰 줄이기">◀</button><b class="lv" id="cmVal">40</b><button class="btn" id="cmUp" aria-label="지뢰 늘리기">▶</button>

      </section>

      <section class="scr hidden" id="scrOver">

        <p id="overMsg"></p>
        <dl class="stat" id="overStat"></dl>
        <div id="nameEntry" class="hidden">
          <p class="sub">최고 기록! 이름을 남겨 보세요</p>
          <div class="row"><input class="txt" id="nameInput" maxlength="8" placeholder="이름"><button class="btn" id="btnSaveName">저장</button></div>
        </div>
        <ol class="rank" id="overRank"></ol>
        <div class="row">
          <button class="btn start" id="btnRetry">다시 하기</button>
          <button class="btn" id="btnTitle">처음 화면</button>
        </div>
      </section>
    </div>
  </div>

  <div id="mobileBar">
    <button class="btn" id="btnFlagMode">열기 모드</button>
  </div>

  <p class="help" id="help">
    좌클릭 열기 · 우클릭 깃발 · 더블클릭/휠클릭 코드(동시 열기) ·
    <kbd>방향키</kbd> 이동 · <kbd>Space</kbd> 열기/코드 · <kbd>F</kbd> 깃발 ·
    <kbd>F2</kbd> 새 게임 · <kbd>P</kbd> 일시정지
  </p>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

// ================= 난이도·규칙 상수 =================
const DIFF = {
  beg: { cols: 9, rows: 9, mines: 10, label: '초급' },
  int: { cols: 16, rows: 16, mines: 40, label: '중급' },
  exp: { cols: 30, rows: 16, mines: 99, label: '고급' },
};
const DIFF_DESC = {
  beg: '9×9 칸에 지뢰 10개. 처음 해보기 좋은 크기.',
  int: '16×16 칸에 지뢰 40개. 손이 좀 빨라져야 합니다.',
  exp: '30×16 칸에 지뢰 99개. 정석 고급판.',
  custom: '가로·세로·지뢰 수를 직접 정합니다.',
};
const MIN_W = 5, MAX_W = 40, MIN_H = 5, MAX_H = 24;
const maxMines = (w, h) => Math.max(1, w * h - 9);
const OVER_DELAY = 550; // 결과 화면이 뜨기 전 판을 보여주는 시간(ms)

// ================= 저장 =================
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경: 무시 */ } },
};
const settings = Object.assign(
  { muted: false, sfx: true, questions: true, diff: 'beg', cw: 16, ch: 16, cm: 40 },
  store.get('ra-07-settings', {})
);
const saveSettings = () => store.set('ra-07-settings', settings);

// ================= 사운드 (Web Audio로 직접 합성) =================
const Sound = {
  ctx: null, out: null, sfxOn: true, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.out = this.ctx.createGain();
    this.out.gain.value = this.muted ? 0 : 0.85;
    this.out.connect(this.ctx.destination);
  },
  note(freq, t, dur, type, vol, slideTo) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.setValueAtTime(vol, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise(t, dur, vol) {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(1400, t);
    lp.frequency.exponentialRampToValueAtTime(90, t + dur);
    src.connect(lp); lp.connect(g); g.connect(this.out);
    src.start(t); src.stop(t + dur + 0.02);
  },
  seq(freqs, t, step, type = 'square', vol = 0.06) {
    freqs.forEach((f, i) => this.note(f, t + i * step, step * 1.2, type, vol));
  },
  sfx(name, delay = 0) {
    if (!this.ctx || !this.sfxOn || this.muted) return;
    const f = SFX[name];
    if (f) f(this, this.ctx.currentTime + delay);
  },
  setMuted(m) { this.muted = m; if (this.out) this.out.gain.value = m ? 0 : 0.85; },
};
const SFX = {
  open:    (s, t) => s.note(360, t, 0.035, 'square', 0.05, 260),
  cascade: (s, t) => s.note(440, t, 0.05, 'triangle', 0.05, 520),
  flag:    (s, t) => s.note(700, t, 0.05, 'square', 0.05, 900),
  unflag:  (s, t) => s.note(500, t, 0.045, 'square', 0.04, 380),
  chord:   (s, t) => s.seq([500, 700], t, 0.045, 'square', 0.05),
  denied:  (s, t) => s.note(150, t, 0.06, 'square', 0.04),
  explode: (s, t) => { s.noise(t, 0.5, 0.5); s.note(90, t, 0.4, 'sawtooth', 0.15, 40); },
  win:     (s, t) => s.seq([523, 659, 784, 1047, 1319], t, 0.09, 'square', 0.07),
  press:   (s, t) => s.note(250, t, 0.02, 'square', 0.02),
  pause:   (s, t) => s.seq([988, 1319], t, 0.07),
  start:   (s, t) => s.seq([262, 330, 392, 523], t, 0.06),
  select:  (s, t) => s.note(880, t, 0.04, 'square', 0.035),
};

// ================= 게임 상태 =================
const G = {
  state: 'title', prev: null,
  diff: settings.diff, cols: 9, rows: 9, mines: 10,
  customW: settings.cw, customH: settings.ch, customM: settings.cm,
  board: [], started: false, time: 0, timeSec: 0,
  flags: 0, minesLeft: 10, revealed: 0,
  result: null, faceState: 'normal',
  pressedSet: [], chordMode: false,
  cursor: null, cursorOn: false,
  flagMode: false, questionsOn: settings.questions,
  overShown: false, overT: 0,
};

function isStandardDiff() { return G.diff === 'beg' || G.diff === 'int' || G.diff === 'exp'; }
function diffLabel() { return G.diff === 'custom' ? `사용자 ${G.cols}×${G.rows}/${G.mines}` : DIFF[G.diff].label; }
function applyDiffDims() {
  if (G.diff === 'custom') { G.cols = G.customW; G.rows = G.customH; G.mines = G.customM; }
  else { const d = DIFF[G.diff]; G.cols = d.cols; G.rows = d.rows; G.mines = d.mines; }
}

// ================= 판 로직 =================
const idx = (x, y) => y * G.cols + x;
const inb = (x, y) => x >= 0 && x < G.cols && y >= 0 && y < G.rows;
function neigh(x, y) {
  const out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (inb(nx, ny)) out.push([nx, ny]);
  }
  return out;
}
const newBoard = (cols, rows) => Array.from({ length: cols * rows }, () => ({ m: 0, n: 0, r: 0, f: 0, hit: false, wrong: false }));

function placeMines(ex, ey) {
  const excluded = new Set([idx(ex, ey)]);
  for (const [nx, ny] of neigh(ex, ey)) excluded.add(idx(nx, ny));
  const cells = [];
  for (let i = 0; i < G.cols * G.rows; i++) if (!excluded.has(i)) cells.push(i);
  let need = Math.min(G.mines, cells.length); // 방어적 clamp(범위 제한을 지키면 항상 need===G.mines)
  for (let i = cells.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
  for (let i = 0; i < need; i++) G.board[cells[i]].m = 1;
  for (let y = 0; y < G.rows; y++) for (let x = 0; x < G.cols; x++) {
    const c = G.board[idx(x, y)];
    if (c.m) continue;
    let n = 0;
    for (const [nx, ny] of neigh(x, y)) if (G.board[idx(nx, ny)].m) n++;
    c.n = n;
  }
}

function resetBoardState() {
  G.board = newBoard(G.cols, G.rows);
  G.started = false; G.time = 0; G.timeSec = 0;
  G.flags = 0; G.minesLeft = G.mines; G.revealed = 0;
  G.result = null; G.overShown = false; G.overT = 0;
  G.pressedSet = []; G.chordMode = false;
  G.cursor = null; G.cursorOn = false;
  G.faceState = 'normal';
}

function floodOpen(sx, sy) {
  const q = [idx(sx, sy)];
  const seen = new Set(q);
  while (q.length) {
    const i = q.shift();
    const cell = G.board[i];
    if (cell.r || cell.f === 1) continue;
    cell.r = 1; G.revealed++;
    cell.f = 0; // 여는 순간 물음표는 사라진다
    if (cell.n === 0) {
      const cx = i % G.cols, cy = (i / G.cols) | 0;
      for (const [nx, ny] of neigh(cx, cy)) {
        const ni = idx(nx, ny);
        if (!G.board[ni].r && !seen.has(ni)) { seen.add(ni); q.push(ni); }
      }
    }
  }
}

function explode(x, y) {
  const c = G.board[idx(x, y)];
  c.r = 1; c.hit = true;
  for (let i = 0; i < G.board.length; i++) {
    const cell = G.board[i];
    if (cell.m && !cell.r) cell.r = 1;
    if (!cell.m && cell.f === 1) cell.wrong = true;
  }
  G.state = 'over'; G.result = 'lose'; G.faceState = 'lose'; G.overT = 0;
  Sound.sfx('explode');
}

function checkWin() {
  if (G.revealed !== G.cols * G.rows - G.mines) return;
  for (const cell of G.board) if (cell.m && cell.f !== 1) { cell.f = 1; G.flags++; }
  G.minesLeft = G.mines - G.flags;
  G.state = 'over'; G.result = 'win'; G.faceState = 'win'; G.overT = 0;
  Sound.sfx('win');
}

function revealCell(x, y) {
  if (G.state !== 'playing' || !inb(x, y)) return;
  const c = G.board[idx(x, y)];
  if (c.r || c.f === 1) return;
  if (!G.started) { G.started = true; placeMines(x, y); }
  if (c.m) { explode(x, y); return; }
  Sound.sfx(c.n === 0 ? 'cascade' : 'open');
  floodOpen(x, y);
  checkWin();
}

function chordAt(x, y) {
  if (G.state !== 'playing' || !inb(x, y)) return;
  const c = G.board[idx(x, y)];
  if (!c.r || c.n === 0) return;
  const ns = neigh(x, y);
  const flagCount = ns.filter(([nx, ny]) => G.board[idx(nx, ny)].f === 1).length;
  if (flagCount !== c.n) { Sound.sfx('denied'); return; }
  for (const [nx, ny] of ns) {
    const nc = G.board[idx(nx, ny)];
    if (nc.r || nc.f === 1) continue;
    if (nc.m) { explode(nx, ny); return; }
  }
  Sound.sfx('chord');
  for (const [nx, ny] of ns) {
    const nc = G.board[idx(nx, ny)];
    if (!nc.r && nc.f !== 1) floodOpen(nx, ny);
  }
  checkWin();
}

function toggleFlagAt(x, y) {
  if (G.state !== 'playing' || !inb(x, y)) return;
  const c = G.board[idx(x, y)];
  if (c.r) return;
  if (c.f === 0) { c.f = 1; G.flags++; Sound.sfx('flag'); }
  else if (c.f === 1) {
    if (G.questionsOn) c.f = 2; else c.f = 0;
    G.flags--; Sound.sfx('unflag');
  } else { c.f = 0; Sound.sfx('unflag'); }
  G.minesLeft = G.mines - G.flags;
}

// ================= 진행 =================
function startGame() {
  Sound.init(); applySound();
  applyDiffDims();
  resetBoardState();
  hideOverlay();
  G.state = 'playing';
  layout();
  Sound.sfx('start');
}
function goTitle() {
  applyDiffDims();
  resetBoardState();
  G.state = 'title';
  layout();
  refreshTitle();
  showScreen('scrTitle');
}
function pause() {
  if (G.state !== 'playing') return;
  G.prev = G.state; G.state = 'paused';
  Sound.sfx('pause');
  refreshToggles();
  showScreen('scrPause');
}
function resume() {
  if (G.state !== 'paused') return;
  G.state = G.prev;
  hideOverlay();
  Sound.init();
}
const togglePause = () => (G.state === 'paused' ? resume() : pause());

function qualifiesForRank() {
  if (!isStandardDiff()) return false;
  const list = store.get('ra-07-scores-' + G.diff, []);
  return list.length < 5 || G.timeSec < list[list.length - 1].t;
}
function renderRank(diffKey, highlightIdx) {
  const el = $('#overRank');
  if (!diffKey) { el.innerHTML = ''; return; }
  const list = store.get('ra-07-scores-' + diffKey, []);
  el.innerHTML = list.length
    ? list.map((e, i) => `<li class="${i === highlightIdx ? 'me' : ''}"><span>${i + 1}. ${escapeHtml(e.n)}</span><span>${e.t}초</span></li>`).join('')
    : '<li class="sub" style="justify-content:center">아직 기록이 없어요</li>';
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function saveName() {
  const name = ($('#nameInput').value || '').trim().slice(0, 8) || '무명';
  const key = 'ra-07-scores-' + G.diff;
  const list = store.get(key, []);
  list.push({ n: name, t: G.timeSec, d: Date.now() });
  list.sort((a, b) => a.t - b.t);
  const top = list.slice(0, 5);
  store.set(key, top);
  const at = top.findIndex(e => e.n === name && e.t === G.timeSec);
  $('#nameEntry').classList.add('hidden');
  renderRank(G.diff, at);
}
function showOverScreen() {
  const win = G.result === 'win';
  $('#overTitle').textContent = win ? 'CLEAR!' : 'BOOM!';
  $('#overMsg').textContent = win ? '지뢰를 모두 피했습니다!' : '펑! 지뢰를 밟았습니다.';
  $('#overStat').innerHTML = `<dt>시간</dt><dd>${G.timeSec}초</dd><dt>난이도</dt><dd>${diffLabel()}</dd>`;
  const ne = $('#nameEntry');
  if (win && qualifiesForRank()) {
    ne.classList.remove('hidden');
    $('#nameInput').value = '';
    renderRank(G.diff, -1);
    setTimeout(() => $('#nameInput').focus(), 30);
  } else {
    ne.classList.add('hidden');
    renderRank(isStandardDiff() ? G.diff : null, -1);
  }
  showScreen('scrOver');
}

// ================= 입력: 키보드 =================
function moveCursor(dx, dy) {
  if (G.state !== 'playing') return;
  if (!G.cursor) G.cursor = { x: (G.cols / 2) | 0, y: (G.rows / 2) | 0 };
  else G.cursor = { x: Math.max(0, Math.min(G.cols - 1, G.cursor.x + dx)), y: Math.max(0, Math.min(G.rows - 1, G.cursor.y + dy)) };
  G.cursorOn = true;
  scrollCursorIntoView();
}
function cursorAct() {
  if (G.state !== 'playing' || !G.cursor) { moveCursor(0, 0); return; }
  const { x, y } = G.cursor;
  const c = G.board[idx(x, y)];
  if (c.r && c.n > 0) chordAt(x, y); else revealCell(x, y);
}
function cursorFlag() {
  if (G.state !== 'playing') return;
  if (!G.cursor) { moveCursor(0, 0); return; }
  toggleFlagAt(G.cursor.x, G.cursor.y);
}

window.addEventListener('keydown', e => {
  const code = e.code;
  const ovOpen = !ov.classList.contains('hidden');
  const active = document.activeElement;
  const typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
  if (typing) { if (code === 'Escape') active.blur(); return; }
  const btnFocused = ovOpen && active && active.tagName === 'BUTTON';
  if ((code === 'Enter' || code === 'Space') && btnFocused) return; // 포커스된 버튼은 브라우저가 누른다
  if (code === 'F2') { e.preventDefault(); startGame(); return; }
  if (code === 'KeyM') { if (!e.repeat) toggleMute(); return; }
  if (code === 'KeyP' || code === 'Escape') {
    e.preventDefault();
    if (e.repeat) return;
    if (code === 'Escape' && G.state === 'over') goTitle(); else togglePause();
    return;
  }
  if (G.state !== 'playing') return;
  if (code === 'ArrowLeft') { e.preventDefault(); moveCursor(-1, 0); }
  else if (code === 'ArrowRight') { e.preventDefault(); moveCursor(1, 0); }
  else if (code === 'ArrowUp') { e.preventDefault(); moveCursor(0, -1); }
  else if (code === 'ArrowDown') { e.preventDefault(); moveCursor(0, 1); }
  else if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter') { e.preventDefault(); if (!e.repeat) cursorAct(); }
  else if (code === 'KeyF') { e.preventDefault(); if (!e.repeat) cursorFlag(); }
});

// ================= 입력: 마우스/터치 =================
const cv = $('#cv'), ctx = cv.getContext('2d'), boardScroll = $('#boardScroll');
let C = 20, S_W = 400, S_H = 460, DPR = 1, BX = 0, BY = 0, HH = 40, FM = 8;
let faceRect = { x: 0, y: 0, w: 30, h: 30 };
const R = Math.round;

function cellAt(clientX, clientY) {
  const rect = cv.getBoundingClientRect();
  const scaleX = S_W / rect.width, scaleY = S_H / rect.height;
  const px = (clientX - rect.left) * scaleX, py = (clientY - rect.top) * scaleY;
  const x = Math.floor((px - BX) / C), y = Math.floor((py - BY) / C);
  if (!inb(x, y)) return null;
  return { x, y };
}
function inFace(clientX, clientY) {
  const rect = cv.getBoundingClientRect();
  const scaleX = S_W / rect.width, scaleY = S_H / rect.height;
  const px = (clientX - rect.left) * scaleX, py = (clientY - rect.top) * scaleY;
  return px >= faceRect.x && px <= faceRect.x + faceRect.w && py >= faceRect.y && py <= faceRect.y + faceRect.h;
}

function beginPress(x, y) {
  const c = G.board[idx(x, y)];
  if (c.r || c.f === 1) { G.pressedSet = []; G.chordMode = false; return; }
  G.pressedSet = [idx(x, y)]; G.chordMode = false;
}
function beginChordPress(x, y) {
  const c = G.board[idx(x, y)];
  if (!c.r) { beginPress(x, y); return; }
  const set = [];
  for (const [nx, ny] of neigh(x, y)) {
    const nc = G.board[idx(nx, ny)];
    if (!nc.r) set.push(idx(nx, ny)); // 깃발 꽂힌 칸도 누르는 동안은 눌린 모양(실제 게임과 동일)
  }
  G.pressedSet = set; G.chordMode = true;
}
function endPress() { G.pressedSet = []; G.chordMode = false; }

let mouseDown = null; // {x,y,button}
let touchState = null;
let faceDown = false;

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  Sound.init();
  if (inFace(e.clientX, e.clientY)) { faceDown = true; e.preventDefault(); return; }
  if (G.state !== 'playing') return;
  const cell = cellAt(e.clientX, e.clientY);
  if (!cell) return;
  if (e.pointerType === 'mouse') {
    e.preventDefault();
    if (e.buttons === 3 || e.button === 1) { beginChordPress(cell.x, cell.y); }
    else if (e.button === 2) { toggleFlagAt(cell.x, cell.y); return; }
    else if (e.button === 0) { beginPress(cell.x, cell.y); }
    mouseDown = { button: e.button, buttons: e.buttons, x: cell.x, y: cell.y };
    if (G.pressedSet.length) G.faceState = 'surprised';
  } else {
    touchState = { x: cell.x, y: cell.y, sx: e.clientX, sy: e.clientY, moved: false, longFired: false };
    if (!G.flagMode) { beginPress(cell.x, cell.y); G.faceState = 'surprised'; }
    touchState.timer = setTimeout(() => {
      if (!touchState || touchState.moved) return;
      touchState.longFired = true;
      toggleFlagAt(cell.x, cell.y);
      if (navigator.vibrate) navigator.vibrate(25);
      endPress(); G.faceState = 'normal';
    }, 480);
  }
});
// 마우스는 버튼 하나가 이미 눌린 상태에서 다른 버튼을 추가로 누르면 pointerdown이 아니라
// mousedown만 다시 발생한다(포인터 자체는 이미 눌려 있으므로). 그래서 코드(좌우 동시 클릭)
// 감지는 mousedown에서 e.buttons 조합을 따로 확인해야 한다.
cv.addEventListener('mousedown', e => {
  if (!mouseDown || e.buttons !== 3) return;
  const cell = cellAt(e.clientX, e.clientY);
  if (!cell) return;
  beginChordPress(cell.x, cell.y);
  mouseDown.buttons = 3;
  if (G.pressedSet.length) G.faceState = 'surprised';
});
cv.addEventListener('pointermove', e => {
  if (mouseDown) {
    const cell = cellAt(e.clientX, e.clientY);
    if (cell) {
      if (mouseDown.buttons === 3 || mouseDown.button === 1) beginChordPress(cell.x, cell.y);
      else if (mouseDown.button === 0) beginPress(cell.x, cell.y);
    } else endPress();
  } else if (touchState) {
    const dx = e.clientX - touchState.sx, dy = e.clientY - touchState.sy;
    if (Math.hypot(dx, dy) > 14) {
      touchState.moved = true;
      clearTimeout(touchState.timer);
      endPress(); G.faceState = 'normal';
    }
  }
});
function finishMouse(e) {
  if (faceDown) {
    faceDown = false;
    if (inFace(e.clientX, e.clientY)) startGame();
    return;
  }
  if (!mouseDown) return;
  const cell = cellAt(e.clientX, e.clientY);
  if (cell) {
    if (G.chordMode) chordAt(cell.x, cell.y);
    else if (mouseDown.button === 0) revealCell(cell.x, cell.y);
  }
  endPress();
  mouseDown = null;
  G.faceState = G.state === 'over' ? G.result : 'normal';
}
window.addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse') { finishMouse(e); return; }
  if (faceDown) { faceDown = false; if (inFace(e.clientX, e.clientY)) startGame(); return; }
  if (!touchState) return;
  clearTimeout(touchState.timer);
  if (!touchState.moved && !touchState.longFired) {
    const { x, y } = touchState;
    if (G.flagMode) toggleFlagAt(x, y);
    else { const c = G.board[idx(x, y)]; if (c.r && c.n > 0) chordAt(x, y); else revealCell(x, y); }
  }
  endPress();
  touchState = null;
  G.faceState = G.state === 'over' ? G.result : 'normal';
});
window.addEventListener('pointercancel', () => { endPress(); mouseDown = null; if (touchState) clearTimeout(touchState.timer); touchState = null; if (G.state !== 'over') G.faceState = 'normal'; });
cv.addEventListener('dblclick', e => {
  const cell = cellAt(e.clientX, e.clientY);
  if (cell) chordAt(cell.x, cell.y);
});

// ================= 그리기 =================
const NUMCOLOR = [null, '#2f7bd6', '#3fae4f', '#d13a3a', '#8b3fc9', '#d97a1f', '#1f9a92', '#222', '#666'];
const FACE_SKIN = '#f0c48a', HAT_COLOR = '#ffd84a', HAT_DARK = '#c99f2e';

function scrollCursorIntoView() {
  if (!G.cursor) return;
  const cx = BX + G.cursor.x * C, cy = BY + G.cursor.y * C;
  const left = boardScroll.scrollLeft, top = boardScroll.scrollTop;
  const vw = boardScroll.clientWidth, vh = boardScroll.clientHeight;
  if (cx < left) boardScroll.scrollLeft = cx - 4;
  else if (cx + C > left + vw) boardScroll.scrollLeft = cx + C - vw + 4;
  if (cy < top) boardScroll.scrollTop = cy - 4;
  else if (cy + C > top + vh) boardScroll.scrollTop = cy + C - vh + 4;
}

function layout() {
  const touch = document.body.classList.contains('touch');
  const minCell = touch ? 18 : 12, maxCell = 32;
  const app = $('#app'), hdr = $('#hdr');
  const cs = getComputedStyle(app);
  const below = touch ? $('#mobileBar').offsetHeight : $('#help').offsetHeight;
  const used = hdr.offsetHeight + below + 16 + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = window.innerWidth - 16, availH = window.innerHeight - used;
  HH = 0; FM = 0; // 임시, 아래서 C 확정 후 재계산
  const headerUnits = 2.0, marginUnits = 0.55;
  const fitW = availW / (G.cols + marginUnits * 2);
  const fitH = availH / (G.rows + headerUnits + marginUnits * 3);
  let c = Math.min(fitW, fitH, maxCell);
  if (c < minCell) c = minCell;
  C = Math.max(8, Math.floor(c));
  FM = Math.max(4, R(C * marginUnits));
  HH = R(C * headerUnits);
  S_W = G.cols * C + FM * 2;
  S_H = HH + FM * 3 + G.rows * C;
  BX = FM; BY = FM + HH + FM;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = S_W * DPR; cv.height = S_H * DPR;
  cv.style.width = S_W + 'px'; cv.style.height = S_H + 'px';
  const wrapW = Math.min(S_W, availW), wrapH = Math.min(S_H, availH);
  boardScroll.style.width = wrapW + 'px';
  boardScroll.style.height = wrapH + 'px';
  cv.classList.toggle('scrollx', S_W > wrapW || S_H > wrapH);
  $('#stage').style.width = wrapW + 'px';
  $('#stage').style.height = wrapH + 'px';
  hdr.style.width = wrapW + 'px';
  document.documentElement.style.setProperty('--u', C + 'px');
}

function bevel(x, y, w, h, raised) {
  ctx.fillStyle = '#c6c6c6'; ctx.fillRect(x, y, w, h);
  const light = raised ? '#f3f3f3' : '#7a7a7a', dark = raised ? '#7a7a7a' : '#f3f3f3';
  const t = Math.max(1, R(C * 0.09));
  ctx.fillStyle = light; ctx.fillRect(x, y, w, t); ctx.fillRect(x, y, t, h);
  ctx.fillStyle = dark; ctx.fillRect(x, y + h - t, w, t); ctx.fillRect(x + w - t, y, t, h);
}

function drawMine(x, y, s, hit) {
  const cx = x + s / 2, cy = y + s / 2, r = s * 0.3;
  if (hit) { ctx.fillStyle = '#e8455a'; ctx.fillRect(x, y, s, s); }
  ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(1, s * 0.07);
  for (let a = 0; a < 8; a++) {
    const ang = a * Math.PI / 4;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang) * r * 1.6, cy + Math.sin(ang) * r * 1.6); ctx.stroke();
  }
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.28, 0, 7); ctx.fill();
}
function drawFlag(x, y, s, wrong) {
  const px = x + s * 0.32, top = y + s * 0.2, bot = y + s * 0.82;
  ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(1, s * 0.08);
  ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, bot); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.fillRect(x + s * 0.24, bot - s * 0.03, s * 0.4, s * 0.07);
  ctx.fillStyle = '#e8455a';
  ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px + s * 0.38, top + s * 0.13); ctx.lineTo(px, top + s * 0.27); ctx.closePath(); ctx.fill();
  if (wrong) {
    ctx.strokeStyle = '#e8455a'; ctx.lineWidth = Math.max(1.5, s * 0.11);
    ctx.beginPath(); ctx.moveTo(x + s * 0.16, y + s * 0.16); ctx.lineTo(x + s * 0.84, y + s * 0.84);
    ctx.moveTo(x + s * 0.84, y + s * 0.16); ctx.lineTo(x + s * 0.16, y + s * 0.84); ctx.stroke();
  }
}
function drawCell(cx, cy, c, x, y) {
  const pressed = G.pressedSet.includes(idx(x, y));
  if (c.r) {
    ctx.fillStyle = c.hit ? '#e8455a' : '#bdbdbd';
    ctx.fillRect(cx, cy, C, C);
    ctx.strokeStyle = '#9a9a9a'; ctx.lineWidth = 1; ctx.strokeRect(cx + 0.5, cy + 0.5, C - 1, C - 1);
    if (c.m) drawMine(cx, cy, C, c.hit);
    else if (c.n > 0) {
      ctx.font = `${R(C * 0.62)}px Galmuri11, monospace`;
      ctx.fillStyle = NUMCOLOR[c.n]; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(c.n), cx + C / 2, cy + C / 2 + 1);
    }
  } else if (pressed) {
    ctx.fillStyle = '#bdbdbd'; ctx.fillRect(cx, cy, C, C);
    ctx.strokeStyle = '#9a9a9a'; ctx.strokeRect(cx + 0.5, cy + 0.5, C - 1, C - 1);
  } else {
    bevel(cx, cy, C, C, true);
    if (c.f === 1) drawFlag(cx, cy, C, G.state === 'over' && c.wrong);
    else if (c.f === 2) {
      ctx.font = `700 ${R(C * 0.6)}px Galmuri11, monospace`;
      ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', cx + C / 2, cy + C / 2 + 1);
    }
  }
}

function drawDigits(x, y, w, h, val) {
  ctx.fillStyle = '#1a0000'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#000'; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  const neg = val < 0;
  const n = Math.min(999, Math.abs(val | 0));
  const str = (neg ? '-' : '') + String(n).padStart(neg ? 2 : 3, '0');
  ctx.font = `${R(h * 0.72)}px Galmuri11, monospace`;
  ctx.fillStyle = '#ff3b30'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str.length > 3 ? str.slice(-3) : str.padStart(3, ' '), x + w / 2, y + h / 2 + 1);
}

function drawFace(x, y, s) {
  faceRect = { x, y, w: s, h: s };
  bevel(x, y, s, s, !faceDown);
  const cx = x + s / 2, cy = y + s / 2, r = s * 0.32;
  ctx.save();
  if (G.faceState === 'lose') { ctx.translate(cx, cy); ctx.rotate(-0.06); ctx.translate(-cx, -cy); }
  // 안전모
  ctx.fillStyle = FACE_SKIN; ctx.beginPath(); ctx.arc(cx, cy + r * 0.15, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = HAT_COLOR;
  ctx.beginPath(); ctx.arc(cx, cy - r * 0.35, r * 0.95, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - r * 1.05, cy - r * 0.38, r * 2.1, r * 0.22);
  ctx.fillStyle = HAT_DARK; ctx.fillRect(cx - r * 0.14, cy - r * 1.25, r * 0.28, r * 0.32);
  // 눈/입
  ctx.fillStyle = '#222';
  const eyeY = cy + r * 0.05, eyeDx = r * 0.38;
  if (G.faceState === 'lose') {
    ctx.lineWidth = Math.max(1, s * 0.03); ctx.strokeStyle = '#222';
    for (const dx of [-eyeDx, eyeDx]) {
      ctx.beginPath(); ctx.moveTo(cx + dx - r * 0.16, eyeY - r * 0.16); ctx.lineTo(cx + dx + r * 0.16, eyeY + r * 0.16);
      ctx.moveTo(cx + dx + r * 0.16, eyeY - r * 0.16); ctx.lineTo(cx + dx - r * 0.16, eyeY + r * 0.16); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, cy + r * 0.62, r * 0.22, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke(); // 찡그린 입(위로 볼록)
  } else if (G.faceState === 'win') {
    ctx.fillRect(cx - eyeDx - r * 0.22, eyeY - r * 0.14, r * 0.44, r * 0.24);
    ctx.fillRect(cx + eyeDx - r * 0.22, eyeY - r * 0.14, r * 0.44, r * 0.24);
    ctx.lineWidth = Math.max(1, s * 0.035); ctx.strokeStyle = '#222'; ctx.beginPath();
    ctx.arc(cx, cy + r * 0.32, r * 0.4, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  } else if (G.faceState === 'surprised') {
    for (const dx of [-eyeDx, eyeDx]) { ctx.beginPath(); ctx.arc(cx + dx, eyeY, r * 0.13, 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.arc(cx, cy + r * 0.42, r * 0.16, 0, 7); ctx.fillStyle = '#a33'; ctx.fill();
  } else {
    for (const dx of [-eyeDx, eyeDx]) { ctx.beginPath(); ctx.arc(cx + dx, eyeY, r * 0.1, 0, 7); ctx.fill(); }
    ctx.lineWidth = Math.max(1, s * 0.03); ctx.strokeStyle = '#222'; ctx.beginPath();
    ctx.arc(cx, cy + r * 0.22, r * 0.28, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

function drawCursor() {
  if (!G.cursorOn || !G.cursor || G.state !== 'playing') return;
  const x = BX + G.cursor.x * C, y = BY + G.cursor.y * C;
  ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = Math.max(2, R(C * 0.09));
  ctx.strokeRect(x + 1, y + 1, C - 2, C - 2);
}

// 헤드리스 검증용: 캔버스 내부 좌표(CSS px, getBoundingClientRect 기준) 조회
window.__cellPos = (x, y) => ({ cx: BX + x * C + C / 2, cy: BY + y * C + C / 2 });
window.__facePos = () => ({ cx: faceRect.x + faceRect.w / 2, cy: faceRect.y + faceRect.h / 2 });

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  bevel(0, 0, S_W, S_H, true);
  // 상단 패널
  const panelY = FM, panelH = HH;
  bevel(FM * 0.4, panelY, S_W - FM * 0.8, panelH, false);
  const digW = Math.round(panelH * 1.5), digH = Math.round(panelH * 0.62);
  drawDigits(FM * 1.1, panelY + (panelH - digH) / 2, digW, digH, G.minesLeft);
  drawDigits(S_W - FM * 1.1 - digW, panelY + (panelH - digH) / 2, digW, digH, G.timeSec);
  const faceS = Math.round(panelH * 0.78);
  drawFace((S_W - faceS) / 2, panelY + (panelH - faceS) / 2, faceS);
  // 보드
  for (let y = 0; y < G.rows; y++) for (let x = 0; x < G.cols; x++) {
    drawCell(BX + x * C, BY + y * C, G.board[idx(x, y)], x, y);
  }
  drawCursor();
}

// ================= 루프 =================
function update(dt) {
  if (G.state === 'playing') {
    if (G.started) { G.time += dt; G.timeSec = Math.min(999, Math.floor(G.time / 1000)); }
  } else if (G.state === 'over') {
    G.overT += dt;
    if (!G.overShown && G.overT >= OVER_DELAY) { G.overShown = true; showOverScreen(); }
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ================= 시작 =================
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
window.addEventListener('touchstart', () => {
  if (document.body.classList.contains('touch')) return;
  document.body.classList.add('touch'); refreshTitleKeys(); layout();
}, { passive: true });
window.addEventListener('blur', () => pause());
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

applyDiffDims();
resetBoardState();
applySound();
refreshTitleKeys();
refreshTitle();
layout();
showScreen('scrTitle');
requestAnimationFrame(frame);
})();
</script>

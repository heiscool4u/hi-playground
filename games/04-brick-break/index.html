<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>벽돌 깨기 | 추억의 오락실</title>
<meta name="description" content="받침대로 공을 튕겨 벽돌을 깨는 그 시절 오락실 게임. PC 키보드와 모바일 터치 모두 지원합니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="벽돌 깨기 | 추억의 오락실">
<meta property="og:description" content="캡슐 효과와 직접 설계한 18개 스테이지로 즐기는 벽돌 깨기. PC·모바일 모두 됩니다.">
<meta property="og:url" content="https://heiscool4u.github.io/retro-arcade/games/04-brick-break/">
<meta property="og:image" content="https://heiscool4u.github.io/retro-arcade/games/04-brick-break/og.png">
<meta name="theme-color" content="#0a0c18">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root{
  --bg:#0a0c18; --bezel:#161a33; --line:#343a74; --ink:#eef0ff; --dim:#8d93c4;
  --yellow:#ffd84a; --red:#e8455a; --u:20px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:radial-gradient(ellipse at 50% 0%,#1b2046 0%,var(--bg) 62%) fixed,var(--bg);
  color:var(--ink);font-family:Galmuri11,monospace;word-break:keep-all;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo b{color:var(--yellow);font-weight:400}
.logo .home{color:inherit;text-decoration:none}
.logo .home:hover{color:var(--ink);text-decoration:underline}
.tb{display:flex;gap:6px}
.icon{font:inherit;font-size:12px;min-width:40px;height:30px;color:var(--ink);background:var(--bezel);
  border:2px solid var(--line);border-radius:4px;cursor:pointer}
.icon[aria-pressed="true"]{color:var(--dim);text-decoration:line-through}
#stage{position:relative}
canvas{display:block;border-radius:6px;touch-action:none;box-shadow:0 0 0 3px #20254a,0 10px 40px rgba(0,0,0,.6)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:rgba(6,7,16,.87);border-radius:6px;padding:12px;font-size:clamp(11px,calc(var(--u)*.62),17px)}
.hidden{display:none!important}
.scr{width:100%;max-width:26em;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.8em}
h1{margin:0;font-family:Galmuri14,Galmuri11,monospace;font-weight:400;font-size:2.1em;line-height:1.05;letter-spacing:.06em;
  text-shadow:.08em .08em 0 #000}
p{margin:0}
.sub{color:var(--dim)}
.row{display:flex;align-items:center;justify-content:center;gap:.5em;flex-wrap:wrap}
.k{color:var(--dim);margin-right:.2em}
.btn{font:inherit;color:var(--ink);background:#23284c;border:2px solid #4a5196;border-bottom-width:4px;
  border-radius:4px;padding:.45em .8em;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.sel{background:var(--yellow);color:#1a1400;border-color:#b3902a}
.desc{color:var(--dim);font-size:.9em;min-height:2.7em;line-height:1.35}
.start{font-size:1.4em;background:var(--red);border-color:#8e2232;padding:.3em 1.3em}
#btnStart{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.big{font-size:2em;color:var(--yellow);text-shadow:.08em .08em 0 #000}
.stat{display:grid;grid-template-columns:auto auto auto auto;gap:.25em .8em;margin:0}
.stat dt{color:var(--dim)} .stat dd{margin:0;text-align:right}
ol.rank{margin:0;padding:0;list-style:none;width:100%;max-width:17em}
ol.rank li{display:flex;justify-content:space-between;padding:.12em .5em}
ol.rank li.me{background:var(--yellow);color:#1a1400}
.help{color:var(--dim);font-size:12px;text-align:center;line-height:1.9;max-width:760px;margin:0}
.help kbd{font-family:inherit;color:var(--ink);background:var(--bezel);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:3px;padding:0 .35em}

<body>
<div id="app">
  <header id="hdr">
    <div class="logo"><b>BRICK BREAK</b> · <a href="../../" class="home">추억의 오락실</a></div>
    <div class="tb">

    <canvas id="cv"></canvas>

          <button class="btn start" id="btnRetry">다시 하기</button>

        </div>
      </section>
    </div>
  </div>

  <p class="help" id="help"></p>
</div>

<script>
(() => {
'use strict';

// ================= 격자·규칙 상수 =================
const WU = 12, HU = 17;               // 화면 전체 격자(가로12 x 세로17 유닛)
const COLS = 11;                      // 벽돌 열 수
const BRICK_W = 1, BRICK_H = 0.46;    // 벽돌 한 칸 크기(유닛)
const WALL = 0.5;                     // 좌우 벽 두께
const FIELD_X0 = WALL, FIELD_X1 = WU - WALL;
const HUD_H = 1.05, CEIL_GAP = 0.15;
const CEIL_Y = HUD_H + CEIL_GAP;      // 천장(공이 튕기는 위쪽 경계)
const BRICK_TOP = CEIL_Y + 0.06;
const PADDLE_H = 0.42, PADDLE_Y = HU - 2.4;
const PADDLE_BASE_W = 2.2, PADDLE_WIDE_W = 3.4, PADDLE_SPEED = 10.5; // 유닛/초
const BALL_R = 0.2;
const CAPSULE_W = 1.05, CAPSULE_H = 0.6, CAPSULE_SPEED = 3.8;
const LASER_SPEED = 11, LASER_COOLDOWN = 260;
const DROP_CHANCE = 0.24;
const LIVES_START = 3;
const MIN_CELL = Math.min(BRICK_W, BRICK_H);

const BRICK_COLOR = { r: '#e8455a', o: '#f59a2a', y: '#f2d13a', g: '#4acb5a', b: '#3d6ff2', p: '#ae50e2' };
const SCORE_MAP = { r: 70, o: 60, y: 50, g: 40, b: 30, p: 20 };
const DIFF_MULT = { E: 0.8, N: 1, H: 1.28 };
const DIFF_LABEL = { E: '쉬움', N: '보통', H: '어려움' };
const DIFF_DESC = {
  E: '공이 느긋하게 움직입니다. 처음이라면 이걸로.',
  N: '기본 속도. 오락실 손맛에 가장 가깝습니다.',
  H: '공이 빠르고 매섭게 튑니다. 순위표에 도전!',
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad6 = n => String(Math.max(0, n | 0)).padStart(6, '0');

// ================= 스테이지(직접 설계, 18판) =================
// . 빈칸  r/o/y/g/b/p 색깔 벽돌(위 SCORE_MAP 점수)  s 은색(여러 번 타격)  x 금색(파괴 불가)
const STAGES = [
  ['ooooooooooo','yyyyyyyyyyy','ggggggggggg','bbbbbbbbbbb'],                                   // 1 줄무늬
  ['ybybybybyby','bybybybybyb','ybybybybyby','bybybybybyb','ybybybybyby'],                     // 2 체크판
  ['.....o.....','....ooo....','...ooooo...','..ooooooo..','.ooooooooo.','ooooooooooo'],        // 3 피라미드
  ['....ggg....','....ggg....','....ggg....','ggggggggggg','....ggg....','....ggg....','....ggg....'], // 4 십자가
  ['.....p.....','....ppp....','...ppppp...','..pppsppp..','...ppppp...','....ppp....','.....p.....'], // 5 다이아몬드
  ['xxxxxxxxxxx','xbbbbbbbbbx','xbbbbbbbbbx','xbbbbbbbbbx','xbbbbbbbbbx','xbbbbbbbbbx','xxxxxxxxxxx'],   // 6 황금 테두리
  ['yyy........','.yyy.......','..ooo......','...yyy.....','....ooo....','.....yyy...','......ooo..','.......yyy.'], // 7 계단
  ['.rrrrrrrrr.','..rrrrrrr..','...rrrrr...','....rxr....','...rrrrr...','..rrrrrrr..','.rrrrrrrrr.'], // 8 모래시계
  ['bbb........','..ppp......','....bbb....','......ppp..','....bbb....','..ppp......','bbb........','..ppp......'], // 9 지그재그
  ['s.s.s.s.s.s','rrrrrrrrrrr','rr.rr.rr.rr','rrrrrrrrrrr','rrrrr.rrrrr','rrrrrrrrrrr'],        // 10 성
  ['ggggg......','.ggggg.....','..ggggg....','...ggggg...','....ggggg..','.....ggggg.','....ggggg..','...ggggg...'], // 11 물결
  ['oxoooxoooxo','oooxoooxooo','oxoooxoooxo','oooxoooxooo','oxoooxoooxo','oooxoooxooo','oxoooxoooxo'], // 12 폭탄지대
  ['yyysyyysyyy','syyysyyysyy','yyysyyysyyy','syyysyyysyy','yyysyyysyyy','syyysyyysyy'],        // 13 사슬
  ['p.........g','pp.......gg','ppp.....ggg','pppp...gggg','ppppp.ggggg'],                     // 14 쐐기
  ['xxxxxxxxxxx','xsssssssssx','xs.rrrrr.sx','xs.rrrrr.sx','xs.rrrrr.sx','xsssssssssx','xxxxxxxxxxx'], // 15 황금 금고
  ['yyyy.......','.yyyy......','..yyyy.....','...yyyy....','....yyyy...','.....yyyy..','......yyyy.','.......yyyy'], // 16 번개
  ['bb.bbbbbbbb','...........','bbbbbbbb.bb','...........','bb.bbbbbbbb','...........','bbbbbbbb.bb','...........','bbbbb.bbbbb'], // 17 미로
  ['xxxxxxxxxxx','rrrrrrrrrrr','sssssssssss','ooooooooooo','y.y.y.y.y.y','ggggggggggg','bbbbbbbbbbb','ppppppppppp','xsxsxsxsxsx'], // 18 최종
];

function silverHits(stage) { return clamp(2 + Math.floor((stage - 1) / 4), 2, 5); }
function baseSpeed(stage) {
  const s = Math.min(stage, 24);
  return (6.2 + 0.28 * (s - 1)) * DIFF_MULT[G.diff];
}
function capSpeed(stage) { return baseSpeed(stage) * 1.7; }

// ================= 캡슐(효과는 한 번에 하나) =================
const CAPS = {
  wide:  { label: '넓', color: '#3d6ff2', text: '받침대 확장!' },
  slow:  { label: '느', color: '#35d6ea', text: '공 감속!' },
  catch: { label: '잡', color: '#4acb5a', text: '볼 캐치!' },
  laser: { label: '레', color: '#e8455a', text: '레이저 장착!' },
  multi: { label: '분', color: '#ae50e2', text: '3-WAY 분열!' },
  life:  { label: '생', color: '#ff7ad9', text: '1UP!' },
  exit:  { label: '출', color: '#ffd84a', text: '출구 등장!' },
};
const CAPS_WEIGHT = [['wide',18],['slow',18],['catch',18],['laser',16],['multi',13],['life',7],['exit',7]];
function pickCapsuleType() {
  const total = CAPS_WEIGHT.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [t, w] of CAPS_WEIGHT) { if (r < w) return t; r -= w; }
  return CAPS_WEIGHT[0][0];
}

// ================= 저장 =================
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경: 무시 */ } },
};
const settings = Object.assign({ diff: 'N', bgm: true, sfx: true }, store.get('ra-04-settings', {}));
const saveSettings = () => store.set('ra-04-settings', settings);
const scoreKey = () => 'ra-04-scores-' + G.diff;

// ================= 사운드 (Web Audio로 직접 합성, 오리지널 멜로디) =================
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
// 직접 작곡한 8비트 루프(오리지널) — 상승 아르페지오 + 고정 베이스
const MEL = [
  [69,.5],[72,.5],[76,.5],[79,.5], [81,.5],[79,.5],[76,.5],[72,.5],
  [71,.5],[74,.5],[77,.5],[81,.5], [79,.5],[77,.5],[74,.5],[71,.5],
  [67,.5],[71,.5],[74,.5],[77,.5], [79,.5],[77,.5],[74,.5],[71,.5],
  [69,1],[0,.5],[69,.5],[72,1],[0,.5],
];
const ROOTS = [45,45,52,52,50,50,45,45];
const BASS = ROOTS.flatMap(r => [[r,1],[r+12,.5],[r+7,.5]]);

const Sound = {
  ctx: null, out: null, bgmBus: null, timer: null, tracks: null,
  bgmOn: true, sfxOn: true, danger: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.out = this.ctx.createGain(); this.out.gain.value = 0.8; this.out.connect(this.ctx.destination);
    this.bgmBus = this.ctx.createGain(); this.bgmBus.connect(this.out);
  },
  note(freq, t, dur, type, vol, dest, slideTo) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.setValueAtTime(vol, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.out);
    o.start(t); o.stop(t + dur + 0.03);
  },
  seq(freqs, t, step, type = 'square', vol = 0.06) { freqs.forEach((f, i) => this.note(f, t + i * step, step * 1.2, type, vol)); },
  sfx(name, delay = 0) {
    if (!this.ctx || !this.sfxOn) return;
    const f = SFX[name];
    if (f) f(this, this.ctx.currentTime + delay);
  },
  bgmStart(delay = 0.1) {
    if (!this.ctx || !this.bgmOn || this.timer) return;
    const now = this.ctx.currentTime, t0 = now + delay;
    this.tracks = [
      { seq: MEL, i: 0, t: t0, type: 'square', vol: 0.045, gate: 0.8 },
      { seq: BASS, i: 0, t: t0, type: 'triangle', vol: 0.11, gate: 0.75 },
    ];
    const tick = () => {
      const at = this.ctx.currentTime, spb = 60 / (this.danger ? 210 : 158);
      for (const tr of this.tracks) {
        while (tr.t < at + 0.2) {
          const [m, beats] = tr.seq[tr.i], d = beats * spb;
          if (m) this.note(midiHz(m), tr.t, d * tr.gate, tr.type, tr.vol, this.bgmBus);
          tr.t += d;
          tr.i = (tr.i + 1) % tr.seq.length;
        }
      }
    };
    tick();
    this.timer = setInterval(tick, 40);
  },
  bgmStop() {
    if (!this.timer) return;
    clearInterval(this.timer); this.timer = null;
  },
};
const SFX = {
  wall:    (s, t) => s.note(320, t, 0.04, 'square', 0.035),
  paddle:  (s, t) => s.note(220, t, 0.06, 'triangle', 0.09, null, 340),
  brick:   (s, t) => s.note(660, t, 0.05, 'square', 0.05, null, 440),
  silver:  (s, t) => s.note(180, t, 0.05, 'square', 0.05),
  goldhit: (s, t) => s.note(90, t, 0.06, 'sine', 0.06),
  capsule: (s, t) => s.seq([523, 784, 1047], t, 0.05),
  laser:   (s, t) => s.note(900, t, 0.05, 'sawtooth', 0.04, null, 1600),
  miss:    (s, t) => s.seq([392, 330, 262], t, 0.11, 'square', 0.06),
  life:    (s, t) => s.seq([523, 659, 784, 1047, 1319], t, 0.06),
  stage:   (s, t) => s.seq([523, 523, 523, 659, 587, 659, 784, 1047], t, 0.1, 'square', 0.06),
  over:    (s, t) => s.seq([523, 494, 466, 440, 415, 392, 370, 349, 330, 311], t, 0.1, 'square', 0.055),
  pause:   (s, t) => s.seq([988, 1319], t, 0.07),
  start:   (s, t) => s.seq([262, 330, 392, 523, 659, 784], t, 0.05),
  select:  (s, t) => s.note(880, t, 0.04, 'square', 0.035),
  launch:  (s, t) => s.note(440, t, 0.08, 'square', 0.06, null, 880),
};

// ================= 게임 상태 =================
const G = {
  state: 'title', diff: settings.diff, stage: 1, score: 0, lives: LIVES_START, best: 0, time: 0,
  paddle: { x: WU / 2, w: PADDLE_BASE_W }, balls: [], bricks: null, bricksLeft: 0,
  capsules: [], lasers: [], power: { type: null }, exitDoor: null, particles: [],
  laserCd: 0, speedRampAcc: 0, popups: [], rank: -1, overShown: false, curtainT: 0,
};

// ================= 벽돌 =================
function makeBrick(ch, sHits) {
  if (ch === 'x') return { type: 'x', hp: Infinity, maxHp: Infinity, alive: true, score: 0 };
  if (ch === 's') return { type: 's', hp: sHits, maxHp: sHits, alive: true, score: 50 * sHits };
  return { type: ch, hp: 1, maxHp: 1, alive: true, score: SCORE_MAP[ch] };
}
function brickAt(c, r) { if (r < 0 || r >= G.bricks.length || c < 0 || c >= COLS) return null; return G.bricks[r][c]; }
function spawnParticles(cx, cy, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2.4 + Math.random() * 3.6;
    G.particles.push({
      x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2,
      t: 0, life: 420 + Math.random() * 260, color, s: 0.13 + Math.random() * 0.1,
    });
  }
}
function breakBrick(c, r) {
  const b = G.bricks[r][c];
  if (!b || !b.alive) return;
  if (b.type === 'x') { Sound.sfx('goldhit'); return; }
  b.hp--;
  if (b.type === 's') b.flashT = performance.now(); // 은색은 맞을 때마다 반짝인다
  if (b.hp <= 0) {
    b.alive = false; G.bricksLeft--;
    addScore(b.score);
    Sound.sfx(b.type === 's' ? 'silver' : 'brick');
    const cx = FIELD_X0 + (c + 0.5) * BRICK_W, cy = BRICK_TOP + (r + 0.5) * BRICK_H;
    spawnParticles(cx, cy, b.type === 's' ? '#c3c9ee' : BRICK_COLOR[b.type], 10);
    maybeDropCapsule(c, r);
  } else {
    Sound.sfx('silver');
  }
}
function maybeDropCapsule(c, r) {
  if (G.balls.length > 1) return; // 분열 중엔 캡슐이 나오지 않는다
  if (Math.random() >= DROP_CHANCE) return;
  G.capsules.push({ x: FIELD_X0 + (c + 0.5) * BRICK_W, y: BRICK_TOP + (r + 0.5) * BRICK_H, type: pickCapsuleType() });
}

// ================= 캡슐/파워 =================
// 넓게·붙잡기·레이저는 원작처럼 다른 캡슐을 받거나 목숨을 잃을 때까지 유지된다(시간 제한 없음).
// 느리게는 받는 순간 공 속도만 한 번 깎고, 그 뒤로는 평소처럼(시간·타격) 다시 빨라진다.
function applyPower(type) {
  const cap = CAPS[type];
  popup(cap.text, cap.color);
  if (type === 'wide' || type === 'catch' || type === 'laser') {
    const wasCatch = G.power.type === 'catch';
    G.power = { type };
    G.paddle.w = type === 'wide' ? PADDLE_WIDE_W : PADDLE_BASE_W;
    if (wasCatch && type !== 'catch') G.balls.forEach(b => { if (b.stuck) launchBall(b); });
  } else if (type === 'slow') {
    G.balls.forEach(b => { if (!b.stuck) b.speed = Math.max(2.5, b.speed * 0.55); });
  } else if (type === 'multi') {
    splitBalls();
  } else if (type === 'life') {
    G.lives = Math.min(9, G.lives + 1);
    Sound.sfx('life');
  } else if (type === 'exit') {
    openExitDoor();
  }
}
function clearPower() {
  const had = G.power.type;
  G.power = { type: null };
  G.paddle.w = PADDLE_BASE_W;
  if (had === 'catch') G.balls.forEach(b => { if (b.stuck) launchBall(b); });
}
function openExitDoor() { G.exitDoor = { x0: WU / 2 - 1, x1: WU / 2 + 1, t: 0 }; }
function splitBalls() {
  if (G.balls.length > 1 || !G.balls.length) return;
  const b = G.balls[0];
  const mk = ang => {
    if (b.stuck) return { ...b, trail: [], off: clamp(b.off + Math.sin(ang), -G.paddle.w / 2 + BALL_R, G.paddle.w / 2 - BALL_R) };
    const a0 = Math.atan2(b.dx, -b.dy);
    const a = a0 + ang;
    return { ...b, trail: [], dx: Math.sin(a), dy: -Math.cos(a) };
  };
  G.balls.push(mk(0.4), mk(-0.4));
}

// ================= 공 =================
function makeStuckBall() {
  return { x: G.paddle.x, y: PADDLE_Y - PADDLE_H / 2 - BALL_R, r: BALL_R, dx: 0, dy: -1, speed: baseSpeed(G.stage), stuck: true, off: 0, dead: false, exit: false, trail: [] };
}
function launchBall(ball) {
  ball.stuck = false;
  const off = clamp(ball.off / (G.paddle.w / 2), -1, 1);
  const ang = off * (50 * Math.PI / 180);
  ball.dx = Math.sin(ang); ball.dy = -Math.cos(ang);
  Sound.sfx('launch');
}
function fire() {
  let did = false;
  G.balls.forEach(b => { if (b.stuck) { launchBall(b); did = true; } });
  if (!did && G.power.type === 'laser') shootLaser();
}
function bumpSpeed(ball) { ball.speed = Math.min(ball.speed * 1.012, capSpeed(G.stage)); }

function stepBallSub(ball, dist) {
  const nx = ball.x + ball.dx * dist, ny = ball.y + ball.dy * dist;
  // 천장 / 출구
  if (ny - ball.r <= CEIL_Y && ball.dy < 0) {
    if (G.exitDoor && nx >= G.exitDoor.x0 && nx <= G.exitDoor.x1) { ball.exit = true; return; }
    ball.y = CEIL_Y + ball.r; ball.x = nx; ball.dy = -ball.dy; bumpSpeed(ball); Sound.sfx('wall'); return;
  }
  // 좌우 벽
  if (nx - ball.r <= FIELD_X0 && ball.dx < 0) { ball.x = FIELD_X0 + ball.r; ball.y = ny; ball.dx = -ball.dx; Sound.sfx('wall'); return; }
  if (nx + ball.r >= FIELD_X1 && ball.dx > 0) { ball.x = FIELD_X1 - ball.r; ball.y = ny; ball.dx = -ball.dx; Sound.sfx('wall'); return; }
  // 벽돌
  const hit = findBrickHit(nx, ny, ball.r);
  if (hit) {
    // 침투한 만큼 반대 축 경계 바로 바깥으로 밀어내고 그 축의 속도를 반사(다음 스텝에서 또 겹치는 것 방지)
    const flipX = Math.abs(hit.dx) > Math.abs(hit.dy) || (hit.dx === 0 && hit.dy === 0 && Math.abs(ball.dx) > Math.abs(ball.dy));
    if (flipX) { ball.x = ball.dx > 0 ? hit.bx0 - ball.r : hit.bx1 + ball.r; ball.dx = -ball.dx; }
    else { ball.y = ball.dy > 0 ? hit.by0 - ball.r : hit.by1 + ball.r; ball.dy = -ball.dy; }
    breakBrick(hit.c, hit.r);
    bumpSpeed(ball);
    return;
  }
  // 받침대
  const top = PADDLE_Y - PADDLE_H / 2;
  if (!ball.stuck && ball.dy > 0 && ny + ball.r >= top && ball.y + ball.r < top + PADDLE_H &&
      nx >= G.paddle.x - G.paddle.w / 2 - ball.r * 0.4 && nx <= G.paddle.x + G.paddle.w / 2 + ball.r * 0.4) {
    if (G.power.type === 'catch') {
      ball.stuck = true; ball.off = clamp(nx - G.paddle.x, -G.paddle.w / 2 + ball.r, G.paddle.w / 2 - ball.r);
      ball.x = nx; ball.y = top - ball.r;
    } else {
      ball.x = nx; ball.y = top - ball.r;
      const off = clamp((nx - G.paddle.x) / (G.paddle.w / 2), -1, 1);
      const ang = off * (62 * Math.PI / 180);
      ball.dx = Math.sin(ang); ball.dy = -Math.cos(ang);
      Sound.sfx('paddle');
    }
    return;
  }
  ball.x = nx; ball.y = ny;
}
function findBrickHit(nx, ny, rad) {
  const c0 = Math.floor((nx - rad - FIELD_X0) / BRICK_W), c1 = Math.floor((nx + rad - FIELD_X0) / BRICK_W);
  const r0 = Math.floor((ny - rad - BRICK_TOP) / BRICK_H), r1 = Math.floor((ny + rad - BRICK_TOP) / BRICK_H);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const b = brickAt(c, r);
    if (b && b.alive) {
      const bx0 = FIELD_X0 + c * BRICK_W, bx1 = bx0 + BRICK_W, by0 = BRICK_TOP + r * BRICK_H, by1 = by0 + BRICK_H;
      const cx = Math.max(bx0, Math.min(nx, bx1)), cy = Math.max(by0, Math.min(ny, by1));
      const dx = nx - cx, dy = ny - cy;
      if (dx * dx + dy * dy <= rad * rad) return { c, r, dx, dy, bx0, bx1, by0, by1 };
    }
  }
  return null;
}
function moveBall(ball, dtMs) {
  let remain = ball.speed * (dtMs / 1000);
  const maxStep = MIN_CELL * 0.5;
  let guard = 0;
  while (remain > 1e-6 && !ball.dead && !ball.exit && guard++ < 200) {
    const step = Math.min(remain, maxStep);
    stepBallSub(ball, step);
    remain -= step;
  }
}
function updateBalls(dt) {
  G.balls.forEach(ball => {
    if (ball.stuck) { ball.x = clamp(G.paddle.x + ball.off, FIELD_X0 + ball.r, FIELD_X1 - ball.r); ball.y = PADDLE_Y - PADDLE_H / 2 - ball.r; return; }
    if (!ball.trail) ball.trail = [];
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 5) ball.trail.shift();
    moveBall(ball, dt);
    if (!ball.dead && ball.y - ball.r > HU) ball.dead = true;
  });
  if (G.balls.some(b => b.exit)) { stageClear(true); return; }
  G.balls = G.balls.filter(b => !b.dead);
  if (G.balls.length === 0) loseLife();
}

// ================= 레이저 =================
function shootLaser() {
  if (G.laserCd > 0) return;
  G.laserCd = LASER_COOLDOWN;
  const y = PADDLE_Y - PADDLE_H / 2;
  G.lasers.push({ x: G.paddle.x - G.paddle.w / 2 + 0.18, y }, { x: G.paddle.x + G.paddle.w / 2 - 0.18, y });
  Sound.sfx('laser');
}
function updateLasers(dt) {
  const dy = LASER_SPEED * (dt / 1000);
  G.lasers = G.lasers.filter(l => {
    const newY = l.y - dy;
    const c = Math.floor((l.x - FIELD_X0) / BRICK_W);
    const rTop = Math.floor((newY - BRICK_TOP) / BRICK_H), rBot = Math.floor((l.y - BRICK_TOP) / BRICK_H);
    let hit = false;
    for (let r = rTop; r <= rBot && !hit; r++) {
      const b = brickAt(c, r);
      if (b && b.alive) { hit = true; breakBrick(c, r); }
    }
    l.y = newY;
    return !hit && newY > CEIL_Y;
  });
}

// ================= 캡슐 낙하 =================
function updateCapsules(dt) {
  const dy = CAPSULE_SPEED * (dt / 1000);
  G.capsules = G.capsules.filter(cp => {
    cp.y += dy;
    if (cp.y - CAPSULE_H / 2 > PADDLE_Y + PADDLE_H) return false;
    if (cp.y + CAPSULE_H / 2 >= PADDLE_Y - PADDLE_H / 2 &&
        cp.x >= G.paddle.x - G.paddle.w / 2 - CAPSULE_W / 2 && cp.x <= G.paddle.x + G.paddle.w / 2 + CAPSULE_W / 2) {
      Sound.sfx('capsule');
      applyPower(cp.type);
      return false;
    }
    return true;
  });
}

// ================= 파편 입자(벽돌 파괴 연출) =================
function updateParticles(dt) {
  const dtS = dt / 1000;
  G.particles.forEach(p => { p.x += p.vx * dtS; p.y += p.vy * dtS; p.vy += 4 * dtS; p.t += dt; });
  G.particles = G.particles.filter(p => p.t < p.life);
}

// ================= 점수/팝업 =================
function addScore(n) {
  G.score += n;
  if (G.best > 0 && G.score > G.best) { G.best = G.score; }
}
function popup(text, color) { G.popups.push({ text, color, t: 0 }); }
function updatePopups(dt) { G.popups.forEach(p => p.t += dt); G.popups = G.popups.filter(p => p.t < 1100); }

// ================= 진행 =================
function setupStage(keepPower) {
  const idx = (G.stage - 1) % STAGES.length;
  const sh = silverHits(G.stage);
  G.bricks = STAGES[idx].map(row => [...row].map(ch => ch === '.' ? null : makeBrick(ch, sh)));
  G.bricksLeft = 0;
  G.bricks.forEach(row => row.forEach(b => { if (b && b.type !== 'x') G.bricksLeft++; }));
  G.capsules = []; G.lasers = []; G.exitDoor = null; G.particles = [];
  if (!keepPower) G.power = { type: null };
  G.paddle = { x: WU / 2, w: G.power.type === 'wide' ? PADDLE_WIDE_W : PADDLE_BASE_W };
  G.laserCd = 0; G.speedRampAcc = 0;
  G.balls = [makeStuckBall()];
}
function startGame() {
  Sound.init(); applySound();
  G.diff = settings.diff;
  G.score = 0; G.lives = LIVES_START; G.stage = 1; G.time = 0;
  const top = store.get(scoreKey(), []); G.best = top.length ? top[0].s : 0;
  setupStage();
  G.state = 'playing';
  hideOverlay();
  Sound.sfx('start');
  Sound.bgmStart(0.4);
}
function loseLife() {
  G.lives--;
  Sound.sfx('miss');
  if (G.lives <= 0) { gameOver(); return; }
  clearPower();
  G.capsules = []; G.lasers = [];
  G.balls = [makeStuckBall()];
}
function stageClear(viaExit) {
  if (G.state !== 'playing') return;
  G.state = 'stageclear';
  const bonus = (viaExit ? 300 : 150) + 30 * G.stage;
  addScore(bonus);
  Sound.bgmStop(); Sound.sfx('stage');
  $('#stageTitle').textContent = `STAGE ${G.stage} CLEAR!`;
  $('#stageBonus').textContent = (viaExit ? '출구 통과! ' : '') + `클리어 보너스 +${bonus}`;
  $('#stageNext').textContent = '다음 스테이지에서는 공이 조금 더 빨라집니다.';
  showScreen('scrStage');
}
function nextStage() {
  if (G.state !== 'stageclear') return;
  G.stage++;
  setupStage(true); // 넓게·붙잡기·레이저는 스테이지가 바뀌어도 유지(원작 방식)
  G.state = 'playing';
  hideOverlay();
  Sound.bgmStart(0.1);
}
function gameOver() {
  G.state = 'over'; G.curtainT = 0; G.overShown = false;
  Sound.bgmStop(); Sound.sfx('over');
  G.rank = saveScore();
  showGameOver();
}
function saveScore() {
  const key = scoreKey();
  const entry = { s: G.score, st: G.stage, d: Date.now() };
  const top = [...store.get(key, []), entry].sort((a, b) => b.s - a.s).slice(0, 5);
  store.set(key, top);
  return top.indexOf(entry);
}
function showGameOver() {
  G.overShown = true;
  const msg = G.rank === 0 && G.score > 0 ? '★ 최고 기록 달성! ★' : G.rank > 0 ? `역대 ${G.rank + 1}위 기록!` : '한 판 더?';
  $('#overMsg').textContent = msg;
  $('#overStat').innerHTML = `<dt>점수</dt><dd>${G.score}</dd><dt>스테이지</dt><dd>${G.stage}</dd>`;
  const top = store.get(scoreKey(), []);
  $('#overRank').innerHTML = top.map((e, i) =>
    `<li class="${i === G.rank ? 'me' : ''}"><span>${i + 1}. ${pad6(e.s)}</span><span>ST ${e.st}</span></li>`
  ).join('');
  showScreen('scrOver');
}
function pause() {
  if (G.state !== 'playing') return;
  G.state = 'paused';
  Sound.bgmStop(); Sound.sfx('pause');
  showScreen('scrPause');
}
function resume() {
  if (G.state !== 'paused') return;
  G.state = 'playing';
  hideOverlay();
  Sound.init();
  Sound.bgmStart();
}
const togglePause = () => (G.state === 'paused' ? resume() : G.state === 'playing' ? pause() : null);
function goTitle() {
  Sound.bgmStop();
  G.state = 'title';
  refreshTitle();
  showScreen('scrTitle');
}

// ================= 입력 =================
const KeyState = { left: false, right: false };
function movePaddleToClientX(clientX) {
  if (G.state !== 'playing') return;
  const rect = cv.getBoundingClientRect();
  const ux = (clientX - rect.left) / C;
  G.paddle.x = clamp(ux, FIELD_X0 + G.paddle.w / 2, FIELD_X1 - G.paddle.w / 2);
}
window.addEventListener('keydown', e => {
  const code = e.code;
  if (code === 'KeyP' || code === 'Escape') { e.preventDefault(); if (!e.repeat) togglePause(); return; }
  if (code === 'Enter' || code === 'NumpadEnter') {
    if (G.state === 'title') startGame();
    else if (G.state === 'paused') resume();
    else if (G.state === 'stageclear') nextStage();
    else if (G.state === 'over' && G.overShown) startGame();
    return;
  }
  if (code === 'Space') {
    e.preventDefault();
    if (e.repeat) return;
    Sound.init();
    if (G.state === 'playing') fire(); else if (G.state === 'title') startGame();
    return;
  }
  if (code === 'ArrowLeft' || code === 'KeyA') { e.preventDefault(); KeyState.left = true; }
  else if (code === 'ArrowRight' || code === 'KeyD') { e.preventDefault(); KeyState.right = true; }
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') KeyState.left = false;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') KeyState.right = false;
});
window.addEventListener('blur', () => { KeyState.left = KeyState.right = false; pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { KeyState.left = KeyState.right = false; pause(); } });

// ================= 포인터(마우스+터치 공용) =================
const cv0 = document.getElementById('cv');
cv0.addEventListener('pointerdown', e => {
  Sound.init();
  try { cv0.setPointerCapture(e.pointerId); } catch (err) { /* 미지원 브라우저 */ }

// ================= 그리기 =================
const cv = $('#cv'), ctx = cv.getContext('2d');
let C = 20, SW = 240, SH = 340, DPR = 1;
const px = v => v * C;
const R = Math.round;

function layout() {
  const app = $('#app'), hdr = $('#hdr'), help = $('#help');
  const cs = getComputedStyle(app);
  const used = hdr.offsetHeight + help.offsetHeight + 16 + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = window.innerWidth - 16, availH = window.innerHeight - used;
  C = Math.max(8, Math.min(46, Math.floor(Math.min(availW / WU, availH / HU))));
  SW = C * WU; SH = C * HU;
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.width = SW * DPR; cv.height = SH * DPR;
  cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
  hdr.style.width = SW + 'px';
  document.documentElement.style.setProperty('--u', C + 'px');
}

function mix(hex, t) {
  const n = parseInt(hex.slice(1), 16), k = t > 0 ? 255 : 0, a = Math.abs(t);
  const ch = v => Math.round(v + (k - v) * a);
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`;
}
function drawRectBlock(x, y, w, h, base) {
  // 위·왼쪽은 밝게, 아래·오른쪽은 어둡게 — 입체감 있는 비스듬한 모서리
  const light = mix(base, 0.5), dark = mix(base, -0.5);
  const b = Math.max(1, Math.round(Math.min(w, h) * 0.16));
  ctx.fillStyle = base; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = dark;
  ctx.fillRect(x, y + h - b, w, b);
  ctx.fillRect(x + w - b, y, b, h);
  ctx.fillStyle = light;
  ctx.fillRect(x, y, w, b);
  ctx.fillRect(x, y, b, h);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, size, color, align = 'left') {
  ctx.font = `${size}px Galmuri11, monospace`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillText(s, x, y);
}

function drawBackground(idx) {
  const hue = (idx * 53) % 360;
  const bg = `hsl(${hue} 38% 12%)`, fg = `hsl(${hue} 45% 20%)`;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, SW, SH);
  ctx.save(); ctx.globalAlpha = 0.55; ctx.strokeStyle = fg; ctx.fillStyle = fg;
  const pat = idx % 6, u = C;
  if (pat === 0) {
    ctx.lineWidth = Math.max(1, u * 0.1);
    for (let x = -SH; x < SW; x += u * 1.6) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + SH, SH); ctx.stroke(); }
  } else if (pat === 1) {
    for (let y = u * 0.5; y < SH; y += u * 1.3) for (let x = u * 0.5; x < SW; x += u * 1.3) { ctx.beginPath(); ctx.arc(x, y, u * 0.08, 0, 7); ctx.fill(); }
  } else if (pat === 2) {
    ctx.lineWidth = Math.max(1, u * 0.08);
    for (let rr = u; rr < SW * 1.2; rr += u * 1.7) { ctx.beginPath(); ctx.arc(SW / 2, SH * 0.28, rr, 0, 7); ctx.stroke(); }
  } else if (pat === 3) {
    ctx.lineWidth = Math.max(1, u * 0.09);
    for (let y = -u; y < SH; y += u * 1.1) {
      ctx.beginPath();
      for (let x = 0; x <= SW; x += u * 0.6) ctx.lineTo(x, y + ((x / (u * 0.6)) | 0) % 2 * u * 0.5);
      ctx.stroke();
    }
  } else if (pat === 4) {
    for (let x = 0; x < SW; x += u * 1.1) ctx.fillRect(x, 0, u * 0.32, SH);
  } else {
    ctx.lineWidth = Math.max(1, u * 0.07);
    for (let x = 0; x < SW; x += u * 1.3) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, SH); ctx.stroke(); }
    for (let y = 0; y < SH; y += u * 1.3) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(SW, y); ctx.stroke(); }
  }
  ctx.restore();
}
function drawWalls() {
  ctx.fillStyle = '#20254a';
  ctx.fillRect(px(0), px(CEIL_Y), px(FIELD_X0), px(HU - CEIL_Y));
  ctx.fillRect(px(FIELD_X1), px(CEIL_Y), px(WU - FIELD_X1), px(HU - CEIL_Y));
  if (G.exitDoor) {
    ctx.fillStyle = '#2a2f5c';
    ctx.fillRect(px(FIELD_X0), px(CEIL_Y - 0.1), px(G.exitDoor.x0 - FIELD_X0), px(0.12));
    ctx.fillRect(px(G.exitDoor.x1), px(CEIL_Y - 0.1), px(FIELD_X1 - G.exitDoor.x1), px(0.12));
    const glow = 0.5 + 0.5 * Math.sin(performance.now() / 150);
    ctx.fillStyle = `rgba(255,216,74,${0.4 + glow * 0.5})`;
    ctx.fillRect(px(G.exitDoor.x0), px(CEIL_Y - 0.16), px(G.exitDoor.x1 - G.exitDoor.x0), px(0.2));
  } else {
    ctx.fillStyle = '#2a2f5c';
    ctx.fillRect(px(FIELD_X0), px(CEIL_Y - 0.1), px(FIELD_X1 - FIELD_X0), px(0.12));
  }
}
function sparkleMark(cx, cy, s) {
  ctx.fillRect(cx - s, cy - s * 0.16, s * 2, s * 0.32);
  ctx.fillRect(cx - s * 0.16, cy - s, s * 0.32, s * 2);
}
function drawBrickCell(b, x, y, w, h) {
  if (b.type === 'x') {
    drawRectBlock(x, y, w, h, '#d9b23a');
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.strokeStyle = 'rgba(90,60,10,.5)'; ctx.lineWidth = Math.max(1, h * 0.16);
    for (let i = -h; i < w + h; i += h * 0.9) { ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke(); }
    // 흐르는 광택
    const t = ((performance.now() / 900 + (x * 0.017 + y * 0.023)) % 1);
    const gx = x - w * 0.6 + t * (w * 2.6);
    const grad = ctx.createLinearGradient(gx, y, gx + w * 0.5, y + h);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, 'rgba(255,255,240,.6)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad; ctx.fillRect(x, y, w, h);
    ctx.restore();
    return;
  }
  if (b.type === 's') {
    const dmg = 1 - b.hp / b.maxHp;
    drawRectBlock(x, y, w, h, mix('#c3c9ee', -0.55 * dmg));
    if (dmg > 0) {
      ctx.strokeStyle = 'rgba(20,20,40,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + w * 0.2, y + h * 0.15); ctx.lineTo(x + w * 0.55, y + h * 0.7); ctx.lineTo(x + w * 0.3, y + h * 0.92); ctx.stroke();
    }
    if (b.flashT) {
      const dtf = performance.now() - b.flashT;
      if (dtf < 220) {
        const a = 1 - dtf / 220;
        ctx.fillStyle = `rgba(255,255,255,${0.6 * a})`;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        sparkleMark(x + w * 0.26, y + h * 0.3, w * 0.12);
        sparkleMark(x + w * 0.72, y + h * 0.62, w * 0.09);
      }
    }
    return;
  }
  drawRectBlock(x, y, w, h, BRICK_COLOR[b.type]);
}
function drawBricks() {
  if (!G.bricks) return;
  G.bricks.forEach((row, r) => row.forEach((b, c) => {
    if (!b || !b.alive) return;
    drawBrickCell(b, px(FIELD_X0 + c * BRICK_W) + 1, px(BRICK_TOP + r * BRICK_H) + 1, px(BRICK_W) - 2, px(BRICK_H) - 2);
  }));
}
function drawCapsules() {
  G.capsules.forEach(cp => {
    const info = CAPS[cp.type];
    const cx = px(cp.x), cy = px(cp.y), w = px(CAPSULE_W), h = px(CAPSULE_H);
    // 팽이처럼 좌우로 눌렸다 펴지며 도는 느낌(캡슐마다 위상이 달라 제각각 돈다)
    const spin = Math.cos(performance.now() / 420 + cp.x * 4);
    const sx = Math.max(0.16, Math.abs(spin));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(sx, 1);
    roundRect(-w / 2, -h / 2, w, h, h / 2);
    ctx.fillStyle = info.color; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1 / sx; roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.stroke();
    ctx.restore();
    if (sx > 0.45) {
      txt(info.label, cx, cy - h * 0.5, Math.max(13, h * 1.02), '#0a0c18', 'center');
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.fillRect(cx - Math.max(1, C * 0.04), cy - h * 0.42, Math.max(2, C * 0.08), h * 0.84);
    }
  });
}
function drawLasers() {
  ctx.fillStyle = '#ff6b81';
  G.lasers.forEach(l => ctx.fillRect(px(l.x) - Math.max(1, C * 0.05), px(l.y) - px(0.35), Math.max(2, C * 0.1), px(0.4)));
}
function drawBall(b) {
  const r = px(b.r);
  if (b.trail) b.trail.forEach((p, i) => {
    const k = (i + 1) / (b.trail.length + 1);
    ctx.globalAlpha = k * 0.35;
    ctx.fillStyle = '#9fb2ff';
    ctx.beginPath(); ctx.arc(px(p.x), px(p.y), r * (0.35 + 0.5 * k), 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
  const x = px(b.x), y = px(b.y);
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#9fb2ff');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function drawParticles() {
  G.particles.forEach(p => {
    const a = Math.max(0, 1 - p.t / p.life);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    const s = px(p.s) * (0.4 + 0.6 * a);
    ctx.fillRect(px(p.x) - s / 2, px(p.y) - s / 2, s, s);
  });
  ctx.globalAlpha = 1;
}
function drawPaddle() {
  const w = px(G.paddle.w), h = px(PADDLE_H), r = h / 2;
  const x = px(G.paddle.x) - w / 2, y = px(PADDLE_Y - PADDLE_H / 2), cy = y + h / 2;
  const type = G.power.type;
  const accent = type === 'laser' ? '#e8455a' : type === 'catch' ? '#4acb5a' : type === 'wide' ? '#35d6ea' : '#7d8ae0';

  // 넓게: 양 끝에 날개 장식(먼저 그려서 몸체 밑에 살짝 걸치게)
  if (type === 'wide') {
    ctx.fillStyle = mix('#1c2044', 0.12);
    [-1, 1].forEach(side => {
      const bx = side < 0 ? x : x + w;
      ctx.beginPath();
      ctx.moveTo(bx, y + h * 0.1);
      ctx.lineTo(bx + side * w * 0.055, y - h * 0.25);
      ctx.lineTo(bx + side * w * 0.055, y + h * 1.25);
      ctx.lineTo(bx, y + h * 0.9);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#4a5196'; ctx.lineWidth = Math.max(1, h * 0.08); ctx.stroke();
    });
  }
  // 레이저: 양 끝에 포신
  if (type === 'laser') {
    const bw = w * 0.1, bh = h * 1.6;
    [x + w * 0.14, x + w * 0.86 - bw].forEach(bx => {
      ctx.fillStyle = '#2a2f5c';
      ctx.fillRect(bx, cy - bh, bw, bh);
      ctx.strokeStyle = '#4a5196'; ctx.lineWidth = Math.max(1, h * 0.06);
      ctx.strokeRect(bx, cy - bh, bw, bh);
      ctx.fillStyle = accent;
      ctx.fillRect(bx + bw * 0.18, cy - bh, bw * 0.64, bh * 0.2);
    });
  }

  // 금속 몸체(위는 밝고 아래는 어두운 그라디언트)
  const grad = ctx.createLinearGradient(0, y, 0, y + h);
  grad.addColorStop(0, '#454c8a'); grad.addColorStop(0.45, '#1c2044'); grad.addColorStop(1, '#0c0e26');
  roundRect(x, y, w, h, r); ctx.fillStyle = grad; ctx.fill();
  // 위쪽 하이라이트 선(금속 질감)
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = Math.max(1, h * 0.09);
  ctx.beginPath(); ctx.moveTo(x + r * 0.7, y + h * 0.14); ctx.lineTo(x + w - r * 0.7, y + h * 0.14); ctx.stroke();
  // 가운데 효과 색 스트라이프
  ctx.fillStyle = accent; roundRect(x + w * 0.07, y + h * 0.32, w * 0.86, h * 0.24, h * 0.12); ctx.fill();
  // 테두리
  ctx.strokeStyle = '#4a5196'; ctx.lineWidth = Math.max(1, h * 0.1); roundRect(x, y, w, h, r); ctx.stroke();

  // 양 끝 발광 너브
  [x + r * 0.55, x + w - r * 0.55].forEach(nx => {
    const g2 = ctx.createRadialGradient(nx, cy, 0, nx, cy, r);
    g2.addColorStop(0, accent); g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(nx, cy, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(nx, cy, r * 0.22, 0, 7); ctx.fill();
  });
}
function drawHUD() {
  const y = px(0.18), size = Math.max(9, Math.round(C * 0.42));
  txt(`SCORE ${pad6(G.score)}`, px(FIELD_X0), y, size, '#eef0ff');
  txt(`STAGE ${G.stage}  ♥${G.lives}`, px(WU / 2), y, size, '#ffd84a', 'center');
  txt(`BEST ${pad6(G.best)}`, px(FIELD_X1), y, size, '#8d93c4', 'right');
}
function drawPopups() {
  ctx.font = `${Math.max(11, R(C * 0.75))}px Galmuri11, monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.lineJoin = 'round';
  G.popups.forEach((p, i) => {
    const y = px(HU * 0.4) + i * C * 1.1 - (Math.min(p.t, 300) / 300) * C * 0.5;
    ctx.globalAlpha = p.t < 700 ? 1 : Math.max(0, 1 - (p.t - 700) / 400);
    ctx.lineWidth = Math.max(3, R(C * 0.18)); ctx.strokeStyle = '#000';
    ctx.strokeText(p.text, SW / 2, y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, SW / 2, y);
  });
  ctx.globalAlpha = 1;
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  drawBackground(G.stage - 1);
  if (!G.bricks) return;
  drawWalls();
  drawBricks();
  drawParticles();
  drawCapsules();
  drawLasers();
  G.balls.forEach(drawBall);
  drawPaddle();
  drawHUD();
  drawPopups();
}

// ================= 루프 =================
function update(dt) {
  updatePopups(dt);
  if (G.state === 'playing') {
    G.time += dt;
    if (KeyState.left) G.paddle.x -= PADDLE_SPEED * dt / 1000;
    if (KeyState.right) G.paddle.x += PADDLE_SPEED * dt / 1000;
    G.paddle.x = clamp(G.paddle.x, FIELD_X0 + G.paddle.w / 2, FIELD_X1 - G.paddle.w / 2);
    if (G.laserCd > 0) G.laserCd -= dt;
    Sound.danger = G.lives === 1;
    G.speedRampAcc += dt;
    if (G.speedRampAcc >= 1000) {
      G.speedRampAcc -= 1000;
      G.balls.forEach(b => { if (!b.stuck) b.speed = Math.min(b.speed * 1.015, capSpeed(G.stage)); });
    }
    updateCapsules(dt);
    updateLasers(dt);
    updateBalls(dt);
    updateParticles(dt);
    if (G.state === 'playing' && G.bricksLeft <= 0) stageClear(false);
  } else if (G.state === 'over') {
    G.curtainT += dt;
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ================= 시작 =================
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
window.addEventListener('touchstart', () => {
  if (document.body.classList.contains('touch')) return;
  document.body.classList.add('touch'); refreshHelp(); layout();
}, { passive: true });
window.addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

applySound();
refreshTitle();
layout();
showScreen('scrTitle');
requestAnimationFrame(frame);
})();
</script>
</body>

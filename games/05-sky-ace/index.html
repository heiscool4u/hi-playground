<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>하늘 에이스 | 추억의 오락실</title>
<meta name="description" content="그 시절 세로 스크롤 비행 슈팅을 브라우저에서. PC 키보드와 모바일 터치 모두 지원합니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="하늘 에이스 | 추억의 오락실">
<meta property="og:description" content="4개 스테이지, 무기 강화와 폭탄, 보스전까지. 편대를 뚫고 하늘을 지켜내세요.">
<meta property="og:url" content="https://heiscool4u.github.io/retro-arcade/games/05-sky-ace/">
<meta property="og:image" content="https://heiscool4u.github.io/retro-arcade/games/05-sky-ace/og.png">
<meta name="theme-color" content="#081018">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root{
  --bg:#081018; --bezel:#131b2c; --line:#2c3f5c; --ink:#eaf2ff; --dim:#88a0bd;
  --yellow:#ffd84a; --red:#e8455a; --u:20px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:radial-gradient(ellipse at 50% 0%,#152a3f 0%,var(--bg) 62%) fixed,var(--bg);
  color:var(--ink);font-family:Galmuri11,monospace;word-break:keep-all;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo b{color:var(--yellow);font-weight:400}
.logo .home{color:inherit;text-decoration:none}
.logo .home:hover{color:var(--ink);text-decoration:underline}
.tb{display:flex;gap:6px}
.icon{font:inherit;font-size:12px;min-width:44px;height:30px;color:var(--ink);background:var(--bezel);
  border:2px solid var(--line);border-radius:4px;cursor:pointer}
.icon[aria-pressed="true"]{color:var(--dim);text-decoration:line-through}
#stage{position:relative}
canvas{display:block;border-radius:6px;touch-action:none;box-shadow:0 0 0 3px #1a2740,0 10px 40px rgba(0,0,0,.6)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:rgba(4,8,14,.87);border-radius:6px;padding:12px;font-size:clamp(11px,calc(var(--u)*.62),17px)}
.hidden{display:none!important}
.scr{width:100%;max-width:26em;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.75em}
h1{margin:0;font-family:Galmuri14,Galmuri11,monospace;font-weight:400;font-size:2em;line-height:1.15;letter-spacing:.06em;
  text-shadow:.08em .08em 0 #000}
p{margin:0}
.sub{color:var(--dim)}
.row{display:flex;align-items:center;justify-content:center;gap:.5em;flex-wrap:wrap}
.k{color:var(--dim);margin-right:.2em}
.btn{font:inherit;color:var(--ink);background:#182238;border:2px solid #38507a;border-bottom-width:4px;
  border-radius:4px;padding:.45em .8em;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.sel{background:var(--yellow);color:#1a1400;border-color:#b3902a}
.desc{color:var(--dim);font-size:.85em;min-height:2.7em;line-height:1.35}
.start{font-size:1.35em;background:var(--red);border-color:#8e2232;padding:.3em 1.3em}
#btnStart{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.big{font-size:1.9em;color:var(--yellow);text-shadow:.08em .08em 0 #000}
.stat{display:grid;grid-template-columns:auto auto auto auto;gap:.25em .8em;margin:0}
.stat dt{color:var(--dim)} .stat dd{margin:0;text-align:right}
ol.rank{margin:0;padding:0;list-style:none;width:100%;max-width:17em}
ol.rank li{display:flex;justify-content:space-between;padding:.12em .5em}
ol.rank li.me{background:var(--yellow);color:#1a1400}
.keys{color:var(--dim);font-size:.85em;line-height:1.6}
.help{color:var(--dim);font-size:12px;text-align:center;line-height:1.9;max-width:760px;margin:0}
.help kbd{font-family:inherit;color:var(--ink);background:var(--bezel);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:3px;padding:0 .35em}
/* 터치 패드 */
#pad{display:none;width:100%;max-width:440px;justify-content:space-between;align-items:center;touch-action:none}
body.touch #pad{display:flex}
body.touch .help{display:none}
.pb{font:inherit;color:var(--ink);background:#1c2740;border:2px solid #38507a;border-bottom-width:5px;
  border-radius:8px;font-size:18px;touch-action:none;padding:0;cursor:pointer}
.pb.on{transform:translateY(3px);border-bottom-width:2px;filter:brightness(1.3)}
.dpad{position:relative;width:min(150px,37vw);aspect-ratio:1}
.dpad .pb{position:absolute;width:34.6%;height:34.6%}
.dpad .u{left:32.7%;top:0}.dpad .l{left:0;top:32.7%}.dpad .r{right:0;top:32.7%}.dpad .d{left:32.7%;bottom:0}
.mid{display:flex;flex-direction:column;gap:14px;align-items:center}
.pill{width:min(66px,17vw);height:30px;border-radius:15px;font-size:11px}
.ab{position:relative;width:min(150px,37vw);aspect-ratio:1.2}
.ab .pb{position:absolute;width:44%;aspect-ratio:1;border-radius:50%;font-size:14px;
  background:#b8324a;border-color:#6e1c2c;line-height:1}
.ab .a{right:0;top:0}.ab .b{left:0;bottom:0}
.ab small{display:block;font-size:10px;opacity:.85;margin-top:1px}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="logo"><b>SKY ACE</b> · <a href="../../#arcade" class="home">추억의 오락실</a></div>
    <div class="tb">
      <button class="icon" id="btnPause" title="일시정지 (P)">II</button>
      <button class="icon" id="btnMute" title="소리 켜기/끄기 (M)" aria-pressed="false">♪</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov">
      <section class="scr" id="scrTitle">
        <h1><span style="color:#ffd84a">하</span><span style="color:#ff9d4a">늘</span> <span style="color:#4ac6ff">에</span><span style="color:#4ac6ff">이</span><span style="color:#4ac6ff">스</span></h1>
        <p class="sub">추억의 오락실 · 세로 스크롤 비행 슈팅</p>
        <div class="row"><span class="k">난이도</span>
          <button class="btn" data-diff="easy">쉬움</button>
          <button class="btn" data-diff="normal">보통</button>
          <button class="btn" data-diff="hard">어려움</button>
        </div>
        <p class="desc" id="diffDesc"></p>
        <button class="btn start" id="btnStart">START</button>
        <p class="sub" id="bestLine"></p>
        <p class="keys" id="titleKeys"></p>
      </section>

      <section class="scr hidden" id="scrPause">
        <p class="big">PAUSE</p>
        <div class="row">
          <button class="btn" data-tg="bgm"></button>
          <button class="btn" data-tg="sfx"></button>
        </div>
        <button class="btn start" id="btnResume">계속하기</button>
        <button class="btn" id="btnQuit">처음 화면으로</button>
      </section>

      <section class="scr hidden" id="scrStage">
        <p class="big" id="stageTitle"></p>
        <p id="stageBonus"></p>
        <p class="desc" id="stageNext"></p>
        <button class="btn start" id="btnNext">다음 스테이지</button>
      </section>

      <section class="scr hidden" id="scrOver">
        <p class="big" id="overTitle">GAME OVER</p>
        <p id="overMsg"></p>
        <dl class="stat" id="overStat"></dl>
        <ol class="rank" id="overRank"></ol>
        <div class="row" id="overBtns">
          <button class="btn start" id="btnContinue">이어하기 (점수 초기화)</button>
          <button class="btn" id="btnTitle">처음 화면</button>
        </div>
      </section>
    </div>
  </div>

  <div id="pad">
    <div class="dpad">
      <button class="pb u" data-act="up" tabindex="-1" aria-label="위">▲</button>
      <button class="pb l" data-act="left" tabindex="-1" aria-label="왼쪽">◀</button>
      <button class="pb r" data-act="right" tabindex="-1" aria-label="오른쪽">▶</button>
      <button class="pb d" data-act="down" tabindex="-1" aria-label="아래">▼</button>
    </div>
    <div class="mid">
      <button class="pb pill" data-act="pause" tabindex="-1">PAUSE</button>
    </div>
    <div class="ab">
      <button class="pb b" data-act="bomb" tabindex="-1" aria-label="폭탄">B<small>폭탄</small></button>
      <button class="pb a" data-act="fire" tabindex="-1" aria-label="사격">A<small>사격</small></button>
    </div>
  </div>

  <p class="help" id="help">
    <kbd>방향키</kbd>/<kbd>WASD</kbd> 8방향 이동 · <kbd>Z</kbd> 누르고 있으면 연사 ·
    <kbd>X</kbd> 폭탄 · <kbd>P</kbd> 일시정지 · <kbd>M</kbd> 소리
  </p>
</div>

<script>
(() => {
'use strict';

// ================= 상수 =================
const BW = 384, BH = 640;                 // 기준 해상도(세로)
const PLAYER_SPEED = 0.235;                // px/ms
const PLAYER_R = 3;                        // 판정: 기체 그림보다 훨씬 작은 점
const HIT_MAGNET = 11;                     // 아이템은 조금 더 넉넉하게 닿아도 먹는다
const FIRE_MS = 95;                        // 연사 간격
const PB_SPEED = 0.56;                     // 플레이어 탄 속도
const LEVEL_SHOTS = [
  [{ ox: 0, ang: 0 }],
  [{ ox: -5, ang: 0 }, { ox: 5, ang: 0 }],
  [{ ox: -7, ang: -7 }, { ox: 0, ang: 0 }, { ox: 7, ang: 7 }],
  [{ ox: -11, ang: -16 }, { ox: -5, ang: -6 }, { ox: 0, ang: 0 }, { ox: 5, ang: 6 }, { ox: 11, ang: 16 }],
];
const LEVEL_W = [3, 3.4, 4, 5];
const SCROLL_SPEED = 0.085;                // 지상/해상 목표물이 배경과 같이 흐르는 속도
const DIFF = {
  easy:   { eb: 0.13, bombs: 3, fireChance: 0.20, label: '쉬움', desc: '적탄이 느립니다. 처음이라면 이걸로.' },
  normal: { eb: 0.17, bombs: 2, fireChance: 0.32, label: '보통', desc: '적당한 긴장감. 오락실 표준 난이도.' },
  hard:   { eb: 0.21, bombs: 2, fireChance: 0.46, label: '어려움', desc: '적탄이 빠르고 많습니다. 손이 기억할 때.' },
};
const BOMB_INVULN_MS = 1600, HIT_INVULN_MS = 1900, RESPAWN_CLEAR_R = 60;
const STAGE_COUNT = 4;
const THEME = ['바다', '섬 지대', '구름 산맥', '항구'];
const THEME_DESC = [
  '낮게 깔린 파도 위, 소형 편대와 해상 포대가 기다립니다.',
  '정글이 우거진 섬들 사이로 대공포가 숨어 있습니다.',
  '구름 사이로 산등성이가 드러나는 산악 지대입니다.',
  '크레인이 늘어선 항구, 마지막 관문입니다.',
];

// ================= 픽셀 스프라이트 =================
// 문자 그리드 → [dx,dy,color] 셀 배열. 실존 게임 스프라이트를 베끼지 않은 독자 디자인.
const SPR = {};
function defSprite(name, rows, pal) {
  const h = rows.length, w = rows[0].length, cells = [];
  rows.forEach((row, y) => [...row].forEach((c, x) => { if (c !== '.') cells.push([x - w / 2 + 0.5, y - h / 2 + 0.5, pal[c]]); }));
  SPR[name] = cells;
}
// 절반(중앙 제외)만 적으면 좌우 대칭으로 완성 — 넓은 스프라이트를 실수 없이 정의하기 위함
function defSpriteSym(name, halfRows, pal) {
  defSprite(name, halfRows.map(r => r + [...r].reverse().join('')), pal);
}
defSprite('player', [ // 11x11, 약 32~40px로 확대 + 날개/조종석 디테일
  '.....a.....', '....aaa....', '...abcba...', '..abbcbba..', '.abbbcbbba.',
  'aaabbcbbaaa', '.aabbcbbaa.', '..a.bcb.a..', '..a.d.d.a..', '.aa.d.d.aa.', '.a...d...a.',
], { a: '#4a5a86', b: '#dfe8ff', c: '#3fc6ff', d: '#e8455a' });
defSprite('grunt', [ // 소형기 약 24px
  '....a....', '...aaa...', '..aebea..', '.aabbbaa.', 'aaabbbaaa',
  '.a.bbb.a.', '..a.b.a..', '.aa...aa.', 'a.......a',
], { a: '#7a1f30', b: '#d3435a', e: '#ffe08a' });
defSprite('crosser', [ // 쌍꼬리 소~중형기
  '..a.....a..', '.aa.....aa.', 'aaaa...aaaa', 'aabbbbbbbaa', 'aaaaeeaaaaa', '.aa..b..aa.', '..a..b..a..',
], { a: '#c98a2a', b: '#e0a53a', e: '#fff0b0' });
defSprite('diver', [ // 중형기 약 40px
  '....aaaa....', '...aabbaa...', '..aabbbbaa..', '.aabbeebbaa.', 'aabbbeebbbaa',
  'aaabbbbbbaaa', '.aa.bbbb.aa.', '..a..bb..a..', '..a...d...a.', '.aa...d...aa',
], { a: '#1f5c2f', b: '#6fcf6f', e: '#e8ffe0', d: '#2f8a3f' });
defSprite('strafer', [ // 섬 지대: 저공 기습기(신규)
  '....a....', '...aaa...', '..abbba..', '.aabbbaa.', 'aa.bbb.aa', '....b....',
], { a: '#c94a1f', b: '#f0803a' });
defSprite('sniper', [ // 구름 산맥: 저격기(신규), 조준 중 붉은 점 표시
  '....a....', '...aaa...', '..a...a..', '.a..b..a.', 'a...b...a',
  '.a..b..a.', '..a.b.a..', '...aba...', '....a....',
], { a: '#6a3f9e', b: '#e04a4a' });
defSprite('mine', [ // 항구: 부유 기뢰(신규)
  '....a....', '.a.aaa.a.', '..abbba..', '.abbbbba.', 'abbbcbbba',
  '.abbbbba.', '..abbba..', '.a.aaa.a.', '....a....',
], { a: '#3a4250', b: '#5c6779', c: '#e8455a' });
defSprite('turret', [ // 지상 목표 약 34px
  '....aa....', '....aa....', '...aaaa...', '..aaaaaa..',
  '.bbbbbbbb.', 'bbbbbbbbbb', 'bbbbbbbbbb', 'cbbbbbbbbc',
], { a: '#c9d0da', b: '#5c6779', c: '#3a4250' });
defSpriteSym('ship', [ // 해상 목표(대형): 좌우 대칭으로 포탑 2기
  '.....aa..', '.....aa..', '....aaaa.', '..bbbbbbb', '.bbbbbbbb', 'bbbbbbbbb', 'bbbbbbbbb', 'ccbbbbbbb',
], { a: '#c9d0da', b: '#5c6779', c: '#3a4250' });
defSprite('itemP', [
  '.aaa.', 'abcba', 'abcba', '.aaa.',
], { a: '#3fc6ff', b: '#1b6fa8', c: '#fff' });
defSprite('medal', [
  '.aa.', 'abba', 'abba', '.aa.',
], { a: '#e0a53a', b: '#fff0b0' });
const UNIT = { player: 3.4, grunt: 2.7, crosser: 2.6, strafer: 2.6, sniper: 2.7, mine: 2.6, diver: 3.3, turret: 3.4, ship: 4.4 };

// ================= 저장 =================
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경: 무시 */ } },
};
const settings = Object.assign({ difficulty: 'normal', bgm: true, sfx: true, muted: false }, store.get('ra-05-settings', {}));
const saveSettings = () => store.set('ra-05-settings', settings);

// ================= 사운드 (Web Audio로 직접 합성, 자작곡) =================
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
// 자작곡: 8마디 원형 루프(오리지널, 게임/영화 곡 아님)
const MEL = [
  [69,1],[72,1],[74,1],[76,1], [77,1],[76,1],[74,1],[72,1],
  [69,1],[72,1],[74,1],[77,1], [79,2],[0,2],
  [81,1],[79,1],[77,1],[76,1], [74,1],[76,1],[77,1],[79,1],
  [76,1],[74,1],[72,1],[69,1], [72,2],[0,2],
];
const BASSN = [45,45,52,52, 50,50,57,57, 45,45,52,52,48,48,45,45];
const BASS = BASSN.flatMap(n => [[n,0.5],[n+12,0.5]]);

const Sound = {
  ctx: null, out: null, bgmBus: null, timer: null, tracks: null,
  bgmOn: true, sfxOn: true, muted: false, tense: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.out = this.ctx.createGain();
    this.out.gain.value = this.muted ? 0 : 0.8;
    this.out.connect(this.ctx.destination);
    this.bgmBus = this.ctx.createGain();
    this.bgmBus.connect(this.out);
  },
  note(freq, t, dur, type, vol, dest, slideTo) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.setValueAtTime(vol, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.out);
    o.start(t); o.stop(t + dur + 0.03);
  },
  seq(freqs, t, step, type = 'square', vol = 0.06) {
    freqs.forEach((f, i) => this.note(f, t + i * step, step * 1.2, type, vol));
  },
  sfx(name, delay = 0) {
    if (!this.ctx || !this.sfxOn || this.muted) return;
    const f = SFX[name];
    if (f) f(this, this.ctx.currentTime + delay);
  },
  bgmStart(delay = 0.08) {
    if (!this.ctx || !this.bgmOn || this.muted || this.timer) return;
    const now = this.ctx.currentTime, t0 = now + delay;
    this.bgmBus.gain.cancelScheduledValues(now);
    this.bgmBus.gain.setValueAtTime(1, now);
    this.tracks = [
      { seq: MEL, i: 0, t: t0, type: 'square', vol: 0.045, gate: 0.85 },
      { seq: BASS, i: 0, t: t0, type: 'triangle', vol: 0.12, gate: 0.75 },
    ];
    const tick = () => {
      const at = this.ctx.currentTime, spb = 60 / (this.tense ? 184 : 140);
      for (const tr of this.tracks) {
        while (tr.t < at + 0.2) {
          const [m, beats] = tr.seq[tr.i], d = beats * spb;
          if (m) this.note(midiHz(m), tr.t, d * tr.gate, tr.type, tr.vol, this.bgmBus);
          tr.t += d;
          tr.i = (tr.i + 1) % tr.seq.length;
        }
      }
    };
    tick();
    this.timer = setInterval(tick, 40);
  },
  bgmStop() {
    if (!this.timer) return;
    clearInterval(this.timer);
    this.timer = null;
    const now = this.ctx.currentTime;
    this.bgmBus.gain.cancelScheduledValues(now);
    this.bgmBus.gain.setValueAtTime(this.bgmBus.gain.value, now);
    this.bgmBus.gain.linearRampToValueAtTime(0, now + 0.05);
  },
  setMuted(m) {
    this.muted = m;
    if (this.out) this.out.gain.value = m ? 0 : 0.8;
    if (m) this.bgmStop();
  },
};
const SFX = {
  shoot:      (s, t) => s.note(620, t, 0.03, 'square', 0.02, null, 480),
  hit:        (s, t) => s.note(220, t, 0.03, 'square', 0.03),

function ebSpeed() { return diffOf().eb * (G.loop === 2 ? 1.3 : 1); }

}

    G.enemies.push({
      type: 'grunt', formId: id, hp: 1, hpMax: 1,
      x: xStart + dir * i * 10, y: -20 - i * 46, vy: 0.10 + Math.min(0.05, G.stage * 0.006),
      seed: Math.random() * 1000, fireT: 700 + Math.random() * 900, hitR: 9, scoreVal: 100,
    });

}

// ================= 플레이어 =================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function movePlayer(dt) {
  let dx = 0, dy = 0;
  if (Input.left) dx -= 1; if (Input.right) dx += 1;
  if (Input.up) dy -= 1; if (Input.down) dy += 1;
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
  const p = G.player;
  p.x = clamp(p.x + dx * PLAYER_SPEED * dt, 14, BW - 14);
  p.y = clamp(p.y + dy * PLAYER_SPEED * dt, 36, BH - 20);
}
function updateFire(dt) {
  G.fireT -= dt;
  if (Input.fire && G.player.alive && G.state === 'playing' && G.fireT <= 0) {
    G.fireT = FIRE_MS;
    const shots = LEVEL_SHOTS[G.player.level - 1], w = LEVEL_W[G.player.level - 1];
    for (const s of shots) {
      const rad = s.ang * Math.PI / 180;
      G.bullets.push({ x: G.player.x + s.ox, y: G.player.y - 12, vx: Math.sin(rad) * PB_SPEED, vy: -Math.cos(rad) * PB_SPEED, w });
    }
    spawnFlash(G.player.x, G.player.y - 16);
    Sound.sfx('shoot');
  }
}
function useBomb() {
  if (G.state !== 'playing' || G.bombs <= 0 || !G.player.alive) return;
  G.bombs--;
  G.ebullets.length = 0; // 화면의 적탄을 지운다
  G.lasers.length = 0;
  G.invulnT = Math.max(G.invulnT, BOMB_INVULN_MS);
  G.bombFxT = 500;
  for (const e of [...G.enemies]) damageEnemy(e, 6); // 큰 피해
  if (G.boss) {
    damageBoss(14, null);
    for (const part of G.boss.parts) if (part.hp > 0) damageBoss(6, part.key);
  }
  Sound.sfx('bomb');
}

function dropItem(type, x, y, val) {
  G.items.push({ type, x, y, vy: 0.09, val: val || 0 });
}
function pickupsCheck() {
  const p = G.player;
  for (let i = G.items.length - 1; i >= 0; i--) {
    const it = G.items[i];
    if (Math.hypot(it.x - p.x, it.y - p.y) < PLAYER_R + HIT_MAGNET) {
      if (it.type === 'P') { p.level = Math.min(4, p.level + 1); Sound.sfx('powerup'); popup('POWER UP', '#3fc6ff', p.x, p.y - 20); }
      else { G.score += it.val; Sound.sfx('medal'); popup('+' + it.val, '#e0a53a', p.x, p.y - 20); }
      G.items.splice(i, 1);
    }
  }
}
function hitPlayer() {
  if (G.invulnT > 0 || !G.player.alive || G.state !== 'playing') return;
  G.lives--;
  Sound.sfx('playerhit');
  if (G.lives <= 0) { G.player.alive = false; gameOver(); return; }
  G.player.level = Math.max(1, G.player.level - 1);
  dropItem('P', G.player.x, G.player.y - 10);
  G.player.x = BW / 2; G.player.y = BH - 90;
  G.invulnT = HIT_INVULN_MS;
  G.bombs = diffOf().bombs; // 목숨을 잃으면 폭탄 수 초기화
  G.ebullets = G.ebullets.filter(b => Math.hypot(b.x - G.player.x, b.y - G.player.y) > RESPAWN_CLEAR_R);
}

// ================= 공용: 탄/피격/아이템 =================
function fireAimed(x, y, speed) {
  const p = G.player, dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1, sp = speed || ebSpeed();
  G.ebullets.push({ x, y, vx: dx / d * sp, vy: dy / d * sp, r: 3.5 });
}
function fireAimedSpread(x, y, count, spreadDeg, speed) {
  const p = G.player, dx = p.x - x, dy = p.y - y, base = Math.atan2(dy, dx), sp = speed || ebSpeed();
  for (let i = 0; i < count; i++) {
    const off = (i - (count - 1) / 2) * (spreadDeg * Math.PI / 180);
    const a = base + off;
    G.ebullets.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3.8 });
  }
}
function fireRing(x, y, count, speed) {
  const sp = (speed || ebSpeed()) * 0.8;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    G.ebullets.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3.6 });
  }
}
function popup(text, color, x, y) { G.popups.push({ text, color, x, y, t: 0 }); }
function spawnBoom(x, y, n, color) { // 파편 + 연기로 이루어진 폭발
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 0.05 + Math.random() * 0.14;
    G.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 400 + Math.random() * 300, kind: 'debris', color: color || '#ffb04a' });
  }
  for (let i = 0; i < 4; i++) spawnSmoke(x + (Math.random() - 0.5) * 10, y + (Math.random() - 0.5) * 10);
}
function spawnSmoke(x, y) {
  G.particles.push({
    x, y, vx: (Math.random() - 0.5) * 0.02, vy: -0.015 - Math.random() * 0.02,
    life: 450 + Math.random() * 250, maxLife: 700, r: 4 + Math.random() * 6, kind: 'smoke',
  });
}
function spawnFlash(x, y) { // 사격 시 총구 섬광
  G.particles.push({ x, y, vx: 0, vy: 0, life: 70, maxLife: 70, kind: 'flash', color: '#fff5c0' });
}
function formationBonus(id) {
  const f = G.formations[id];
  if (!f) return;
  if (f.killed + f.escaped >= f.spawned) {
    if (f.escaped === 0 && f.spawned >= 3) {
      G.score += 500 * G.stage;
      popup('편대 전멸 보너스 +' + (500 * G.stage), '#ff7ad9', G.player.x, G.player.y - 40);
      Sound.sfx('medal');
    }
    delete G.formations[id];
  }
}
function killEnemy(e) {
  G.score += e.scoreVal * G.stage;
  spawnBoom(e.x, e.y, 10, '#ffb04a');
  Sound.sfx('boom');
  if (e.type === 'mine') fireRing(e.x, e.y, 8, ebSpeed() * 0.9); // 기뢰는 죽을 때 원형 탄막을 터뜨린다
  if (Math.random() < (e.type === 'diver' ? 0.7 : 0.16)) dropItem(Math.random() < 0.5 ? 'P' : 'medal', e.x, e.y, 80);
  else if (e.type === 'turret' || e.type === 'ship') dropItem('medal', e.x, e.y, 150);
  if (e.formId) { G.formations[e.formId].killed++; formationBonus(e.formId); }
}
function damageEnemy(e, dmg) {
  e.hp -= dmg;
  Sound.sfx('hit');
  if (e.hp <= 0) {
    const i = G.enemies.indexOf(e);
    if (i >= 0) G.enemies.splice(i, 1);
    killEnemy(e);
  }
}

// ================= 적 갱신 =================
function updateEnemies(dt) {
  for (let i = G.enemies.length - 1; i >= 0; i--) {
    const e = G.enemies[i];
    if (e.type === 'grunt') {
      e.y += e.vy * dt;
      e.x += Math.sin((G.time + e.seed) * 0.0035) * 0.06 * dt;
      e.x = clamp(e.x, 16, BW - 16);
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 0 && e.y < BH - 60) { e.fireT = 1400 + Math.random() * 900; if (Math.random() < diffOf().fireChance + 0.15) fireAimed(e.x, e.y + 8); }
      if (e.y > BH + 30) { G.enemies.splice(i, 1); if (e.formId) { G.formations[e.formId].escaped++; formationBonus(e.formId); } }
    } else if (e.type === 'crosser') {
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (!e.fired && Math.abs(e.x - BW / 2) < 40) { e.fired = true; fireAimedSpread(e.x, e.y + 6, 3, 22); }
      if (e.x < -50 || e.x > BW + 50) { G.enemies.splice(i, 1); if (e.formId) { G.formations[e.formId].escaped++; formationBonus(e.formId); } }
    } else if (e.type === 'diver') {
      if (e.dstate === 'enter') {
        e.y += 0.13 * dt;
        if (e.y >= e.hoverY) { e.y = e.hoverY; e.dstate = 'hover'; e.fireT = 500; }
      } else if (e.dstate === 'hover') {
        e.fireT -= dt;
        if (e.fireT <= 0) { fireAimedSpread(e.x, e.y + 10, 3, 26); e.bursts++; e.fireT = 420; if (e.bursts >= 2) e.dstate = 'retreat'; }
      } else if (e.dstate === 'retreat') {
        e.y -= 0.17 * dt;
        if (e.y < -40) G.enemies.splice(i, 1);
      }
    } else if (e.type === 'turret') {
      e.y += SCROLL_SPEED * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 20 && e.y < BH - 40) { e.fireT = 1300 + Math.random() * 500; if (Math.random() < diffOf().fireChance + 0.2) fireAimed(e.x, e.y + 6); }
      if (e.y > BH + 40) G.enemies.splice(i, 1);
    } else if (e.type === 'ship') {
      e.y += SCROLL_SPEED * dt; e.driftT += dt;
      e.x = e.baseX + Math.sin(e.driftT * 0.0012) * 30;
      e.guns.forEach((gx, gi) => {
        e.gunFireT[gi] -= dt;
        if (e.gunFireT[gi] <= 0 && e.y > 20 && e.y < BH - 40) { e.gunFireT[gi] = 1500 + Math.random() * 500; fireAimed(e.x + gx, e.y + 6); }
      });
      if (e.y > BH + 40) G.enemies.splice(i, 1);
    } else if (e.type === 'strafer') { // 섬 지대: 저공에서 빠르게 가로질러 기습
      e.x += e.vx * dt;
      if (!e.fired && Math.abs(e.x - BW / 2) < 50) {
        e.fired = true;
        G.ebullets.push({ x: e.x, y: e.y + 4, vx: 0, vy: ebSpeed() * 1.3, r: 3.2 });
        G.ebullets.push({ x: e.x - (e.vx > 0 ? 8 : -8), y: e.y + 4, vx: e.vx > 0 ? -0.02 : 0.02, vy: ebSpeed() * 1.2, r: 3 });
      }
      if (e.x < -60 || e.x > BW + 60) { G.enemies.splice(i, 1); if (e.formId) { G.formations[e.formId].escaped++; formationBonus(e.formId); } }
    } else if (e.type === 'sniper') { // 구름 산맥: 멈춰서 정밀 조준 후 발사
      if (e.dstate === 'enter') {
        e.y += 0.14 * dt;
        if (e.y >= e.targetY) { e.y = e.targetY; e.dstate = 'aim'; e.fireT = 700; }
      } else if (e.dstate === 'aim') {
        e.fireT -= dt;
        if (e.fireT <= 0) { e.dstate = 'fire'; e.fireT = 260; }
      } else if (e.dstate === 'fire') {
        e.fireT -= dt;
        if (e.fireT <= 0) { fireAimed(e.x, e.y + 8, ebSpeed() * 1.8); e.dstate = 'cool'; e.fireT = 1300; }
      } else if (e.dstate === 'cool') {
        e.fireT -= dt;
        if (e.fireT <= 0) { e.dstate = 'aim'; e.fireT = 700; }
      }
    } else if (e.type === 'mine') { // 항구: 천천히 떠다니는 기뢰(닿거나 부수면 터진다)
      e.y += e.vy * dt; e.x += e.drift * dt;
      if (e.y > BH + 30) G.enemies.splice(i, 1);
    }
  }
}

  G.boss = {
    kind: def.kind, name: def.name, x: BW / 2, y: -70, targetY: def.kind === 'fortress' ? 140 : 110, state: 'enter',
    hp: Math.round(def.hpMax * scale), hpMax: Math.round(def.hpMax * scale), phase: 1, dyingT: 0,
    bodyR: def.bodyR, fireT: 900, driftT: 0, spiralA: 0, laserT: 1800, aimT: 1200,
    parts: def.parts.map(p => ({ ...p, hp: Math.round(p.hp * scale), hpMax: Math.round(p.hp * scale) })),
  };
  Sound.sfx('bossalert');
  Sound.tense = true;
}
function damageBoss(dmg, partKey) {
  const b = G.boss;
  if (!b || b.state === 'dying') return;
  if (partKey) {
    const part = b.parts.find(p => p.key === partKey);
    if (part && part.hp > 0) {
      part.hp -= dmg;
      if (part.hp <= 0) { part.hp = 0; G.score += 300 * G.stage; popup('부위 파괴!', '#ffd84a', b.x + part.ox, b.y + part.oy); }
      return;
    }
  }
  b.hp -= dmg;
  Sound.sfx('hit');
  if (b.hp <= 0) { b.hp = 0; b.state = 'dying'; b.dyingT = 0; }
}
function updateBoss(dt) {
  const b = G.boss;
  if (!b) return;
  if (b.state === 'enter') {
    b.y += 0.07 * dt;
    if (b.y >= b.targetY) { b.y = b.targetY; b.state = 'fight'; }
    return;
  }
  if (b.state === 'dying') {
    b.dyingT += dt;
    if (Math.random() < 0.5) spawnBoom(b.x + (Math.random() - 0.5) * 70, b.y + (Math.random() - 0.5) * 40, 5, '#ffd84a');
    if (Math.random() < 0.3) spawnSmoke(b.x + (Math.random() - 0.5) * 70, b.y + (Math.random() - 0.5) * 40);
    if (b.dyingT >= 1500) bossDefeated();
    return;
  }
  b.phase = b.hp <= b.hpMax * 0.5 ? 2 : 1;
  BOSS_UPDATE[b.kind](b, dt);
}
// 1) 전함: 포탑 3기가 개별 파괴 가능. 페이즈2에서 전 포탑 확산탄
function updateBattleship(b, dt) {
  b.driftT += dt;
  b.x = BW / 2 + Math.sin(b.driftT * 0.0009) * 60;
  const alive = b.parts.filter(p => p.hp > 0);
  b.fireT -= dt;
  const interval = b.phase === 1 ? 1300 : 800;
  if (b.fireT <= 0 && alive.length) {
    b.fireT = interval;
    for (const part of alive) {
      if (b.phase === 1) fireAimed(b.x + part.ox, b.y + part.oy + 10);
      else fireAimedSpread(b.x + part.ox, b.y + part.oy + 10, 3, 16);
    }
  }
  if (b.phase === 2 && Math.random() < 0.02) fireRing(b.x, b.y, 12);
}
// 2) 폭격기: 날개 엔진에서 폭탄 투하. 페이즈2에서 기수 확산탄 추가
function updateBomber(b, dt) {
  b.driftT += dt;
  b.x = BW / 2 + Math.sin(b.driftT * 0.0011) * 50;
  const [eL, eR] = b.parts;
  b.fireT -= dt;
  const interval = b.phase === 1 ? 650 : 420;
  if (b.fireT <= 0) {
    b.fireT = interval;
    const useL = Math.floor(b.driftT / interval) % 2 === 0;
    const src = (useL && eL.hp > 0) ? eL : (eR.hp > 0 ? eR : (eL.hp > 0 ? eL : null));
    if (src) G.ebullets.push({ x: b.x + src.ox, y: b.y + src.oy, vx: (Math.random() - 0.5) * 0.03, vy: ebSpeed() * 1.1, r: 4 });
    if (b.phase === 2) fireAimedSpread(b.x, b.y + 16, 3, 18);
  }
}
// 3) 비행선: 회전 나선탄. 페이즈2에서 이중 나선 + 조준탄
function updateAirship(b, dt) {
  b.driftT += dt;
  b.x = BW / 2 + Math.sin(b.driftT * 0.0007) * 40;
  b.spiralA += dt * (b.phase === 1 ? 0.006 : 0.01);
  b.fireT -= dt;
  const interval = b.phase === 1 ? 90 : 70;
  if (b.fireT <= 0) {
    b.fireT = interval;
    const sp = ebSpeed() * 0.85;
    G.ebullets.push({ x: b.x, y: b.y + 18, vx: Math.cos(b.spiralA) * sp, vy: Math.sin(b.spiralA) * sp + 0.05, r: 3.6 });
    if (b.phase === 2) G.ebullets.push({ x: b.x, y: b.y + 18, vx: Math.cos(b.spiralA + Math.PI) * sp, vy: Math.sin(b.spiralA + Math.PI) * sp + 0.05, r: 3.6 });
  }
  if (b.phase === 2) { b.aimT -= dt; if (b.aimT <= 0) { b.aimT = 1400; fireAimed(b.x, b.y + 18); } }
}
// 4) 요새: 포문 확산탄 + 레이저 휩쓸기. 페이즈2에서 더 빠르고 두 줄기
function updateFortress(b, dt) {
  const [cL, cR] = b.parts;
  b.fireT -= dt;
  const fanInterval = b.phase === 1 ? 1500 : 1000;
  if (b.fireT <= 0) {
    b.fireT = fanInterval;
    if (cL.hp > 0) fireAimedSpread(b.x + cL.ox, b.y + cL.oy + 8, 3, 18);
    if (cR.hp > 0) fireAimedSpread(b.x + cR.ox, b.y + cR.oy + 8, 3, 18);
  }
  b.laserT -= dt;
  const laserInterval = b.phase === 1 ? 2600 : 1700;
  if (b.laserT <= 0) {
    b.laserT = laserInterval;
    spawnLaser(b.phase === 2 ? 70 : 120, b.phase === 2 ? 1 : -1, b.y + 30);
    if (b.phase === 2) spawnLaser(BW - 70, -1, b.y + 30);
  }
}
const BOSS_UPDATE = { battleship: updateBattleship, bomber: updateBomber, airship: updateAirship, fortress: updateFortress };
function bossDefeated() {
  Sound.sfx('bossdown');
  Sound.tense = false;
  G.score += 5000 * G.stage;
  G.boss = null;
  stageClear();
}

// ================= 레이저(요새 보스 전용 휩쓸기 탄막) =================
function spawnLaser(x0, dir, y0) {
  G.lasers.push({ x: x0, y0, w: 12, t: 0, warnMs: 500, fireMs: 900, vx: 0.1 * dir, state: 'warn' });
}
function updateLasers(dt) {
  for (const l of G.lasers) {
    l.t += dt;
    if (l.state === 'warn' && l.t >= l.warnMs) { l.state = 'fire'; l.t = 0; }
    else if (l.state === 'fire') l.x += l.vx * dt;
  }
  G.lasers = G.lasers.filter(l => !(l.state === 'fire' && l.t >= l.fireMs) && l.x > -40 && l.x < BW + 40);
}

// ================= 충돌 판정 =================
function updateCollisions() {
  const p = G.player;
  // 플레이어 탄 vs 적
  for (let bi = G.bullets.length - 1; bi >= 0; bi--) {
    const b = G.bullets[bi];
    let used = false;
    for (let ei = 0; ei < G.enemies.length; ei++) {
      const e = G.enemies[ei];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.hitR) { damageEnemy(e, 1); used = true; break; }
    }
    if (!used && G.boss && G.boss.state === 'fight') {
      const bo = G.boss;
      let hitPart = null;
      for (const part of bo.parts) {
        if (part.hp > 0 && Math.hypot(b.x - (bo.x + part.ox), b.y - (bo.y + part.oy)) < part.r) { hitPart = part.key; break; }
      }
      if (hitPart) { damageBoss(1, hitPart); used = true; }
      else if (Math.hypot(b.x - bo.x, b.y - bo.y) < bo.bodyR) { damageBoss(1, null); used = true; }
    }
    if (used || b.y < -20 || b.y > BH + 20 || b.x < -20 || b.x > BW + 20) G.bullets.splice(bi, 1);
  }
  // 적탄 vs 플레이어
  if (G.invulnT <= 0 && p.alive) {
    for (const eb of G.ebullets) { if (Math.hypot(eb.x - p.x, eb.y - p.y) < PLAYER_R + eb.r) { hitPlayer(); break; } }
  }
  // 레이저 휩쓸기 vs 플레이어
  if (G.invulnT <= 0 && p.alive) {
    for (const l of G.lasers) { if (l.state === 'fire' && Math.abs(l.x - p.x) < l.w / 2 + PLAYER_R && p.y > l.y0) { hitPlayer(); break; } }
  }
  // 적/보스 몸체 vs 플레이어 (충돌)
  if (G.invulnT <= 0 && p.alive) {
    for (const e of G.enemies) { if (Math.hypot(e.x - p.x, e.y - p.y) < PLAYER_R + e.hitR * 0.75) { hitPlayer(); break; } }
  }
  pickupsCheck();
}

// ================= 배경(스테이지별로 완전히 다르게) =================
function setupBackground(themeIdx) {
  const rand = mulberry32(1000 + themeIdx * 77 + G.stage * 13);
  const feats = [];
  for (let i = 0; i < 16; i++) feats.push({ y: i * 220 + rand() * 140, x: 20 + rand() * (BW - 40), s: 18 + rand() * 26, v: rand() });
  const cloudsBack = [];
  for (let i = 0; i < 9; i++) cloudsBack.push({ y: i * 340 + rand() * 220, x: rand() * BW, s: 36 + rand() * 44, a: 0.08 + rand() * 0.08 });
  const cloudsFront = [];
  for (let i = 0; i < 6; i++) cloudsFront.push({ y: i * 420 + rand() * 260, x: rand() * BW, s: 60 + rand() * 60, a: 0.32 + rand() * 0.18 });
  G.bg = { theme: themeIdx, scrollY: 0, features: feats, cloudsBack, cloudsFront };
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const THEME_GRAD = [ // [위쪽, 아래쪽]
  ['#1a5f8a', '#0a2338'], // 바다
  ['#0f3d2e', '#0a2218'], // 섬 지대
  ['#4a5c78', '#1c2534'], // 구름 산맥
  ['#343b48', '#15181f'], // 항구
];
function drawBackground() {
  const idx = G.bg.theme || 0, sy = G.bg.scrollY;
  const grad = ctx.createLinearGradient(0, 0, 0, BH);
  grad.addColorStop(0, THEME_GRAD[idx][0]); grad.addColorStop(1, THEME_GRAD[idx][1]);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, BW, BH);
  for (const c of G.bg.cloudsBack) { // 먼 구름/안개 층(스테이지 공통, 아주 옅게)
    let wy = c.y - (sy * 0.5 % 3200); if (wy < -120) wy += 3200; if (wy > BH + 120) wy -= 3200;
    ctx.fillStyle = `rgba(255,255,255,${c.a})`;
    ctx.beginPath(); ctx.ellipse(c.x, wy, c.s, c.s * 0.4, 0, 0, 7); ctx.fill();
  }
  const span = 220 * 16;
  for (const f of G.bg.features) {
    let wy = f.y - (sy % span); if (wy < -70) wy += span; if (wy > BH + 70) wy -= span;
    drawFeature(idx, f, f.x, wy);
  }
  if (idx === 0) drawSeaWaves(sy);
}
function drawSeaWaves(sy) { // 물결 무늬 + 흰 파도 반짝임
  ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const yBase = ((i * 140 + sy * 0.5) % (BH + 140)) - 70;
    ctx.beginPath();
    for (let x = 0; x <= BW; x += 12) {
      const yy = yBase + Math.sin(x * 0.05 + sy * 0.01 + i) * 6;
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 0; i < 16; i++) {
    const fx = (i * 53 + 37) % BW;
    const fy = ((i * 97 + sy * 0.5) % (BH + 90)) - 45;
    if ((Math.floor(sy * 0.02 + i)) % 5 === 0) ctx.fillRect(fx, fy, 3, 2);
  }
}
function drawForegroundClouds() { // 구름 산맥: 기체 위로 지나가는 반투명 구름층(전경, 시차 2층째)
  if (G.bg.theme !== 2) return;
  const sy = G.bg.scrollY;
  for (const c of G.bg.cloudsFront) {
    let wy = c.y - (sy * 1.3 % 3200); if (wy < -140) wy += 3200; if (wy > BH + 140) wy -= 3200;
    ctx.fillStyle = `rgba(255,255,255,${c.a})`;
    ctx.beginPath(); ctx.ellipse(c.x, wy, c.s, c.s * 0.4, 0, 0, 7); ctx.ellipse(c.x + c.s * 0.5, wy + c.s * 0.12, c.s * 0.6, c.s * 0.28, 0, 0, 7); ctx.fill();
  }
}
function drawFeature(idx, f, x, y) {
  if (idx === 0) { // 바다: 섬(모래톱 + 정글 + 바위)
    ctx.fillStyle = '#1c4a70'; ctx.beginPath(); ctx.ellipse(x, y + f.s * 0.45, f.s * 1.1, f.s * 0.3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#d8c27a'; ctx.beginPath(); ctx.ellipse(x, y, f.s, f.s * 0.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#2e6b3a'; ctx.beginPath(); ctx.ellipse(x, y - f.s * 0.1, f.s * 0.72, f.s * 0.38, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#3f8a4a'; ctx.beginPath(); ctx.arc(x - f.s * 0.25, y - f.s * 0.2, f.s * 0.22, 0, 7); ctx.arc(x + f.s * 0.2, y - f.s * 0.05, f.s * 0.18, 0, 7); ctx.fill();
    if (f.v > 0.6) { ctx.fillStyle = '#8a95a0'; ctx.beginPath(); ctx.arc(x + f.s * 0.5, y + f.s * 0.16, f.s * 0.13, 0, 7); ctx.fill(); }
  } else if (idx === 1) { // 섬 지대: 모래 테두리 + 짙은 정글 + 나무 + 바위
    ctx.fillStyle = '#d8c27a'; ctx.beginPath(); ctx.ellipse(x, y, f.s * 1.15, f.s * 0.62, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#245c33'; ctx.beginPath(); ctx.ellipse(x, y - f.s * 0.05, f.s * 0.9, f.s * 0.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#316f3f';
    ctx.beginPath(); ctx.arc(x - f.s * 0.35, y - f.s * 0.2, f.s * 0.26, 0, 7); ctx.arc(x + f.s * 0.3, y, f.s * 0.24, 0, 7); ctx.arc(x - f.s * 0.02, y - f.s * 0.32, f.s * 0.2, 0, 7); ctx.fill();
    if (f.v > 0.5) { ctx.fillStyle = '#7d8894'; ctx.beginPath(); ctx.ellipse(x + f.s * 0.55, y + f.s * 0.18, f.s * 0.16, f.s * 0.1, 0, 0, 7); ctx.fill(); }
  } else if (idx === 2) { // 구름 산맥: 만년설 산등성이(원경)
    ctx.fillStyle = '#2c3a4c';
    ctx.beginPath(); ctx.moveTo(x - f.s, y + f.s * 0.65); ctx.lineTo(x - f.s * 0.2, y - f.s * 0.5); ctx.lineTo(x + f.s * 0.15, y - f.s * 0.1); ctx.lineTo(x + f.s, y + f.s * 0.65); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3d4f66';
    ctx.beginPath(); ctx.moveTo(x - f.s * 0.2, y - f.s * 0.5); ctx.lineTo(x, y - f.s * 0.68); ctx.lineTo(x + f.s * 0.15, y - f.s * 0.1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.moveTo(x - f.s * 0.08, y - f.s * 0.58); ctx.lineTo(x, y - f.s * 0.68); ctx.lineTo(x + f.s * 0.06, y - f.s * 0.56); ctx.closePath(); ctx.fill();
  } else { // 항구: 부두 + 창고 지붕 + 정박한 배
    ctx.fillStyle = '#2e3440'; ctx.fillRect(x - f.s * 0.6, y - f.s * 0.1, f.s * 1.2, f.s * 0.22);
    ctx.fillStyle = '#454f60'; ctx.fillRect(x - f.s * 0.42, y - f.s * 0.75, f.s * 0.84, f.s * 0.68);
    ctx.fillStyle = '#5a6577';
    ctx.beginPath(); ctx.moveTo(x - f.s * 0.46, y - f.s * 0.75); ctx.lineTo(x, y - f.s * 0.95); ctx.lineTo(x + f.s * 0.46, y - f.s * 0.75); ctx.closePath(); ctx.fill();
    if (f.v > 0.5) {
      ctx.fillStyle = '#3a4250'; ctx.fillRect(x - f.s * 0.55, y + f.s * 0.06, f.s * 0.5, f.s * 0.16);
      ctx.fillStyle = '#232833'; ctx.fillRect(x - f.s * 0.2, y - f.s * 0.06, f.s * 0.06, f.s * 0.28);
    }
  }
}

// ================= 진행 흐름 =================
function resetRun() {
  G.loop = 1; G.stage = 1; G.stageT = 0; G.scriptIdx = 0; G.bossSpawned = false;
  G.lives = 3; G.bombs = diffOf().bombs; G.bombMax = diffOf().bombs;
  G.score = 0; G.time = 0; G.invulnT = 0; G.bombFxT = 0; G.fireT = 0;
  G.player = { x: BW / 2, y: BH - 90, level: 1, alive: true };
  G.bullets = []; G.ebullets = []; G.enemies = []; G.items = []; G.particles = []; G.popups = []; G.lasers = [];
  G.boss = null; G.formations = {};
  const top = store.get('ra-05-scores', []);
  G.best = top.length ? top[0].s : 0;
  Sound.tense = false;
}
function setupStage() {
  G.stageT = 0; G.scriptIdx = 0; G.bossSpawned = false;
  G.script = buildStageScript(G.stage);
  G.enemies = []; G.ebullets = []; G.items = [];
  setupBackground((G.stage - 1) % STAGE_COUNT);
  Sound.bgmStart(0.2);
}
function startGame() {
  Sound.init(); applySound();
  resetRun();
  hideOverlay(); resetInput();
  Sound.sfx('start');
  G.state = 'playing';
  setupStage();
}
function updateStageScript(dt) {
  if (G.state !== 'playing' || G.boss) return;
  G.stageT += dt;
  while (G.scriptIdx < G.script.length && G.script[G.scriptIdx][0] <= G.stageT) {
    G.script[G.scriptIdx][1]();
    G.scriptIdx++;
  }
  const lastT = G.script.length ? G.script[G.script.length - 1][0] : 0;
  if (!G.bossSpawned && G.scriptIdx >= G.script.length && G.enemies.length === 0 && G.stageT > lastT + 2000) {
    G.bossSpawned = true;
    spawnBoss();
  }
}
function stageClear() {
  G.state = 'stageclear';
  Sound.bgmStop();
  Sound.sfx('stageclear');
  const bonus = 800 * G.stage * G.loop;
  G.score += bonus;
  $('#stageTitle').textContent = (G.loop === 2 ? '2회차 ' : '') + 'STAGE ' + G.stage + ' CLEAR!';
  $('#stageBonus').textContent = '클리어 보너스 +' + bonus;
  const isLast = G.stage >= STAGE_COUNT;
  if (isLast && G.loop === 1) $('#stageNext').textContent = '축하합니다! 2회차(더 빠른 적탄)로 넘어갑니다.';
  else if (isLast && G.loop === 2) $('#stageNext').textContent = '모든 스테이지를 2회차까지 클리어했습니다!';
  else $('#stageNext').textContent = '다음은 ' + THEME[(G.stage) % STAGE_COUNT] + ' 스테이지입니다.';
  $('#btnNext').textContent = isLast && G.loop === 2 ? '처음 화면으로' : '다음 스테이지';
  showScreen('scrStage');
}
function nextStage() {
  if (G.state !== 'stageclear') return;
  if (G.stage >= STAGE_COUNT) {
    if (G.loop === 1) { G.loop = 2; G.stage = 1; }
    else { saveScore(); goTitle(); return; }
  } else G.stage++;
  G.bombs = G.bombMax;
  hideOverlay();
  G.state = 'playing';
  setupStage();
}
function gameOver() {
  G.state = 'over'; G.curtainT = 0; G.overShown = false;
  resetInput();
  Sound.bgmStop(); Sound.tense = false;
  Sound.sfx('over');
  G.rank = saveScore();
}
function saveScore() {
  const entry = { s: G.score, stage: G.stage, loop: G.loop, d: Date.now() };
  const top = [...store.get('ra-05-scores', []), entry].sort((a, b) => b.s - a.s).slice(0, 5);
  store.set('ra-05-scores', top);
  return top.indexOf(entry);
}
function showGameOver() {
  G.overShown = true;
  const msg = G.rank === 0 && G.score > 0 ? '★ 최고 기록 달성! ★' : G.rank > 0 ? '역대 ' + (G.rank + 1) + '위 기록!' : '한 판 더?';
  $('#overMsg').textContent = msg;
  $('#overStat').innerHTML = '<dt>점수</dt><dd>' + G.score + '</dd><dt>스테이지</dt><dd>' + (G.loop === 2 ? '2회차 ' : '') + G.stage + '</dd>';
  const top = store.get('ra-05-scores', []);
  $('#overRank').innerHTML = top.map((e, i) => '<li class="' + (i === G.rank ? 'me' : '') + '"><span>' + (i + 1) + '. ' + String(e.s).padStart(6, '0') + '</span><span>ST ' + e.stage + '</span></li>').join('');
  showScreen('scrOver');
}
function continueRun() {
  if (G.state !== 'over' || !G.overShown) return;
  const stage = G.stage, loop = G.loop, diff = G.difficulty;
  resetRun();
  G.stage = stage; G.loop = loop; G.difficulty = diff;
  Sound.init(); applySound();
  hideOverlay(); resetInput();
  G.state = 'playing';
  setupStage();
}
function pause() {
  if (G.state !== 'playing') return;
  G.prevState = G.state; G.state = 'paused';
  resetInput(); Sound.bgmStop(); Sound.sfx('pause');
  refreshToggles();
  showScreen('scrPause');
}
function resume() {
  if (G.state !== 'paused') return;
  G.state = G.prevState;
  hideOverlay();
  Sound.init(); Sound.bgmStart();
}
const togglePause = () => (G.state === 'paused' ? resume() : pause());
function goTitle() {
  Sound.bgmStop(); Sound.tense = false;
  G.state = 'title';
  resetRun();
  refreshTitle();
  showScreen('scrTitle');
}

// ================= 입력 =================
const Input = { left: false, right: false, up: false, down: false, fire: false };
function resetInput() {
  Object.assign(Input, { left: false, right: false, up: false, down: false, fire: false });
  document.querySelectorAll('.pb.on').forEach(b => b.classList.remove('on'));
}
function press(act) {
  if (act === 'pause') { togglePause(); return; }
  if (act === 'left') Input.left = true;
  else if (act === 'right') Input.right = true;
  else if (act === 'up') Input.up = true;
  else if (act === 'down') Input.down = true;
  else if (act === 'fire') Input.fire = true;
  else if (act === 'bomb') useBomb();
}
function release(act) {
  if (act === 'left') Input.left = false;
  else if (act === 'right') Input.right = false;
  else if (act === 'up') Input.up = false;
  else if (act === 'down') Input.down = false;
  else if (act === 'fire') Input.fire = false;
}
function menuInput(act) {
  switch (G.state) {
    case 'title': if (act === 'ok') startGame(); break;
    case 'paused': if (act === 'ok') resume(); break;
    case 'stageclear': if (act === 'ok') nextStage(); break;
    case 'over': if (!G.overShown) break; if (act === 'ok') continueRun(); else if (act === 'back') goTitle(); break;
  }
}

const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', KeyZ: 'fire' };
const MENUKEY = { Enter: 'ok', NumpadEnter: 'ok', Space: 'ok' };

window.addEventListener('keydown', e => {
  const code = e.code;
  const ovOpen = !ov.classList.contains('hidden');
  const btnFocused = ovOpen && document.activeElement && document.activeElement.tagName === 'BUTTON';
  if ((code === 'Enter' || code === 'Space') && btnFocused) return;
  if (code === 'KeyM') { if (!e.repeat) toggleMute(); return; }
  if (code === 'KeyX') { e.preventDefault(); if (!e.repeat && G.state === 'playing') useBomb(); return; }
  if (code === 'KeyP' || code === 'Escape') {
    e.preventDefault();
    if (e.repeat) return;
    if (code === 'Escape' && G.state === 'over') menuInput('back'); else togglePause();
    return;
  }
  if (G.state !== 'playing') {
    const m = MENUKEY[code];
    if (m) { e.preventDefault(); if (!e.repeat) menuInput(m); }
    return;
  }
  const act = KEYMAP[code];
  if (!act) return;
  e.preventDefault();
  press(act);
});
window.addEventListener('keyup', e => { const act = KEYMAP[e.code]; if (act) release(act); });
window.addEventListener('blur', () => { resetInput(); pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { resetInput(); pause(); } });

document.querySelectorAll('#pad [data-act]').forEach(b => {
  const act = b.dataset.act;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    b.classList.add('on');
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* 일부 브라우저 미지원 */ }
    Sound.init();
    if (G.state === 'playing' || act === 'pause') press(act);
    else if (act === 'fire' || act === 'up') menuInput('ok');
  });
  const up = () => { b.classList.remove('on'); release(act); };
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

// ================= 화면(DOM) =================
const $ = s => document.querySelector(s);
const ov = $('#ov');
const SCREENS = ['scrTitle', 'scrPause', 'scrStage', 'scrOver'];
function showScreen(id) {
  ov.classList.remove('hidden');
  SCREENS.forEach(s => $('#' + s).classList.toggle('hidden', s !== id));
}
function hideOverlay() {
  ov.classList.add('hidden');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function setDifficulty(d) {
  G.difficulty = d; settings.difficulty = d; saveSettings();
  refreshTitle(); Sound.sfx('select');
}
function refreshTitle() {
  document.querySelectorAll('[data-diff]').forEach(b => b.classList.toggle('sel', b.dataset.diff === G.difficulty));
  $('#diffDesc').textContent = diffOf().desc;
  const top = store.get('ra-05-scores', []);
  const best = top.length ? top[0].s : 0;
  $('#bestLine').textContent = best ? '최고 점수 ' + String(best).padStart(6, '0') : '아직 기록이 없어요';
  refreshToggles();
}
function refreshTitleKeys() {
  $('#titleKeys').innerHTML = document.body.classList.contains('touch')
    ? '십자패드 8방향 이동 · A 누르고 있으면 연사 · B 폭탄'
    : '방향키/WASD 이동 · Z 누르고 있으면 연사 · X 폭탄';
}
function refreshToggles() {
  document.querySelectorAll('[data-tg]').forEach(b => {
    const k = b.dataset.tg, label = k === 'bgm' ? '음악' : '효과음';
    b.classList.toggle('sel', settings[k]);
    b.textContent = label + ' ' + (settings[k] ? 'ON' : 'OFF');
  });
  $('#btnMute').setAttribute('aria-pressed', String(settings.muted));
}
function applySound() {
  Sound.bgmOn = settings.bgm; Sound.sfxOn = settings.sfx;
  Sound.setMuted(settings.muted);
  if (!settings.bgm) Sound.bgmStop();
}
function toggleMute() {
  settings.muted = !settings.muted; saveSettings();
  Sound.init(); applySound(); refreshToggles();
  if (!settings.muted && G.state === 'playing') Sound.bgmStart();
}

document.querySelectorAll('[data-diff]').forEach(b => b.addEventListener('click', () => setDifficulty(b.dataset.diff)));
document.querySelectorAll('[data-tg]').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.tg; settings[k] = !settings[k]; saveSettings(); applySound(); refreshToggles();
}));
$('#btnStart').addEventListener('click', startGame);
$('#btnResume').addEventListener('click', resume);
$('#btnQuit').addEventListener('click', goTitle);
$('#btnNext').addEventListener('click', nextStage);
$('#btnContinue').addEventListener('click', continueRun);
$('#btnTitle').addEventListener('click', goTitle);
$('#btnPause').addEventListener('click', e => { e.currentTarget.blur(); togglePause(); });
$('#btnMute').addEventListener('click', e => { e.currentTarget.blur(); toggleMute(); });

// ================= 그리기 =================
const cv = $('#cv'), ctx = cv.getContext('2d');
let scale = 1, DPR = 1;
function layout() {
  const touch = document.body.classList.contains('touch');
  const app = $('#app'), hdr = $('#hdr');
  const cs = getComputedStyle(app);
  const below = touch ? $('#pad').offsetHeight : $('#help').offsetHeight;
  const used = hdr.offsetHeight + below + 16 + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = window.innerWidth - 16, availH = window.innerHeight - used;
  scale = Math.max(0.45, Math.min(availW / BW, availH / BH));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  const cw = Math.round(BW * scale), ch = Math.round(BH * scale);
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  hdr.style.width = cw + 'px';
  document.documentElement.style.setProperty('--u', Math.round(scale * 20) + 'px');
}
function drawSprite(cells, cx, cy, unit) {
  for (const [dx, dy, color] of cells) { ctx.fillStyle = color; ctx.fillRect(Math.round(cx + dx * unit), Math.round(cy + dy * unit), unit, unit); }
}
function txt(s, x, y, px, color, align) {
  ctx.font = px + 'px Galmuri11, monospace';
  ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  ctx.fillText(s, x, y);
}
function drawPlayer() {
  const p = G.player;
  if (!p.alive) return;
  if (G.invulnT > 0 && Math.floor(G.time / 80) % 2 === 0) return; // 무적 중 점멸
  const flick = 9 + Math.sin(G.time * 0.03) * 4 + (Input.fire ? 3 : 0); // 엔진 불꽃
  ctx.fillStyle = '#ffb04a';
  ctx.beginPath(); ctx.moveTo(p.x - 5, p.y + 16); ctx.lineTo(p.x + 5, p.y + 16); ctx.lineTo(p.x, p.y + 16 + flick); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff59a';
  ctx.beginPath(); ctx.moveTo(p.x - 2, p.y + 16); ctx.lineTo(p.x + 2, p.y + 16); ctx.lineTo(p.x, p.y + 16 + flick * 0.5); ctx.closePath(); ctx.fill();
  drawSprite(SPR.player, p.x, p.y, UNIT.player);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, PLAYER_R, 0, 7); ctx.fill();
}
function drawEnemies() {
  for (const e of G.enemies) {
    drawSprite(SPR[e.type], e.x, e.y, UNIT[e.type] || 2.6);
    if (e.type === 'sniper' && (e.dstate === 'aim' || e.dstate === 'fire')) { // 저격 조준 경고
      ctx.fillStyle = e.dstate === 'fire' ? '#ff3030' : 'rgba(255,60,60,.6)';
      ctx.beginPath(); ctx.arc(e.x, e.y + 2, 3, 0, 7); ctx.fill();
    }
  }
}
function drawBossPart(part, b, color) { // 보스 부위(포탑/엔진 등) 공용 렌더링
  const x = b.x + part.ox, y = b.y + part.oy;
  ctx.fillStyle = part.hp > 0 ? color : '#22262c';
  ctx.beginPath(); ctx.arc(x, y, part.r, 0, 7); ctx.fill();
  if (part.hp > 0) { ctx.fillStyle = '#c9d0da'; ctx.fillRect(x - 2, y - part.r - 6, 4, 8); }
}
function drawBattleshipBody(b) {
  ctx.fillStyle = '#2a3542'; ctx.fillRect(b.x - 70, b.y - 14, 140, 30);
  ctx.fillStyle = '#3a4a58'; ctx.fillRect(b.x - 70, b.y - 14, 140, 10);
  ctx.fillStyle = '#232b36'; ctx.fillRect(b.x - 14, b.y - 30, 28, 20);
  for (const part of b.parts) drawBossPart(part, b, '#5c6779');
}
function drawBomberBody(b) {
  ctx.fillStyle = '#3a4a2c';
  ctx.beginPath(); ctx.moveTo(b.x, b.y - 16); ctx.lineTo(b.x + 80, b.y + 18); ctx.lineTo(b.x + 20, b.y + 22); ctx.lineTo(b.x, b.y + 10);
  ctx.lineTo(b.x - 20, b.y + 22); ctx.lineTo(b.x - 80, b.y + 18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4a6a3a'; ctx.beginPath(); ctx.ellipse(b.x, b.y, 22, 14, 0, 0, 7); ctx.fill();
  for (const part of b.parts) drawBossPart(part, b, '#2a3a20');
}
function drawAirshipBody(b) {
  ctx.fillStyle = '#5a4a78'; ctx.beginPath(); ctx.ellipse(b.x, b.y - 6, 60, 26, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a6a9a'; ctx.beginPath(); ctx.ellipse(b.x - 10, b.y - 14, 40, 14, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a3050'; ctx.fillRect(b.x - 18, b.y + 14, 36, 14);
}
function drawFortressBody(b) {
  ctx.fillStyle = '#5a4e3a';
  ctx.beginPath(); ctx.moveTo(b.x - 72, b.y + 22); ctx.lineTo(b.x - 58, b.y - 20); ctx.lineTo(b.x + 58, b.y - 20); ctx.lineTo(b.x + 72, b.y + 22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7a6a4a'; ctx.fillRect(b.x - 40, b.y - 14, 80, 14);
  ctx.fillStyle = '#e8455a'; ctx.beginPath(); ctx.arc(b.x, b.y - 2, 9, 0, 7); ctx.fill();
  for (const part of b.parts) drawBossPart(part, b, '#4a4030');
}
const BOSS_DRAW = { battleship: drawBattleshipBody, bomber: drawBomberBody, airship: drawAirshipBody, fortress: drawFortressBody };
function drawBoss() {
  const b = G.boss;
  if (!b) return;
  ctx.globalAlpha = b.state === 'dying' ? Math.max(0.15, 1 - b.dyingT / 1500) : 1;
  BOSS_DRAW[b.kind](b);
  ctx.globalAlpha = 1;
  if (b.state === 'fight' || b.state === 'enter') {
    const w = 220, x0 = BW / 2 - w / 2, y0 = 14;
    ctx.fillStyle = '#10132a'; ctx.fillRect(x0, y0, w, 10);
    ctx.fillStyle = b.phase === 2 ? '#e8455a' : '#4acb5a';
    ctx.fillRect(x0, y0, w * Math.max(0, b.hp / b.hpMax), 10);
    ctx.strokeStyle = '#343a74'; ctx.strokeRect(x0 + 0.5, y0 + 0.5, w - 1, 9);
    txt(b.name, BW / 2, y0 + 12, 11, '#ffffff', 'center');
  }
}
function drawLasers() { // 요새 보스 레이저: 예고선 -> 굵은 빔
  for (const l of G.lasers) {
    if (l.state === 'warn') {
      ctx.strokeStyle = 'rgba(255,80,80,.55)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(l.x, l.y0); ctx.lineTo(l.x, BH); ctx.stroke(); ctx.setLineDash([]);
    } else {
      ctx.fillStyle = 'rgba(255,60,60,.7)'; ctx.fillRect(l.x - l.w / 2, l.y0, l.w, BH - l.y0);
      ctx.fillStyle = '#fff'; ctx.fillRect(l.x - 1.5, l.y0, 3, BH - l.y0);
    }
  }
}
function drawBullets() {
  ctx.fillStyle = '#bfe8ff';
  for (const b of G.bullets) ctx.fillRect(b.x - b.w / 2, b.y - 6, b.w, 12);
  ctx.fillStyle = '#ff9a4a';
  for (const b of G.ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }
}
function drawItems() {
  for (const it of G.items) drawSprite(it.type === 'P' ? SPR.itemP : SPR.medal, it.x, it.y, 2.6);
}
function drawParticles() { // 파편(debris) + 연기(smoke) + 총구 섬광(flash)
  for (const pt of G.particles) {
    if (pt.kind === 'smoke') {
      const t = 1 - pt.life / pt.maxLife;
      ctx.globalAlpha = Math.max(0, (pt.life / pt.maxLife) * 0.4);
      ctx.fillStyle = '#8a8a8a';
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r * (1 + t * 1.5), 0, 7); ctx.fill();
    } else if (pt.kind === 'flash') {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 4, pt.y - 2, 8, 4); ctx.fillRect(pt.x - 2, pt.y - 4, 4, 8);
    } else {
      ctx.globalAlpha = Math.max(0, pt.life / 500);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 1.5, pt.y - 1.5, 3, 3);
    }
  }
  ctx.globalAlpha = 1;
}
function drawHUD() {
  txt('SCORE', 10, 8, 10, '#88a0bd');
  txt(String(G.score).padStart(6, '0'), 10, 20, 15, '#ffd84a');
  const stageLbl = (G.loop === 2 ? '2회차 ' : '') + 'STAGE ' + G.stage + ' · ' + THEME[(G.stage - 1) % STAGE_COUNT];
  txt(stageLbl, BW - 10, 8, 10, '#88a0bd', 'right');
  txt('LIFE ' + '♥'.repeat(Math.max(0, G.lives)), BW - 10, 20, 12, '#e8455a', 'right');
  txt('BOMB ' + '●'.repeat(Math.max(0, G.bombs)) + '○'.repeat(Math.max(0, G.bombMax - G.bombs)), BW - 10, 34, 12, '#3fc6ff', 'right');
  txt('LV' + G.player.level, 10, 34, 12, '#eaf2ff');
  ctx.font = '13px Galmuri11, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.lineJoin = 'round';
  G.popups.forEach(p => {
    const y = p.y - (Math.min(p.t, 300) / 300) * 18;
    ctx.globalAlpha = p.t < 700 ? 1 : Math.max(0, 1 - (p.t - 700) / 400);
    ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(p.text, p.x, y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, y);
  });
  ctx.globalAlpha = 1;
  if (G.bombFxT > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (G.bombFxT / 500 * 0.5) + ')'; ctx.fillRect(0, 0, BW, BH); }
}
function draw() {
  ctx.setTransform(scale * DPR, 0, 0, scale * DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  drawBackground();
  drawItems(); drawEnemies(); drawBoss(); drawLasers(); drawBullets(); drawParticles(); drawPlayer();
  drawForegroundClouds();
  if (G.state === 'playing' || G.state === 'paused') drawHUD();
  if (G.state === 'paused') { ctx.fillStyle = 'rgba(4,8,14,.4)'; ctx.fillRect(0, 0, BW, BH); }
  if (G.state === 'over') {
    const n = Math.min(BH, (G.curtainT / 900) * BH);
    ctx.fillStyle = 'rgba(4,8,14,' + Math.min(0.85, n / BH) + ')'; ctx.fillRect(0, 0, BW, BH);
  }
}

// ================= 루프 =================
function update(dt) {
  for (const p of G.popups) p.t += dt;
  G.popups = G.popups.filter(p => p.t < 1100);
  for (const pt of G.particles) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
  G.particles = G.particles.filter(pt => pt.life > 0);
  if (G.bombFxT > 0) G.bombFxT = Math.max(0, G.bombFxT - dt);
  if (G.invulnT > 0) G.invulnT = Math.max(0, G.invulnT - dt);

  if (G.state === 'playing') {
    G.time += dt;
    movePlayer(dt); updateFire(dt);
    for (const b of G.bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    for (const b of G.ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    G.ebullets = G.ebullets.filter(b => b.x > -20 && b.x < BW + 20 && b.y > -20 && b.y < BH + 20);
    for (const it of G.items) it.y += it.vy * dt;
    G.items = G.items.filter(it => it.y < BH + 20);
    G.bg.scrollY += SCROLL_SPEED * dt;
    updateStageScript(dt);
    updateEnemies(dt);
    updateBoss(dt);
    updateLasers(dt);
    updateCollisions();
  } else if (G.state === 'over') {
    G.curtainT += dt;
    if (!G.overShown && G.curtainT >= 900) showGameOver();
  }
}

let last = performance.now();
function frame(now) {
  let dt = Math.min(50, now - last);
  last = now;
  dt *= (window.__TS || 1); // 헤드리스 검증용 시간 배속(기본 1, 실제 플레이엔 영향 없음)
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ================= 시작 =================
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
window.addEventListener('touchstart', () => {
  if (document.body.classList.contains('touch')) return;
  document.body.classList.add('touch'); refreshTitleKeys(); layout();
}, { passive: true });
window.addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

applySound();
resetRun();
setupBackground(0);
refreshTitleKeys();
refreshTitle();
layout();
showScreen('scrTitle');
requestAnimationFrame(frame);
})();
</script>

<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>미로 먹보 | 추억의 오락실</title>
<meta name="description" content="그 시절 오락실 미로 점 먹기를 브라우저에서. PC 키보드와 모바일 터치 모두 지원합니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="미로 먹보 | 추억의 오락실">
<meta property="og:description" content="네 마리 도깨비를 피해 미로의 점을 모두 먹어치우세요. 큰 알약을 먹으면 잠깐 역전!">

<style>
:root{
  --bg:#0a0c18; --bezel:#161a33; --line:#343a74; --ink:#eef0ff; --dim:#8d93c4;
  --yellow:#ffd84a; --red:#e8455a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:radial-gradient(ellipse at 50% 0%,#1b2046 0%,var(--bg) 62%) fixed,var(--bg);
  color:var(--ink);font-family:Galmuri11,monospace;word-break:keep-all;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo b{color:var(--yellow);font-weight:400}
.logo .home{color:inherit;text-decoration:none}
.logo .home:hover{color:var(--ink);text-decoration:underline}
.tb{display:flex;gap:6px}
.icon{font:inherit;font-size:12px;min-width:34px;height:30px;color:var(--ink);background:var(--bezel);
  border:2px solid var(--line);border-radius:4px;cursor:pointer}
.icon[aria-pressed="true"]{color:var(--dim);text-decoration:line-through}
#stage{position:relative}
canvas{display:block;border-radius:6px;touch-action:none;box-shadow:0 0 0 3px #20254a,0 10px 40px rgba(0,0,0,.6)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:rgba(6,7,16,.87);border-radius:6px;padding:12px;font-size:clamp(11px,2.4vw,17px)}
.hidden{display:none!important}
.scr{width:100%;max-width:26em;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.8em}
h1{margin:0;font-family:Galmuri14,Galmuri11,monospace;font-weight:400;font-size:2em;line-height:1.15;letter-spacing:.06em;
  text-shadow:.08em .08em 0 #000}
p{margin:0}
.sub{color:var(--dim)}
.row{display:flex;align-items:center;justify-content:center;gap:.5em;flex-wrap:wrap}
.k{color:var(--dim);margin-right:.2em}
.btn{font:inherit;color:var(--ink);background:#23284c;border:2px solid #4a5196;border-bottom-width:4px;
  border-radius:4px;padding:.45em .8em;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.sel{background:var(--yellow);color:#1a1400;border-color:#b3902a}
.lv{min-width:2.2em;display:inline-block;font-size:1.3em;color:var(--yellow);font-weight:400}
.desc{color:var(--dim);font-size:.9em;min-height:2.4em;line-height:1.35}
.start{font-size:1.4em;background:var(--red);border-color:#8e2232;padding:.3em 1.3em}

@keyframes blink{50%{opacity:.55}}
.big{font-size:2em;color:var(--yellow);text-shadow:.08em .08em 0 #000}
.stat{display:grid;grid-template-columns:auto auto auto auto;gap:.25em .8em;margin:0}
.stat dt{color:var(--dim)} .stat dd{margin:0;text-align:right}
ol.rank{margin:0;padding:0;list-style:none;width:100%;max-width:17em}
ol.rank li{display:flex;justify-content:space-between;padding:.12em .5em}
ol.rank li.me{background:var(--yellow);color:#1a1400}
.help{color:var(--dim);font-size:12px;text-align:center;line-height:1.7;max-width:760px;margin:0}

/* 터치 D패드 */
#pad{display:none;width:100%;max-width:200px;justify-content:center;touch-action:none}
body.touch #pad{display:flex}
body.touch .help{display:none}
.pb{font:inherit;color:var(--ink);background:#262b50;border:2px solid #4a5196;border-bottom-width:5px;

.dpad .u{left:32.7%;top:0}.dpad .l{left:0;top:32.7%}.dpad .r{right:0;top:32.7%}.dpad .d{left:32.7%;bottom:0}

<body>
<div id="app">
  <header id="hdr">
    <div class="logo"><b>미로 먹보</b> · <a href="../../#arcade" class="home">추억의 오락실</a></div>
    <div class="tb">
      <button class="icon" id="btnPause" title="일시정지 (P)">II</button>
      <button class="icon" id="btnBgm" title="음악 켜기/끄기" aria-pressed="false">♪</button>
      <button class="icon" id="btnSfx" title="효과음 켜기/끄기" aria-pressed="false">FX</button>

  <div id="stage">

    <div class="overlay" id="ov">
      <section class="scr" id="scrTitle">
        <h1><span style="color:#ffd84a">미</span><span style="color:#ff9a4a">로</span> <span style="color:#4acb5a">먹</span><span style="color:#35d6ea">보</span></h1>
        <p class="sub">추억의 오락실 · 미로 점 먹기</p>
        <div class="row"><span class="k">시작 스테이지</span>
          <button class="btn" id="lvDn" aria-label="낮추기">◀</button><b class="lv" id="lvVal">1</b><button class="btn" id="lvUp" aria-label="올리기">▶</button>
        </div>

        <button class="btn start" id="btnStart">START</button>
        <p class="sub" id="bestLine"></p>
        <p class="sub" id="titleKeys"></p>
      </section>

      <section class="scr hidden" id="scrPause">

        <div class="row">

        <div class="row">
          <button class="btn start" id="btnRetry">다시 하기</button>
          <button class="btn" id="btnTitle">처음 화면</button>

    </div>
  </div>

  <div id="pad">
    <div class="dpad">
      <button class="pb u" data-dir="0" tabindex="-1" aria-label="위">▲</button>
      <button class="pb l" data-dir="1" tabindex="-1" aria-label="왼쪽">◀</button>
      <button class="pb r" data-dir="3" tabindex="-1" aria-label="오른쪽">▶</button>
      <button class="pb d" data-dir="2" tabindex="-1" aria-label="아래">▼</button>
    </div>
  </div>

  <p class="help" id="help">
    <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 이동(WASD 가능) · <kbd>P</kbd> 일시정지 · <kbd>M</kbd> 음악
  </p>
</div>

<script>
(() => {
'use strict';

// ================= 미로 정의(직접 설계, 좌우 대칭·양끝 터널·가운데 도깨비 집) =================
const COLS = 19, ROWS = 21;
const HUD_TOP = 2, HUD_BOT = 1; // 캔버스 안에서 위/아래 여백(점수판)
const TUNNEL_ROW = 13;
const HOUSE_EXIT = { r: 7, c: 9 };
const HOUSE_DOOR = { r: 8, c: 9 };
const HOUSE_SLOT_ROW = 10;
const HOUSE_SLOTS = [{ r: 10, c: 8 }, { r: 10, c: 9 }, { r: 10, c: 10 }];
const PLAYER_START = { r: 13, c: 9 };
// 두 종류 미로를 스테이지마다 번갈아 사용한다
const MAZES = [
[
  "###################",
  "#o...............o#",
  "#.#####.#.#.#####.#",
  "#.....#.#.#.#.....#",
  "#.###.#.#.#.#.###.#",
  "#.#...#.....#...#.#",
  "#.#.#####.#####.#.#",
  "#.#.#.........#.#.#",
  "#.#.#.###D###.#.#.#",
  "#.#...##HHH##...#.#",
  "#.######HHH######.#",
  "#.#...##HHH##...#.#",
  "#.#.#.#######.#.#.#",
  "..#...... ......#..",
  "#.#.#.###.###.#.#.#",
  "#.#.#.........#.#.#",
  "#.#.#####.#####.#.#",
  "#.#...#.....#...#.#",
  "#.###.#.#.#.#.###.#",
  "#o...............o#",
  "###################",
],
[
  "###################",
  "#o....#.....#....o#",
  "#.#.#.#.#.#.#.#.#.#",
  "#.#.#.#.#.#.#.#.#.#",
  "#.#.#.#.#.#.#.#.#.#",
  "#...#...#.#...#...#",
  "#########.#########",
  "#...#.........#...#",
  "#.#.#.###D###.#.#.#",
  "#.....##HHH##.....#",
  "#.######HHH######.#",
  "#.#...##HHH##...#.#",
  "#.#.#.#######.#.#.#",
  "..#...... ......#..",
  "#.#####.#.#.#####.#",
  "#...#...#.#...#...#",
  "###.#.###.###.#.###",
  "#...#...#.#...#...#",
  "#.###.#.#.#.#.###.#",
  "#o....#.....#....o#",
  "###################",
],
];
// 위 문자열의 " " (빈칸)은 점 없는 통로: 문 앞·플레이어 출발칸

// 방향: 0=위 1=왼쪽 2=아래 3=오른쪽 (갈림길에서 동점일 때 이 순서로 고른다)
const DV = [[-1,0],[0,-1],[1,0],[0,1]];
const PRIORITY = [0,1,2,3];
const opp = d => (d + 2) % 4;

const SCATTER_TARGETS = [
  { r: -3, c: COLS + 3 },   // 0호: 우상단 밖
  { r: -3, c: -4 },         // 1호: 좌상단 밖
  { r: ROWS + 3, c: COLS + 3 }, // 2호: 우하단 밖
  { r: ROWS + 3, c: -4 },   // 3호: 좌하단 밖
];
const MODE_SCHEDULE = [7000, 20000, 7000, 20000, 5000, 20000, 5000, 9999999];
const FRUIT_POS = { r: 13, c: 9 };
const FRUIT_KINDS = ['붕어빵', '호떡', '가래떡'];
const FRUIT_SCORES = [100, 200, 500, 700, 1000, 2000, 3000, 5000];
const EXTRA_LIFE_SCORE = 10000;
const PLAYER_SPEED = 6.6, GHOST_SPEED = 6.0, GHOST_FRIGHT_SPEED = 3.6, GHOST_EYES_SPEED = 10.5;

// ================= 저장 =================
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경: 무시 */ } },
};
const settings = Object.assign({ startLevel: 1, bgm: true, sfx: true }, store.get('ra-03-settings', {}));
const saveSettings = () => store.set('ra-03-settings', settings);

// ================= 사운드 (Web Audio 직접 합성) =================
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
// 림스키코르사코프 '왕벌의 비행'(퍼블릭 도메인, 1900년作)의 반음계 하강·상승 모티프를
// 느리게 단순화해 직접 편곡한 배경 선율(원곡 그대로가 아님)
const RUN_UP = [72,73,74,75,76,77,78,79,80,81,82,83,84];
const RUN_DN = [84,83,82,81,80,79,78,77,76,75,74,73,72];
const MELODY = [...RUN_DN, ...RUN_UP, ...RUN_DN, ...RUN_UP].map(m => [m, 0.5]);

const Sound = {
  ctx: null, out: null, bgmBus: null, timer: null, tr: null,
  bgmOn: true, sfxOn: true,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.out = this.ctx.createGain(); this.out.gain.value = 0.8; this.out.connect(this.ctx.destination);
    this.bgmBus = this.ctx.createGain(); this.bgmBus.connect(this.out);
  },
  note(freq, t, dur, type, vol, dest, slideTo) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.setValueAtTime(vol, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.out);
    o.start(t); o.stop(t + dur + 0.03);
  },
  seq(freqs, t, step, type = 'square', vol = 0.06) { freqs.forEach((f, i) => this.note(f, t + i * step, step * 1.2, type, vol)); },
  sfx(name, delay = 0) {
    if (!this.ctx || !this.sfxOn) return;
    const f = SFX[name]; if (f) f(this, this.ctx.currentTime + delay);
  },
  bgmStart(delay = 0.05) {
    if (!this.ctx || !this.bgmOn || this.timer) return;
    const t0 = this.ctx.currentTime + delay;
    this.tr = { i: 0, t: t0 };
    const tick = () => {
      const at = this.ctx.currentTime;
      while (this.tr.t < at + 0.2) {
        const [m, beats] = MELODY[this.tr.i], d = beats * (60 / 300);
        this.note(midiHz(m), this.tr.t, d * 0.9, 'square', 0.035, this.bgmBus);
        this.tr.t += d; this.tr.i = (this.tr.i + 1) % MELODY.length;
      }
    };
    tick(); this.timer = setInterval(tick, 45);
  },
  bgmStop() { if (!this.timer) return; clearInterval(this.timer); this.timer = null; },
};
const SFX = {
  chomp1: (s, t) => s.note(240, t, 0.045, 'square', 0.05, null, 160),
  chomp2: (s, t) => s.note(160, t, 0.045, 'square', 0.05, null, 240),
  power:  (s, t) => s.seq([220, 330, 440, 550], t, 0.05, 'sawtooth', 0.06),
  eatghost: (s, t) => s.seq([300, 500, 700, 900], t, 0.035, 'square', 0.07),
  fruit: (s, t) => s.seq([523, 659, 784, 1047, 1319], t, 0.045, 'square', 0.06),
  death: (s, t) => s.seq([440, 392, 349, 311, 277, 233, 196, 165, 131, 98], t, 0.09, 'sawtooth', 0.06),
  extralife: (s, t) => s.seq([392, 494, 587, 784, 988, 784, 988], t, 0.06, 'square', 0.06),
  start: (s, t) => s.seq([262, 330, 392, 523, 659, 784], t, 0.055),
  ready: (s, t) => s.seq([523, 659, 523, 659, 784], t, 0.09, 'square', 0.05),
  pause: (s, t) => s.seq([988, 1319], t, 0.07),
  select: (s, t) => s.note(880, t, 0.04, 'square', 0.035),
  stage: (s, t) => s.seq([523, 523, 523, 659, 587, 659, 784, 1047], t, 0.1, 'square', 0.06),
  over: (s, t) => s.seq([392, 349, 311, 277, 233, 196], t, 0.14, 'square', 0.05),
};

// ================= 미로 격자 유틸 =================
function cloneMaze(rows) { return rows.map(r => r.split('')); }
function countDots(grid) { let n = 0; for (const row of grid) for (const ch of row) if (ch === '.' || ch === 'o') n++; return n; }
function stepPos(r, c, dr, dc) {
  let nr = r + dr, nc = c + dc;
  if (r === TUNNEL_ROW) { if (nc < 0) nc = COLS - 1; else if (nc >= COLS) nc = 0; }
  return [nr, nc];
}
function tileAt(r, c) {
  if (r < 0 || r >= ROWS) return '#';
  if (c < 0 || c >= COLS) return r === TUNNEL_ROW ? G.grid[r][(c + COLS) % COLS] : '#';
  return G.grid[r][c];
}
function isWallPlayer(r, c) { const ch = tileAt(r, c); return ch === '#' || ch === 'D' || ch === 'H'; }
function isWallGhost(r, c, state) {
  const ch = tileAt(r, c);
  if (ch === '#') return true;
  if (ch === 'D') return !(state === 'leaving' || state === 'eyes' || state === 'entering');
  return false; // '.', 'o', ' ', 'H' 모두 도깨비에게는 통행 가능
}
function candidateDirs(r, c, wallFn) {
  const out = [];
  for (const d of PRIORITY) { const [nr, nc] = stepPos(r, c, DV[d][0], DV[d][1]); if (!wallFn(nr, nc)) out.push(d); }
  return out;
}
function reverseActor(a) {
  if (a.dir == null) return;
  const [nr, nc] = stepPos(a.r, a.c, DV[a.dir][0], DV[a.dir][1]);
  a.r = nr; a.c = nc; a.dir = opp(a.dir); a.t = 1 - a.t;
}

// ================= 게임 상태 =================
const G = {
  state: 'title', level: 1, startLevel: settings.startLevel,
  grid: null, dotsTotal: 0, dotsRemaining: 0, dotsEatenLife: 0,
  score: 0, best: 0, lives: 3, extraLifeGiven: false,
  mode: 'scatter', modeIndex: 0, modeT: 0, frightT: 0, frightDur: 7000, chain: 0,
  speedMul: 1, noEatT: 0, fruitSpawned: 0, fruitAt: [0, 0], fruit: null,
  readyT: 0, dyingT: 0, clearT: 0, popups: [], time: 0,
  player: null, ghosts: [], overShown: false, rank: -1,
};

function computeTarget(g) {
  if (g.state === 'eyes') return HOUSE_EXIT;
  if (g.state === 'scatter') return SCATTER_TARGETS[g.idx];
  const p = G.player;
  const face = p.dir != null ? p.dir : (p.lastDir != null ? p.lastDir : 1);
  const pv = DV[face];
  if (g.idx === 0) return { r: p.r, c: p.c };
  if (g.idx === 1) return { r: p.r + pv[0] * 4, c: p.c + pv[1] * 4 };
  if (g.idx === 2) {
    const blinky = G.ghosts[0];
    const ahead = { r: p.r + pv[0] * 2, c: p.c + pv[1] * 2 };
    return { r: blinky.r + 2 * (ahead.r - blinky.r), c: blinky.c + 2 * (ahead.c - blinky.c) };
  }
  const dr = g.r - p.r, dc = g.c - p.c;
  return (dr * dr + dc * dc) > 64 ? { r: p.r, c: p.c } : SCATTER_TARGETS[3];
}

function decidePlayer(a) {
  const all = candidateDirs(a.r, a.c, isWallPlayer);
  if (a.wantDir != null && all.includes(a.wantDir)) return a.wantDir;
  if (a.dir != null && all.includes(a.dir)) return a.dir;
  const fwd = a.dir == null ? all : all.filter(d => d !== opp(a.dir));
  return fwd.length === 1 ? fwd[0] : null;
}
function pickNearest(opts, r, c, target) {
  let best = null, bestD = Infinity;
  for (const d of opts) {
    const [nr, nc] = stepPos(r, c, DV[d][0], DV[d][1]);
    const dist = (nr - target.r) ** 2 + (nc - target.c) ** 2;
    if (dist < bestD) { bestD = dist; best = d; }
  }
  return best;
}
function decideGhost(a) {
  let opts = candidateDirs(a.r, a.c, (r, c) => isWallGhost(r, c, a.state));
  if (a.dir != null) { const nr = opts.filter(d => d !== opp(a.dir)); if (nr.length) opts = nr; }
  return pickNearest(opts, a.r, a.c, computeTarget(a));
}
function decideFright(a) {
  let opts = candidateDirs(a.r, a.c, (r, c) => isWallGhost(r, c, 'frightened'));
  if (a.dir != null) { const nr = opts.filter(d => d !== opp(a.dir)); if (nr.length) opts = nr; }
  return opts.length ? opts[(Math.random() * opts.length) | 0] : null;
}
function decideEyes(a) {
  const opts = candidateDirs(a.r, a.c, (r, c) => isWallGhost(r, c, 'eyes'));
  return pickNearest(opts, a.r, a.c, HOUSE_EXIT);
}
function decideLeave(a) {
  if (a.c !== HOUSE_EXIT.c) return a.c < HOUSE_EXIT.c ? 3 : 1;
  if (a.r !== HOUSE_EXIT.r) return 0;
  return null;
}
function decideEnter(a) {
  if (a.r < HOUSE_SLOT_ROW) return 2;
  if (a.c !== a.homeCol) return a.c < a.homeCol ? 3 : 1;
  return null;
}

function stepWith(a, dt, speed, decideFn) {
  let dist = speed * dt / 1000, guard = 0;
  a.t += dist;
  while (a.t >= 1 && guard++ < 8) {
    a.t -= 1;
    const [nr, nc] = stepPos(a.r, a.c, DV[a.dir][0], DV[a.dir][1]);
    a.r = nr; a.c = nc;
    const nd = decideFn(a);
    if (nd == null) { a.t = 0; break; }
    a.dir = nd;
  }
}

function stepGhost(g, dt) {
  const inTunnel = g.r === TUNNEL_ROW;
  switch (g.state) {
    case 'idle': g.bouncePhase = (g.bouncePhase || 0) + dt / 260; return;
    case 'leaving':
      stepWith(g, dt, GHOST_SPEED * G.speedMul, decideLeave);
      if (g.r === HOUSE_EXIT.r && g.c === HOUSE_EXIT.c) { g.state = G.frightT > 0 ? 'frightened' : G.mode; g.dir = 0; }
      return;
    case 'entering':
      stepWith(g, dt, GHOST_EYES_SPEED * 0.6, decideEnter);
      if (g.r === HOUSE_SLOT_ROW && g.c === g.homeCol) { g.state = 'idle'; g.dir = 0; }
      return;
    case 'eyes':
      stepWith(g, dt, GHOST_EYES_SPEED, decideEyes);
      if (g.r === HOUSE_EXIT.r && g.c === HOUSE_EXIT.c) { g.state = 'entering'; g.dir = 2; }
      return;
    case 'frightened':
      stepWith(g, dt, GHOST_FRIGHT_SPEED * (inTunnel ? 0.5 : 1), decideFright);
      return;
    default: // scatter, chase
      stepWith(g, dt, GHOST_SPEED * G.speedMul * (inTunnel ? 0.5 : 1), decideGhost);
  }
}

function stepPlayer(dt) {
  const p = G.player;
  if (p.dir != null && p.wantDir != null && p.wantDir === opp(p.dir)) { reverseActor(p); p.dir = p.wantDir; p.lastDir = p.dir; }
  if (p.slowT > 0) p.slowT = Math.max(0, p.slowT - dt);
  const speed = PLAYER_SPEED * G.speedMul * (p.slowT > 0 ? 0.82 : 1);
  if (p.dir == null) {
    const opts = candidateDirs(p.r, p.c, isWallPlayer);
    if (p.wantDir != null && opts.includes(p.wantDir)) { p.dir = p.wantDir; p.lastDir = p.dir; }
    else return;
  }
  let dist = speed * dt / 1000, guard = 0;
  p.t += dist;
  while (p.t >= 1 && guard++ < 8) {
    p.t -= 1;
    const [nr, nc] = stepPos(p.r, p.c, DV[p.dir][0], DV[p.dir][1]);
    p.r = nr; p.c = nc;
    eatItemAt(p.r, p.c);
    const nd = decidePlayer(p);
    if (nd == null) { p.dir = null; p.t = 0; break; }
    p.dir = nd; p.lastDir = nd;
  }
}

// ================= 점수·아이템 =================
function popup(text, r, c, color = '#ffd84a') { G.popups.push({ text, r, c, t: 0, color }); }
function addScore(n) {
  G.score += n;
  if (!G.extraLifeGiven && G.score >= EXTRA_LIFE_SCORE) { G.extraLifeGiven = true; G.lives++; popup('1UP', 2, 9, '#ff7ad9'); Sound.sfx('extralife'); }
}
function eatItemAt(r, c) {
  const ch = G.grid[r][c];
  if (ch !== '.' && ch !== 'o') return;
  G.grid[r][c] = ' '; G.dotsRemaining--; G.dotsEatenLife++; G.noEatT = 0;
  if (ch === '.') { addScore(10); G.player.slowT = 55; Sound.sfx(G.chompFlip ? 'chomp1' : 'chomp2'); G.chompFlip = !G.chompFlip; }
  else { addScore(50); G.player.slowT = 100; startFright(); Sound.sfx('power'); }
  checkFruitSpawn();
  checkGhostRelease();
}
function startFright() {
  G.frightT = G.frightDur; G.chain = 0;
  G.ghosts.forEach(g => { if (g.state === 'scatter' || g.state === 'chase') { reverseActor(g); g.prevMode = g.state; g.state = 'frightened'; } });
}
function checkFruitSpawn() {
  if (G.fruitSpawned < 2 && G.dotsEatenLife >= G.fruitAt[G.fruitSpawned]) {
    G.fruit = { r: FRUIT_POS.r, c: FRUIT_POS.c, t: 0, life: 9000, kind: (G.level - 1) % 3, pts: FRUIT_SCORES[Math.min(G.level - 1, FRUIT_SCORES.length - 1)] };
    G.fruitSpawned++;
  }
}
function checkGhostRelease() {
  for (let i = 1; i <= 3; i++) {
    const g = G.ghosts[i];
    if (g.state === 'idle' && G.dotsEatenLife >= G.releaseAt[i - 1]) { g.state = 'leaving'; return; }
  }
}

// ================= 진행 관리 =================
function setupLevel(n) {
  G.level = n;
  const variant = MAZES[(n - 1) % MAZES.length];
  G.grid = cloneMaze(variant);
  G.mazeId = (n - 1) % MAZES.length;
  G.dotsTotal = countDots(G.grid); G.dotsRemaining = G.dotsTotal; G.dotsEatenLife = 0;
  G.fruitSpawned = 0; G.fruit = null;
  G.fruitAt = [Math.round(G.dotsTotal * 0.35), Math.round(G.dotsTotal * 0.7)];
  G.releaseAt = [0, Math.round(G.dotsTotal * 0.15), Math.round(G.dotsTotal * 0.35)];
  G.speedMul = 1 + Math.min(0.3, (n - 1) * 0.02);
  G.frightDur = Math.max(1500, 7000 - (n - 1) * 500);
  G.mode = 'scatter'; G.modeIndex = 0; G.modeT = 0; G.frightT = 0; G.chain = 0; G.noEatT = 0;
  G.popups = [];
  resetPositions();
  G.readyT = 1900; G.state = 'ready';
  Sound.sfx('ready');
}
function resetPositions() {
  G.player = { r: PLAYER_START.r, c: PLAYER_START.c, t: 0, dir: null, wantDir: 1, lastDir: 1, slowT: 0 };
  G.ghosts = [0, 1, 2, 3].map(idx => {
    if (idx === 0) return { idx, r: HOUSE_EXIT.r, c: HOUSE_EXIT.c, t: 0, dir: 1, state: 'scatter' };
    const slot = HOUSE_SLOTS[idx - 1];
    return { idx, r: slot.r, c: slot.c, t: 0, dir: 0, state: 'idle', bouncePhase: idx * 1.4, homeCol: slot.c };
  });
}
function startGame() {
  Sound.init(); applySound();
  G.lives = 3; G.score = 0; G.extraLifeGiven = false; G.overShown = false;
  const top = store.get('ra-03-scores', []); G.best = top.length ? top[0].s : 0;
  Sound.sfx('start');
  setupLevel(G.startLevel);
  hideOverlay();
}
function loseLife() {
  G.lives--; Sound.bgmStop(); Sound.sfx('death'); G.state = 'dying'; G.dyingT = 0;
}
function afterDeath() {
  if (G.lives > 0) { resetPositions(); G.readyT = 1500; G.state = 'ready'; Sound.sfx('ready'); }
  else { G.state = 'over'; G.rank = saveScore(); Sound.sfx('over'); showGameOverIfNeeded(); }
}
function saveScore() {
  const entry = { s: G.score, l: G.level, d: Date.now() };
  const top = [...store.get('ra-03-scores', []), entry].sort((a, b) => b.s - a.s).slice(0, 5);
  store.set('ra-03-scores', top);
  return top.indexOf(entry);
}
function stageClear() {
  G.state = 'clearing'; G.clearT = 0; Sound.bgmStop(); Sound.sfx('stage');
  $('#stageTitle').textContent = `STAGE ${G.level} CLEAR!`;
  $('#stageBonus').textContent = `점수 ${pad6(G.score)}`;
  showScreen('scrStage');
}
function nextLevel() { hideOverlay(); setupLevel(G.level + 1); }

// ================= 충돌 =================
function actorPos(a) { return { x: a.c + DV[a.dir == null ? 0 : a.dir][1] * a.t, y: a.r + DV[a.dir == null ? 0 : a.dir][0] * a.t }; }
function overlaps(a, b) { const pa = actorPos(a), pb = actorPos(b); return (pa.x - pb.x) ** 2 + (pa.y - pb.y) ** 2 < 0.36; }

// ================= 메인 갱신 =================
function updateMode(dt) {
  if (G.frightT > 0) return;
  G.modeT += dt;
  if (G.modeT >= MODE_SCHEDULE[G.modeIndex]) {
    G.modeT = 0; G.modeIndex = Math.min(G.modeIndex + 1, MODE_SCHEDULE.length - 1);
    const nm = G.modeIndex % 2 === 0 ? 'scatter' : 'chase';
    if (nm !== G.mode) {
      G.mode = nm;
      G.ghosts.forEach(g => { if (g.state === 'scatter' || g.state === 'chase') { reverseActor(g); g.state = nm; } });
    }
  }
}
function stepPlaying(dt) {
  updateMode(dt);
  if (G.frightT > 0) {
    G.frightT -= dt;
    if (G.frightT <= 0) { G.frightT = 0; G.ghosts.forEach(g => { if (g.state === 'frightened') g.state = g.prevMode || G.mode; }); }
  }
  G.noEatT += dt;
  if (G.noEatT > 4000) { for (let i = 1; i <= 3; i++) { const g = G.ghosts[i]; if (g.state === 'idle') { g.state = 'leaving'; G.noEatT = 0; break; } } }
  stepPlayer(dt);
  G.ghosts.forEach(g => stepGhost(g, dt));
  for (const g of G.ghosts) {
    if ((g.state === 'scatter' || g.state === 'chase') && overlaps(G.player, g)) { loseLife(); return; }
    if (g.state === 'frightened' && overlaps(G.player, g)) {
      G.chain = Math.min(G.chain + 1, 4);
      const pts = [200, 400, 800, 1600][G.chain - 1];
      addScore(pts); popup(String(pts), g.r, g.c, '#9be8ff'); Sound.sfx('eatghost');
      g.state = 'eyes';
    }
  }
  if (G.fruit) {
    G.fruit.t += dt;
    if (G.fruit.r === G.player.r && G.fruit.c === G.player.c && G.player.t < 0.5) {
      addScore(G.fruit.pts); popup(String(G.fruit.pts), G.fruit.r, G.fruit.c, '#ffb347'); Sound.sfx('fruit'); G.fruit = null;
    } else if (G.fruit.t > G.fruit.life) G.fruit = null;
  }
  if (G.dotsRemaining <= 0) { stageClear(); return; }
  G.popups = G.popups.filter(p => (p.t += dt) < 900);
}
function update(dt) {
  dt = Math.min(48, dt);
  G.time += dt;
  switch (G.state) {
    case 'ready': G.readyT -= dt; G.ghosts.forEach(g => { if (g.state === 'idle') g.bouncePhase = (g.bouncePhase || 0) + dt / 260; }); if (G.readyT <= 0) { G.state = 'playing'; Sound.bgmStart(); } break;
    case 'playing': stepPlaying(dt); break;
    case 'dying': G.dyingT += dt; if (G.dyingT > 1200) afterDeath(); break;
    case 'clearing': G.clearT += dt; break;
  }
}

// ================= 그리기 =================
const cv = $('#cv'), ctx = cv.getContext('2d');
let T = 16, DPR = 1;
const R = Math.round;
function layout() {
  const touch = document.body.classList.contains('touch');
  const app = $('#app'), hdr = $('#hdr');
  const cs = getComputedStyle(app);
  const below = touch ? $('#pad').offsetHeight : $('#help').offsetHeight;
  const used = hdr.offsetHeight + below + 14 + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const avail = Math.min(window.innerWidth - 16, window.innerHeight - used);
  T = Math.max(9, Math.min(26, Math.floor(avail / Math.max(COLS, ROWS + HUD_TOP + HUD_BOT))));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  const w = COLS * T, h = (ROWS + HUD_TOP + HUD_BOT) * T;
  cv.width = w * DPR; cv.height = h * DPR;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  hdr.style.width = w + 'px';
}
// 미로 A/B를 서로 다른 돌담 색으로: A=흙담(따뜻한 황토돌), B=청석담(푸른 돌)
const MAZE_THEME = [
  { bg: '#1b140e', wall: '#8d7c62', dark: '#5c4d38', roof: '#a8502e', roofDark: '#743a20' },
  { bg: '#12111f', wall: '#5f6c82', dark: '#333c50', roof: '#3c4356', roofDark: '#262c3c' },
];
function theme() { return MAZE_THEME[G.mazeId || 0]; }
function roundRectFill(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
function isWall(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
  return G.grid[r][c] === '#';
}
function drawWallTile(r, c) {
  const th = theme();
  const x = c * T, y = (r + HUD_TOP) * T;
  const up = !isWall(r - 1, c), down = !isWall(r + 1, c), left = !isWall(r, c - 1), right = !isWall(r, c + 1);
  const rad = T * 0.38;
  ctx.fillStyle = th.wall;
  roundRectFill(x, y, T, T, [up && left ? rad : 0, up && right ? rad : 0, down && right ? rad : 0, down && left ? rad : 0]);
  // 담이 외부(통로)로 드러난 면에만 그림자를 넣어 안쪽 돌끼리는 이음새 없이 이어져 보이게 한다
  const edge = Math.max(1, T * 0.1);
  ctx.fillStyle = th.dark;
  if (down) ctx.fillRect(x, y + T - edge, T, edge);
  if (left) ctx.fillRect(x, y, edge, T);
  if (right) ctx.fillRect(x + T - edge, y, edge, T);
  if (up) { // 담장 위 기와 처마선
    const rh = Math.max(2, T * 0.24);
    ctx.fillStyle = th.roof; ctx.fillRect(x, y, T, rh);
    ctx.fillStyle = th.roofDark;
    ctx.beginPath(); ctx.arc(x + T * 0.5, y + rh * 0.6, T * 0.1, 0, 7); ctx.fill();
  }
}
function drawMaze() {
  const th = theme();
  ctx.fillStyle = th.bg;
  ctx.fillRect(0, HUD_TOP * T, COLS * T, ROWS * T);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = G.grid[r][c];
    if (ch === '#') drawWallTile(r, c);
    else if (ch === 'D') { // 도깨비 집 문: 새끼줄 금줄
      ctx.strokeStyle = '#8a5a2e'; ctx.lineWidth = Math.max(2, T * 0.16); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(c * T + T * 0.12, (r + HUD_TOP) * T + T * 0.5); ctx.lineTo(c * T + T * 0.88, (r + HUD_TOP) * T + T * 0.5); ctx.stroke();
    }
  }
}
function drawDots() {
  const th = theme();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = G.grid[r][c]; if (ch !== '.' && ch !== 'o') continue;
    const cx = c * T + T / 2, cy = (r + HUD_TOP) * T + T / 2;
    if (ch === '.') { // 엽전(옛 동전)
      const rr = Math.max(1.6, T * 0.13);
      ctx.fillStyle = '#d9b356'; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.fill();
      ctx.strokeStyle = '#8a6a26'; ctx.lineWidth = Math.max(0.6, T * 0.02); ctx.stroke();
      ctx.fillStyle = th.bg; ctx.fillRect(cx - rr * 0.3, cy - rr * 0.3, rr * 0.6, rr * 0.6);
    } else { // 복숭아(도깨비가 무서워하는 과일) — 큰 알약
      const pulse = 0.85 + 0.15 * Math.sin(G.time / 160), rr = T * 0.26 * pulse;
      ctx.fillStyle = '#e8798a';
      ctx.beginPath(); ctx.arc(cx - rr * 0.4, cy, rr * 0.62, 0, 7); ctx.arc(cx + rr * 0.4, cy, rr * 0.62, 0, 7); ctx.fill();
      ctx.fillStyle = '#f4b0b6'; ctx.beginPath(); ctx.arc(cx - rr * 0.15, cy - rr * 0.32, rr * 0.32, 0, 7); ctx.fill();
      ctx.strokeStyle = '#7a3a44'; ctx.lineWidth = Math.max(0.6, T * 0.025);
      ctx.beginPath(); ctx.moveTo(cx, cy - rr * 0.5); ctx.lineTo(cx, cy + rr * 0.2); ctx.stroke();
      ctx.fillStyle = '#5fae52'; ctx.beginPath(); ctx.ellipse(cx + rr * 0.2, cy - rr * 0.75, rr * 0.34, rr * 0.15, -0.5, 0, 7); ctx.fill();
    }
  }
}
function drawFruit() {
  if (!G.fruit) return;
  const cx = G.fruit.c * T + T / 2, cy = (G.fruit.r + HUD_TOP) * T + T / 2, s = T * 0.42;

    ctx.fillStyle = '#8f5a26'; ctx.beginPath(); ctx.moveTo(cx + s * 0.9, cy); ctx.lineTo(cx + s * 1.4, cy - s * 0.35); ctx.lineTo(cx + s * 1.4, cy + s * 0.35); ctx.fill();

    ctx.strokeStyle = '#8a5a1e'; ctx.lineWidth = Math.max(1, T * 0.05); ctx.beginPath();
    ctx.moveTo(cx - s * 0.6, cy); ctx.quadraticCurveTo(cx, cy - s * 0.6, cx + s * 0.6, cy); ctx.stroke();

}
function actorPx(a) {
  const dir = a.dir == null ? 0 : a.dir;
  return { x: (a.c + DV[dir][1] * a.t) * T + T / 2, y: (a.r + HUD_TOP + DV[dir][0] * a.t) * T + T / 2 };
}
function drawPlayer() {
  // 호빵 캐릭터: 원작의 '노란 입 벌린 원'과 겹치지 않도록 쐐기 모양으로 도려내지 않고,
  // 둥근 찐빵 몸통 + 정수리 십자 칼집 + 발그레한 볼 + 여닫는 작은 입으로 그린다.
  const p = G.player, { x, y } = actorPx(p), s = T * 0.42;

  ctx.fillStyle = '#f0cf9a'; ctx.beginPath(); ctx.arc(0, 0, s, 0, 7); ctx.fill();
  ctx.strokeStyle = '#c8a876'; ctx.lineWidth = Math.max(1, s * 0.06); ctx.stroke();
  ctx.strokeStyle = '#d8b98a'; ctx.lineWidth = Math.max(1, s * 0.1); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-s * 0.22, -s * 0.62); ctx.lineTo(s * 0.22, -s * 0.62); ctx.moveTo(0, -s * 0.78); ctx.lineTo(0, -s * 0.46); ctx.stroke(); // 정수리 십자 칼집

  ctx.beginPath(); ctx.arc(-s * 0.5, s * 0.15, s * 0.2, 0, 7); ctx.arc(s * 0.5, s * 0.15, s * 0.2, 0, 7); ctx.fill();

  ctx.save(); ctx.rotate(ang);
  ctx.fillStyle = '#3a2410';
  ctx.beginPath(); ctx.arc(-s * 0.28, -s * 0.12, s * 0.1, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.28, -s * 0.12, s * 0.1, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.05, s * 0.32, s * 0.24, s * 0.1 + s * 0.14 * chomp, 0, 0, 7); ctx.fill();

  ctx.restore();
}
// 도깨비 4마리: 뿔 모양(외뿔/쌍뿔/휜뿔/긴쌍뿔)과 방망이(민방망이/가시방망이)로 구분한다.
// 원작 유령 색(빨강·분홍·하늘·주황) 대신 주홍·쪽빛·연두·황토로 새로 정했다.
const GOBLIN_COLORS = ['#c0442a', '#2c4c7c', '#8ab53c', '#c08a3e'];
function drawPupils(x, y, s, dir) {
  const v = DV[dir == null ? 0 : dir];
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath(); ctx.arc(x - s * 0.28 + v[1] * s * 0.08, y + v[0] * s * 0.08, s * 0.08, 0, 7);
  ctx.arc(x + s * 0.28 + v[1] * s * 0.08, y + v[0] * s * 0.08, s * 0.08, 0, 7); ctx.fill();
}
function drawHorns(x, y, s, idx, color) {
  ctx.fillStyle = color;
  if (idx === 0) { // 짧고 굵은 외뿔
    ctx.beginPath(); ctx.moveTo(x - s * 0.18, y - s * 0.55); ctx.lineTo(x, y - s * 1.15); ctx.lineTo(x + s * 0.18, y - s * 0.55); ctx.closePath(); ctx.fill();
  } else if (idx === 1) { // 짧은 쌍뿔
    for (const sg of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + sg * s * 0.38, y - s * 0.5); ctx.lineTo(x + sg * s * 0.58, y - s * 0.95); ctx.lineTo(x + sg * s * 0.16, y - s * 0.5); ctx.closePath(); ctx.fill(); }
  } else if (idx === 2) { // 휘어진 외뿔(두껍게)
    ctx.beginPath(); ctx.moveTo(x - s * 0.1, y - s * 0.56);
    ctx.quadraticCurveTo(x + s * 0.62, y - s * 1.3, x + s * 0.3, y - s * 0.9);
    ctx.quadraticCurveTo(x + s * 0.05, y - s * 0.62, x + s * 0.18, y - s * 0.55);
    ctx.closePath(); ctx.fill();
  } else { // 길게 뻗은 쌍뿔
    for (const sg of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + sg * s * 0.36, y - s * 0.52); ctx.lineTo(x + sg * s * 0.78, y - s * 1.3); ctx.lineTo(x + sg * s * 0.14, y - s * 0.5); ctx.closePath(); ctx.fill(); }
  }
}
function drawClub(x, y, s, idx, onRight) {
  const dir = onRight ? 1 : -1, spiky = idx === 1 || idx === 3;
  ctx.save(); ctx.translate(x + dir * s * 0.92, y + s * 0.05); ctx.rotate(dir * 0.35);
  ctx.strokeStyle = '#8a5a2e'; ctx.lineWidth = Math.max(1, s * 0.15); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, s * 0.45); ctx.lineTo(0, -s * 0.3); ctx.stroke();
  ctx.fillStyle = '#a9743f'; ctx.beginPath(); ctx.arc(0, -s * 0.5, s * 0.26, 0, 7); ctx.fill();
  if (spiky) {
    ctx.fillStyle = '#e8e0c8';
    for (const a of [0, 1.26, 2.51, 3.77, 5.03]) { ctx.beginPath(); ctx.arc(Math.cos(a) * s * 0.26, -s * 0.5 + Math.sin(a) * s * 0.26, s * 0.07, 0, 7); ctx.fill(); }
  }
  ctx.restore();
}
function drawLegs(x, y, s, color) {
  ctx.fillStyle = color;
  roundRectFill(x - s * 0.4, y + s * 0.5, s * 0.28, s * 0.4, s * 0.08);
  roundRectFill(x + s * 0.12, y + s * 0.5, s * 0.28, s * 0.4, s * 0.08);
}
function drawGhostNormal(x, y, s, idx, dir) {
  const color = GOBLIN_COLORS[idx];
  drawLegs(x, y, s, '#3a2c1e');
  ctx.fillStyle = color;
  roundRectFill(x - s, y - s * 0.85, s * 2, s * 1.45, [s * 0.85, s * 0.85, s * 0.3, s * 0.3]);
  drawHorns(x, y - s * 0.3, s, idx, '#f0e6d2');
  drawClub(x, y, s, idx, idx % 2 === 0); // 몸통 위에 겹쳐 그려 손에 든 것처럼 보이게
  const bandY = y + s * 0.2, bandH = s * 0.3; // 호피무늬 두렁이
  ctx.fillStyle = '#d8a552'; ctx.fillRect(x - s * 0.95, bandY, s * 1.9, bandH);
  ctx.fillStyle = '#4a3420';
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.ellipse(x + i * s * 0.5, bandY + bandH * 0.5, s * 0.13, s * 0.1, 0.5, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#2a1c10'; ctx.lineWidth = Math.max(1, s * 0.1); ctx.lineCap = 'round'; // 부리부리 눈썹
  ctx.beginPath(); ctx.moveTo(x - s * 0.45, y - s * 0.5); ctx.lineTo(x - s * 0.15, y - s * 0.38); ctx.moveTo(x + s * 0.45, y - s * 0.5); ctx.lineTo(x + s * 0.15, y - s * 0.38); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - s * 0.28, y - s * 0.15, s * 0.17, 0, 7); ctx.arc(x + s * 0.28, y - s * 0.15, s * 0.17, 0, 7); ctx.fill();
  drawPupils(x, y - s * 0.15, s, dir);
  ctx.fillStyle = '#fff'; // 송곳니
  ctx.beginPath(); ctx.moveTo(x - s * 0.14, y + s * 0.02); ctx.lineTo(x - s * 0.06, y + s * 0.02); ctx.lineTo(x - s * 0.1, y + s * 0.16); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + s * 0.14, y + s * 0.02); ctx.lineTo(x + s * 0.06, y + s * 0.02); ctx.lineTo(x + s * 0.1, y + s * 0.16); ctx.fill();

function drawGhostScared(x, y, s, idx) {
  const jt = Math.sin(G.time / 40 + idx * 7) * s * 0.06; // 덜덜 떨림
  x += jt;
  const onRight = idx % 2 !== 0;
  drawLegs(x, y, s, '#6b5a48');
  ctx.fillStyle = '#eef0e6';
  roundRectFill(x - s, y - s * 0.85, s * 2, s * 1.45, [s * 0.85, s * 0.85, s * 0.3, s * 0.3]);
  drawHorns(x, y - s * 0.3, s, idx, '#d8cdb8');

  ctx.save(); ctx.translate(x + (onRight ? 1 : -1) * s * 0.75, y + s * 0.82); ctx.rotate((onRight ? 1 : -1) * 1.2);
  ctx.strokeStyle = '#8a5a2e'; ctx.lineWidth = Math.max(1, s * 0.13); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-s * 0.35, 0); ctx.lineTo(s * 0.2, 0); ctx.stroke();
  ctx.fillStyle = '#a9743f'; ctx.beginPath(); ctx.arc(s * 0.32, 0, s * 0.2, 0, 7); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#8ec9e8'; // 식은땀

    ctx.globalAlpha = 1 - t;
    ctx.beginPath(); ctx.ellipse(x + dx * s * 0.78, y - s * 0.45 - t * s * 0.55, s * 0.08, s * 0.12, 0, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#2a2016'; ctx.lineWidth = Math.max(1, s * 0.09); ctx.lineCap = 'round'; // >< 눈
  for (const sg of [-1, 1]) {
    const ex = x + sg * s * 0.32, ey = y - s * 0.28;
    ctx.beginPath(); ctx.moveTo(ex - s * 0.12, ey - s * 0.12); ctx.lineTo(ex + s * 0.12, ey + s * 0.12);
    ctx.moveTo(ex - s * 0.12, ey + s * 0.12); ctx.lineTo(ex + s * 0.12, ey - s * 0.12); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(x - s * 0.16, y + s * 0.08); // 오들오들 입

}
function drawGhostFire(x, y, s) { // 잡힌 도깨비: 눈이 아니라 작은 도깨비불로 집에 돌아간다
  const flick = 0.85 + 0.15 * Math.sin(G.time / 60);
  const grad = ctx.createRadialGradient(x, y + s * 0.05, 0, x, y + s * 0.05, s * 0.95 * flick);
  grad.addColorStop(0, '#eaffff'); grad.addColorStop(0.55, '#5fd0e8'); grad.addColorStop(1, 'rgba(60,140,200,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(x, y - s * 1.1 * flick);
  ctx.quadraticCurveTo(x + s * 0.65, y - s * 0.2, x + s * 0.28, y + s * 0.7);
  ctx.quadraticCurveTo(x, y + s * 0.95, x - s * 0.28, y + s * 0.7);
  ctx.quadraticCurveTo(x - s * 0.65, y - s * 0.2, x, y - s * 1.1 * flick);
  ctx.fill();
  ctx.fillStyle = '#eafeff'; ctx.beginPath(); ctx.ellipse(x, y + s * 0.1, s * 0.16, s * 0.3, 0, 0, 7); ctx.fill();
}
function drawGhost(g) {
  let { x, y } = actorPx(g);
  if (g.state === 'idle') y += Math.sin(g.bouncePhase || 0) * T * 0.12;
  const s = T * 0.42;
  if (g.state === 'eyes' || g.state === 'entering') { drawGhostFire(x, y, s); return; }
  if (g.state === 'frightened') {
    const blinkBack = G.frightT < 1500 && Math.floor(G.time / 140) % 2 === 0;
    if (blinkBack) drawGhostNormal(x, y, s, g.idx, g.dir); else drawGhostScared(x, y, s, g.idx);

function drawPopups() {
  ctx.font = `${R(T * 0.7)}px Galmuri11, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of G.popups) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 900);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.c * T + T / 2, (p.r + HUD_TOP) * T + T / 2 - p.t / 40);

}
function drawHUD() {
  ctx.font = `${R(T * 0.62)}px Galmuri11, monospace`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#eef0ff'; ctx.fillText('SCORE ' + pad6(G.score), T * 0.3, T * 0.15);
  ctx.textAlign = 'right'; ctx.fillStyle = '#8d93c4';
  ctx.fillText('HI ' + pad6(Math.max(G.best, G.score)), COLS * T - T * 0.3, T * 0.15);
  ctx.textAlign = 'left'; ctx.fillStyle = '#ffd84a'; ctx.fillText('STAGE ' + G.level, T * 0.3, T * 1.1);

  for (let i = 0; i < Math.max(0, G.lives - 1); i++) drawPlayerIcon(T * (0.6 + i * 0.9), bottomY + T * 0.35);

function drawPlayerIcon(x, y) {
  const s = T * 0.3;
  ctx.fillStyle = '#f0cf9a'; ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.fill();
  ctx.fillStyle = '#d94a4a'; ctx.beginPath(); ctx.arc(x, y - s * 0.55, s * 0.16, 0, 7); ctx.fill();
}
function drawReady() {
  ctx.font = `${R(T * 1.1)}px Galmuri14, Galmuri11, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd84a'; ctx.fillText('READY!', COLS * T / 2, (HUD_TOP + ROWS / 2) * T);

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05060d'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!G.grid) return;

  if (G.state !== 'dying' || Math.floor(G.time / 120) % 2 === 0) drawPlayer();
  if (G.state !== 'dying') G.ghosts.forEach(drawGhost);
  drawPopups(); drawHUD();
  if (G.state === 'ready') drawReady();

// ================= 루프 =================
let last = performance.now();
function frame(now) {
  const dt = now - last; last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}

// ================= 시작 =================
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
window.addEventListener('touchstart', () => {
  if (document.body.classList.contains('touch')) return;
  document.body.classList.add('touch'); refreshTitle(); layout();
}, { passive: true });
window.addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

setupLevel(G.startLevel);
G.state = 'title';
refreshTitle();
layout();
showScreen('scrTitle');
requestAnimationFrame(frame);

// ================= 검증용 훅 =================
G.api = {
  tick(ms) { let left = ms; while (left > 0) { const s = Math.min(16, left); update(s); left -= s; } },
  target(i) { return computeTarget(G.ghosts[i]); },
  decideGhostDir(i) { return decideGhost(G.ghosts[i]); },
  decideFrightDir(i) { return decideFright(G.ghosts[i]); },
  setPlayer(r, c, dir) { G.player.r = r; G.player.c = c; G.player.t = 0; G.player.dir = dir; G.player.lastDir = dir == null ? G.player.lastDir : dir; G.player.wantDir = dir; },
  setGhost(i, r, c, dir, state) { const g = G.ghosts[i]; g.r = r; g.c = c; g.t = 0; if (dir != null) g.dir = dir; if (state) g.state = state; },
  forceMode(mode) { G.mode = mode; G.modeIndex = mode === 'scatter' ? 0 : 1; G.ghosts.forEach(g => { if (g.state === 'scatter' || g.state === 'chase') { reverseActor(g); g.state = mode; } }); },
  forceFright() { startFright(); },
  forceClear() { G.dotsRemaining = 0; },
  setScore(n) { G.score = n; },
  setLevel(n) { setupLevel(n); },
  skipReady() { G.readyT = 0; },
  eatNextDot() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (G.grid[r][c] === '.' || G.grid[r][c] === 'o') { eatItemAt(r, c); return { r, c }; }
    return null;
  },
};
})();

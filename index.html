<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>하이놀이터</title>
<meta name="description" content="로봇 콩콩이와 AI 사용법을 배우고 추억의 오락실 게임도 즐기는 어린이 놀이터">
<meta property="og:title" content="하이놀이터">
<meta property="og:description" content="콩콩이랑 AI 쓰는 법 배우고, 오락실 게임도 한 판!">
<meta property="og:type" content="website">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 한 줄짜리 놀이 공책. 홈 = 지그재그 징검다리 10개, 수업 = 위에 콩콩이+말풍선 무대, 아래 활동판 */
:root{
  --bg:#EAF4EE; --surface:#FFFFFF; --ink:#21323A; --muted:#5A6E76; --line:#CADBD1;
  --coral:#FF6B4A; --coral-deep:#D9502F; --coral-ink:#FFFFFF;
  --sun:#FFC63A; --sun-soft:#FFF1C7; --sun-ink:#4A3600;
  --leaf:#23955F; --leaf-soft:#D9F3E4; --bad:#D93D52; --bad-soft:#FDE1E4;
  --sky:#3A8DD6; --sky-ink:#FFFFFF;
  --bot:#9FD9C6; --bot-edge:#6DBBA3; --bot-face:#22343D; --bot-eye:#8DF2CF; --cheek:#FF9A88;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --text:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13201F; --surface:#1D2E2D; --ink:#E8F3EF; --muted:#9BB3AE; --line:#34504C;
  --coral:#FF8466; --coral-deep:#C9573B; --coral-ink:#2A0E06;
  --sun:#F6C64A; --sun-soft:#3A3218; --sun-ink:#FFE9A8;
  --leaf:#4BC98B; --leaf-soft:#173A2A; --bad:#FF6F82; --bad-soft:#40202A;
  --sky:#6AB4F0; --sky-ink:#0B1D2C;
  --bot:#7FC9B2; --bot-edge:#57A48C; --bot-face:#0F1C22; --bot-eye:#8DF2CF; --cheek:#E9806F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13201F; --surface:#1D2E2D; --ink:#E8F3EF; --muted:#9BB3AE; --line:#34504C;
  --coral:#FF8466; --coral-deep:#C9573B; --coral-ink:#2A0E06;
  --sun:#F6C64A; --sun-soft:#3A3218; --sun-ink:#FFE9A8;
  --leaf:#4BC98B; --leaf-soft:#173A2A; --bad:#FF6F82; --bad-soft:#40202A;
  --sky:#6AB4F0; --sky-ink:#0B1D2C;
  --bot:#7FC9B2; --bot-edge:#57A48C; --bot-face:#0F1C22; --bot-eye:#8DF2CF; --cheek:#E9806F;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.65}
.wrap{max-width:640px;margin:0 auto;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

/* 머리줄 */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.share{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-family:var(--display);font-size:16px;white-space:nowrap}
.brand{font-family:var(--display);font-size:24px;line-height:1.2}
.brand small{display:block;font-family:var(--text);font-size:13px;color:var(--muted)}
.score{display:flex;align-items:center;gap:6px;background:var(--sun-soft);color:var(--sun-ink);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:18px;white-space:nowrap}
.score svg{width:20px;height:20px}
.back{background:none;border:0;cursor:pointer;font-family:var(--display);font-size:18px;color:var(--muted);padding:6px 0}

/* 무대: 콩콩이 + 말풍선 */
.stage{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:end}
.bot{width:104px;height:auto;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 18px;font-size:18px;margin-bottom:22px;min-width:0}
.bubble::before{content:"";position:absolute;left:-11px;bottom:18px;width:18px;height:18px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble b{color:var(--coral-deep)}
.b-body{fill:var(--bot);stroke:var(--bot-edge);stroke-width:3}
.b-face{fill:var(--bot-face)}
.b-eye{fill:var(--bot-eye)}
.b-line{fill:none;stroke:var(--bot-eye);stroke-width:3.5;stroke-linecap:round}
.b-cheek{fill:var(--cheek);opacity:.75}
.b-ant{stroke:var(--bot-edge);stroke-width:3}
.b-light{fill:var(--sun)}

/* 지도 */
.map{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.stop{display:flex;align-items:center;gap:14px;margin-left:var(--x);background:none;border:0;padding:4px;text-align:left;cursor:pointer;border-radius:20px;max-width:calc(100% - var(--x))}
.stone{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);font-family:var(--display);font-size:26px;box-shadow:0 5px 0 var(--line)}
.stop.done .stone{background:var(--leaf);border-color:var(--leaf);color:var(--surface);box-shadow:0 5px 0 var(--leaf-soft)}
.stop.done .stone svg{width:30px;height:30px}
.stop.next .stone{border-color:var(--coral);box-shadow:0 5px 0 var(--coral-deep)}
.stop-t{min-width:0}
.stop-t .disp{font-size:20px;line-height:1.3}
.stop-t span{display:block;font-size:14px;color:var(--muted)}
.stop:hover .stone{transform:translateY(-2px)}

/* 수업 */
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ltitle{font-size:26px;margin:4px 0 16px}
.ltitle em{font-style:normal;color:var(--coral-deep);margin-right:6px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--coral)}
.panel{margin-top:6px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.q{font-family:var(--display);font-size:21px;line-height:1.45;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.btn{font-family:var(--display);font-size:19px;padding:11px 22px;border-radius:999px;border:0;background:var(--coral);color:var(--coral-ink);cursor:pointer;box-shadow:0 4px 0 var(--coral-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-deep)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line)}
.btn.sky{background:var(--sky);color:var(--sky-ink);box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg);cursor:pointer;font-size:17px}
.opt.right{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ox{display:flex;gap:18px;justify-content:center}
.oxb{width:96px;height:96px;border-radius:50%;border:3px solid var(--line);background:var(--bg);font-family:var(--display);font-size:46px;cursor:pointer}
.oxb.o{color:var(--sky)} .oxb.x{color:var(--bad)}
.oxb.right{background:var(--leaf-soft);border-color:var(--leaf)}
.oxb.wrong{background:var(--bad-soft);border-color:var(--bad)}
.sort{display:flex;flex-direction:column;gap:10px}
.sitem{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:16px;background:var(--bg);border:2px solid var(--line)}
.sitem.right{border-color:var(--leaf);background:var(--leaf-soft)}
.sitem.wrong{border-color:var(--bad);background:var(--bad-soft)}
.sitem .t{min-width:0;flex:1 1 160px}
.sbtns{display:flex;gap:6px}
.sb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--display);font-size:15px}
.sb.pick{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.group{display:flex;flex-direction:column;gap:8px}
.glabel{font-family:var(--display);font-size:16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:16px}
.chip.on{background:var(--sky);border-color:var(--sky);color:var(--sky-ink)}
.prompt{background:var(--bg);border:2px dashed var(--sky);border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.blank{display:inline-block;border-bottom:2px solid var(--muted);color:var(--muted);font-size:14px;padding:0 4px;margin:0 2px}
textarea{width:100%;box-sizing:border-box;min-height:110px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;font-size:18px;background:var(--bg);color:var(--ink);resize:vertical}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.checks li::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.checks li.ok{color:var(--ink)}
.checks li.ok::before{background:var(--leaf);border-color:var(--leaf)}
.checks li.no{color:var(--bad)}
.checks li.no::before{background:var(--bad);border-color:var(--bad)}
.memo{background:var(--sun-soft);color:var(--sun-ink);border-radius:20px;padding:18px 20px}
.memo h3{font-size:18px;margin-bottom:6px}
.memo ul{margin:0;padding-left:20px;font-family:var(--display);font-size:20px;line-height:1.55}
.bigstar{width:84px;height:84px;margin:0 auto;display:block;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
.small{font-size:14px;color:var(--muted)}

/* 즐길거리: 추억의 오락실 */
.arcade{margin-top:34px;display:flex;flex-direction:column;gap:12px}
.arcade h2{font-size:26px}
.arcade p{margin:0;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.game{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden;color:var(--ink);text-decoration:none}
.game img{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover;background:var(--line)}
.game span{padding:8px 10px 10px;min-width:0}
.game b{display:block;font-family:var(--display);font-weight:400;font-size:17px}
.game small{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.game:hover{border-color:var(--coral)}
@media (max-width:560px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 친구 점수판 */
.board{margin-top:34px;display:flex;flex-direction:column;gap:12px}
.board h2{font-size:26px}
.board p{margin:0;color:var(--muted)}
.ranks{list-style:none;margin:0;padding:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.ranks li{display:flex;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ranks li:first-child{border-top:0}
.ranks .no{width:26px;font-family:var(--display);color:var(--muted)}
.ranks .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.ranks .sc{font-family:var(--display);font-size:18px}
.ranks li.me{background:var(--sun-soft);color:var(--sun-ink)}
.ranks .empty{color:var(--muted);justify-content:center}
.nick{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nick input{flex:1 1 160px;min-width:0;border:2px solid var(--line);border-radius:999px;padding:10px 16px;font:inherit;background:var(--surface);color:var(--ink)}

/* 인증서·부모님 안내 */
.cert{margin-top:26px;border:3px solid var(--sun);border-radius:24px;padding:22px;background:var(--surface);text-align:center}
.cert h2{font-size:28px;color:var(--coral-deep)}
.cert ol{text-align:left;display:inline-block;margin:12px 0 0;padding-left:22px;font-family:var(--display);font-size:18px}
.parents{margin-top:30px;border-top:2px dashed var(--line);padding-top:14px;color:var(--muted);font-size:15px}
.parents summary{cursor:pointer;font-family:var(--display);font-size:17px}
.parents ul{padding-left:20px}

@media (max-width:440px){
  .stage{grid-template-columns:80px minmax(0,1fr)}
  .bot{width:80px}
  .bubble{font-size:17px;padding:12px 14px}
  .oxb{width:82px;height:82px}
  .stop{margin-left:calc(var(--x) / 2);max-width:calc(100% - var(--x) / 2)}
}
@media (prefers-reduced-motion:reduce){.bot,.bigstar{animation:none}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const KEY = 'kongkong-ai-class-v1';
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--sun)" stroke="var(--sun-ink)" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.1l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>';

const LESSONS = [
  { title:'AI는 누구일까?', sub:'AI가 뭔지 알아보기',
    talk:[
      ['cheer','안녕! 나는 AI 길잡이 로봇 <b>콩콩이</b>야. 오늘부터 AI랑 똑똑하게 지내는 법을 같이 배워 보자!'],
      ['happy','AI는 아주아주 많은 글을 읽고 배운 <b>컴퓨터 프로그램</b>이야. 글로 물어보면 글로 대답해 줘.'],
      ['happy','챗GPT, 제미나이, 클로드 같은 채팅 프로그램이 다 AI야.'],
      ['think','그런데 AI는 사람이 아니야. 말은 다정하게 해도 <b>진짜 마음이 있는 친구는 아니란다.</b>'],
      ['happy','그리고 약속 하나! AI는 <b>엄마나 아빠랑 같이</b> 쓰기로 해.'],
    ],
    act:{type:'ox', items:[
      {q:'AI에게 글로 물어보면 글로 대답해 준다.', a:true, why:'맞아! 질문을 쓰면 AI가 글로 답해 줘.'},
      {q:'AI는 사람처럼 진짜 마음이 있다.', a:false, why:'AI는 말을 잘하는 프로그램이야. 진짜 마음은 없어.'},
      {q:'AI는 어른과 함께 쓰는 게 좋다.', a:true, why:'맞아! 어른과 같이 쓰면 더 안전하고 더 잘 배울 수 있어.'},
    ]},
    remember:['AI는 똑똑한 도구! 사람 친구는 아니에요.','AI는 어른과 함께 써요.'] },

  { title:'자세하게 물어보기', sub:'AI는 내 마음을 못 읽어요',
    talk:[
      ['think','AI는 네 마음을 읽을 수 없어. <b>말해 준 만큼만</b> 알아.'],
      ['wow','"공룡 알려줘"라고만 하면 AI는 뭘 알려줘야 할지 몰라서 아무 얘기나 길게 해.'],
      ['cheer','"<b>티라노사우루스가 뭘 먹었는지 초등학생이 알 수 있게 3줄로 알려줘</b>"라고 하면? 딱 원하는 답이 와!'],
    ],
    act:{type:'choose', items:[
      {q:'강아지 키우는 게 궁금해. 어떤 질문이 더 좋을까?', options:[
        {t:'강아지', ok:false, why:'한 단어만 쓰면 AI가 뭘 궁금해하는지 몰라.'},
        {t:'강아지를 처음 키울 때 꼭 준비해야 할 물건 5가지를 알려줘', ok:true, why:'딩동댕! 무엇을, 몇 개 알고 싶은지 다 들어 있어.'},
      ]},
      {q:'분수가 헷갈려. 어떤 질문이 더 좋을까?', options:[
        {t:'수학 알려줘', ok:false, why:'수학은 너무 넓어! 어떤 부분이 궁금한지 말해 줘야 해.'},
        {t:'1/2과 1/4 중에 어느 게 더 큰지 피자로 예를 들어 설명해 줘', ok:true, why:'최고야! 궁금한 것과 설명 방법까지 말했어.'},
      ]},
    ]},
    remember:['AI는 말해 준 만큼만 알아요.','궁금한 걸 자세하게 써요.'] },

  { title:'질문 레시피 3가지', sub:'무엇을 + 눈높이 + 모양',
    talk:[
      ['happy','좋은 질문에는 <b>재료 3가지</b>가 있어.'],
      ['think','① <b>무엇을</b> 알고 싶은지 ② <b>누구 눈높이</b>로 ③ 어떤 <b>모양</b>으로 받고 싶은지!'],
      ['cheer','모양은 "3줄로", "퀴즈로", "표로" 같은 거야. 이제 직접 섞어서 질문을 만들어 보자!'],
    ],
    act:{type:'build', groups:[
      {label:'무엇을', chips:['무지개가 생기는 이유를','태양계 행성들을','김치 만드는 순서를']},
      {label:'누구 눈높이', chips:['초등학생이 이해할 수 있게','7살 동생도 알 수 있게']},
      {label:'어떤 모양', chips:['3줄로 알려줘','퀴즈 3개로 만들어 줘','표로 정리해 줘']},
    ]},
    remember:['무엇을 + 누구 눈높이 + 어떤 모양','이 세 가지만 넣어도 답이 훨씬 좋아져요.'] },

  { title:'한 번 더 물어보기', sub:'어려우면 다시 말하면 돼요',
    talk:[
      ['wow','AI 대답이 너무 어려웠던 적 있어? 괜찮아, <b>다시 물어보면 돼!</b>'],
      ['happy','AI랑은 대화를 이어갈 수 있어. "<b>더 쉽게</b>", "<b>예를 들어 줘</b>", "<b>짧게 줄여 줘</b>"라고 해 봐.'],
      ['cheer','처음 대답이 마음에 안 들어도 계속 고쳐 달라고 하면 점점 좋아져.'],
    ],

/* ---------- 소리: 효과음 + 배경음악 (Web Audio로 직접 합성, 파일 없음) ---------- */
const SND = (() => {
  const PREF = 'hi-playground-sound';
  let pref = { music:true, sfx:true };
  try { Object.assign(pref, JSON.parse(localStorage.getItem(PREF)) || {}); } catch(e){}
  const keep = () => { try { localStorage.setItem(PREF, JSON.stringify(pref)); } catch(e){} };
  let ctx = null, master, bgm, noise, timer = null, step = 0, nextT = 0;
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);

  function init(){
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    bgm = ctx.createGain(); bgm.gain.value = 0.6; bgm.connect(master);
    noise = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
    const ch = noise.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    return ctx;
  }
  function tone(f, t, dur, type, vol, dest){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t); o.stop(t + dur + 0.02);
    return o;
  }
  function hat(t){
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = 'highpass'; f.frequency.value = 6000;
    g.gain.setValueAtTime(0.025, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    s.connect(f); f.connect(g); g.connect(bgm); s.start(t);
  }
  const FX = {
    tap:   t => tone(660, t, 0.06, 'triangle', 0.12),
    pick:  t => { tone(520, t, 0.07, 'square', 0.05); tone(780, t + 0.05, 0.08, 'square', 0.05); },
    right: t => { tone(mf(76), t, 0.14, 'square', 0.07); tone(mf(84), t + 0.12, 0.3, 'square', 0.07); },
    wrong: t => { const o = tone(240, t, 0.32, 'sawtooth', 0.05); o.frequency.exponentialRampToValueAtTime(130, t + 0.3); },
    star:  t => { [72,76,79,84].forEach((m, i) => tone(mf(m), t + i * 0.09, 0.22, 'square', 0.06)); tone(mf(88), t + 0.38, 0.6, 'triangle', 0.12); },
  };

  // 8마디 반복 곡(C-G-Am-F), 8분음표 단위. 0은 쉼표
  const MEL = [
    [72,0,76,79,76,0,74,72],[71,0,74,79,77,76,74,0],[72,0,76,81,79,0,76,74],[72,74,76,77,76,0,0,0],
    [79,0,79,81,79,76,72,0],[74,0,74,76,74,71,67,0],[69,72,76,72,77,76,74,72],[74,0,72,0,72,0,0,0],
  ];
  const BASS = [48,43,45,41,48,43,45,43];
  const E = 60 / 112 / 2;
  function sched(){
    while (nextT < ctx.currentTime + 0.15){
      const bar = Math.floor(step / 8), i = step % 8;
      const m = MEL[bar][i];
      if (m) tone(mf(m), nextT, E * 0.9, 'square', 0.03, bgm);
      const b = [BASS[bar],0,BASS[bar]+12,0,BASS[bar],0,BASS[bar]+12,0][i];
      if (b) tone(mf(b), nextT, E * 0.9, 'triangle', 0.09, bgm);
      if (i % 2 === 1) hat(nextT);
      nextT += E; step = (step + 1) % 64;
    }
  }
  function start(){
    if (!pref.music || timer || document.hidden || !init()) return;
    ctx.resume();
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(sched, 25);
  }
  function stop(){ clearInterval(timer); timer = null; }

  // 브라우저는 사용자가 한 번 누른 뒤에만 소리를 허락한다
  document.addEventListener('pointerdown', start);
  document.addEventListener('keydown', start);
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

  return {
    get music(){ return pref.music; },
    get sfx(){ return pref.sfx; },
    play(name){ if (!pref.sfx || !init()) return; ctx.resume(); FX[name](ctx.currentTime + 0.01); },
    toggleMusic(){ pref.music = !pref.music; keep(); pref.music ? start() : stop(); },
    toggleSfx(){ pref.sfx = !pref.sfx; keep(); },
  };
})();

  return header() + stage(next === -1 ? 'cheer' : 'happy', say) + `<div class="map">${stops}</div>` + cert + arcade + boardHTML() + `
    <details class="parents"><summary>부모님께</summary><ul>
      <li>수업 하나는 3~5분이면 끝나요. 하루에 1~2개씩 함께 보시길 권해요.</li>
      <li>3·8·10번 수업에서 만든 질문은 복사해서 아이와 같이 실제 AI에 넣어 보세요.</li>
      <li>진행 기록(별)은 이 기기의 브라우저에만 저장돼요.</li>

/* ---------- 수업 ---------- */
function lesson(){
  const L = LESSONS[S.li];
  const steps = L.talk.length + 2;
  const at = S.phase === 'talk' ? S.ti : S.phase === 'act' ? L.talk.length : steps - 1;
  const dots = Array.from({length:steps}, (_, k) => `<i class="${k <= at ? 'on' : ''}"></i>`).join('');
  let body = '';

  if (S.phase === 'talk'){
    const [mood, say] = L.talk[S.ti];
    const last = S.ti === L.talk.length - 1;
    body = stage(mood, say) + `<div class="row end">
      ${S.ti > 0 ? '<button class="btn ghost" data-a="prev">이전</button>' : ''}
      <button class="btn" data-a="${last ? 'start' : 'next'}">${last ? '연습하러 가기' : '다음'}</button></div>`;
  } else if (S.phase === 'act'){
    body = stage(S.mood, S.say) + `<div class="panel">${ACT[L.act.type](L.act)}</div>`;
  } else {
    body = stage('cheer', '최고야! 별 하나 받았어. 이번 수업에서 <b>꼭 기억할 것</b>이야.') + `<div class="panel">
      ${STAR.replace('<svg','<svg class="bigstar"')}
      <div class="memo"><h3>꼭 기억해요</h3><ul>${L.remember.map(r => `<li>${r}</li>`).join('')}</ul></div>
      <div class="row end"><button class="btn ghost" data-a="home">지도로</button>
      ${S.li < LESSONS.length - 1 ? '<button class="btn" data-a="nextlesson">다음 수업</button>' : '<button class="btn" data-a="home">인증서 보러 가기</button>'}</div></div>`;
  }
  return header() + `<div class="lhead"><button class="back" data-a="home">← 지도로</button><div class="dots">${dots}</div></div>
    <h1 class="ltitle"><em>${S.li+1}</em>${L.title}</h1>` + body;
}

const nextBtn = (more) => `<div class="row end"><button class="btn" data-a="${more ? 'round' : 'finish'}">${more ? '다음 문제' : '별 받기'}</button></div>`;

const ACT = {
  ox(a){
    const it = a.items[S.r], an = S.ans;
    const cls = v => an && an.v === v ? (an.ok ? 'right' : 'wrong') : '';
    return `<p class="q">${S.r+1}/${a.items.length}. ${it.q}</p>
      <div class="ox"><button class="oxb o ${cls(true)}" data-a="ox" data-v="1" aria-label="맞아요">O</button>
      <button class="oxb x ${cls(false)}" data-a="ox" data-v="0" aria-label="아니에요">X</button></div>
      ${an && an.ok ? nextBtn(S.r < a.items.length - 1) : ''}`;
  },
  choose(a){
    const it = a.items[S.r], an = S.ans;
    const opts = it.options.map((o, k) => {
      const c = an && an.ok && o.ok ? 'right' : (S.tried.includes(k) ? 'wrong' : '');
      return `<button class="opt ${c}" data-a="choose" data-k="${k}">${o.t}</button>`;
    }).join('');
    return `<p class="q">${S.r+1}/${a.items.length}. ${it.q}</p><div class="opts">${opts}</div>
      ${an && an.ok ? nextBtn(S.r < a.items.length - 1) : ''}`;
  },
  sort(a){
    const rows = a.items.map((it, k) => {
      const v = S.sorted[k];
      const c = v === undefined ? '' : (v === it.safe ? 'right' : 'wrong');
      return `<div class="sitem ${c}"><span class="t">${it.t}</span><span class="sbtns">
        <button class="sb ${v === true ? 'pick' : ''}" data-a="sort" data-k="${k}" data-v="1">써도 돼</button>
        <button class="sb ${v === false ? 'pick' : ''}" data-a="sort" data-k="${k}" data-v="0">비밀!</button></span></div>`;
    }).join('');
    const all = a.items.every((it, k) => S.sorted[k] === it.safe);
    return `<p class="q">AI에게 써도 되는 것과 비밀로 해야 하는 것을 나눠 봐!</p><div class="sort">${rows}</div>${all ? nextBtn(false) : ''}`;
  },
  build(a){
    const groups = a.groups.map((g, gi) => `<div class="group"><span class="glabel">${gi+1}. ${g.label}</span><div class="chips">
      ${g.chips.map((c, k) => `<button class="chip ${S.chosen[gi] === k ? 'on' : ''}" data-a="chip" data-g="${gi}" data-k="${k}">${c}</button>`).join('')}</div></div>`).join('');
    const full = a.groups.every((_, gi) => S.chosen[gi] !== undefined);
    const preview = a.groups.map((g, gi) => S.chosen[gi] === undefined ? `<span class="blank">${g.label}</span>` : g.chips[S.chosen[gi]]).join(' ');
    return groups + `<div class="prompt" id="prompt-text">${preview}</div>
      ${full ? `<div class="row end"><button class="btn sky" data-a="copy">질문 복사하기</button><button class="btn" data-a="finish">별 받기</button></div>` : ''}`;
  },
  write(){
    return `<label class="q" for="my-q">진짜 궁금한 걸 질문으로 써 봐!</label>
      <textarea id="my-q" placeholder="예) 초등학생이 이해할 수 있게 지구가 왜 도는지 3줄로 알려줘">${S.text || ''}</textarea>
      <ul class="checks" id="checks"></ul>
      <div class="row end"><button class="btn sky" data-a="copy">질문 복사하기</button><button class="btn" id="finish-w" data-a="finish" disabled>별 받기</button></div>`;
  },
};

/* 10번 수업: 쓴 질문 점검 */
function checkWrite(t){
  const secret = /(\d{2,3}-?\d{3,4}-?\d{4}|비밀번호|주소|전화번호|아파트|\d+동\s?\d+호)/.test(t);
  return [
    ['무엇을 물어보는지 적었어요', t.trim().length >= 12],
    ['누구 눈높이인지 적었어요 (초등학생, 쉽게…)', /(초등|어린이|학년|살|쉽게|쉬운)/.test(t)],
    ['어떤 모양으로 받을지 적었어요 (3줄, 퀴즈, 표…)', /(줄|개|표|퀴즈|예를|예시|짧게|순서|목록|그림)/.test(t)],
    ['비밀 정보가 없어요', t.trim().length > 0 && !secret, secret],
  ];
}
function updateWrite(){
  const t = S.text || '';
  const res = checkWrite(t);
  const list = document.getElementById('checks');
  if (!list) return;
  list.innerHTML = res.map(([label, ok, bad]) => `<li class="${bad ? 'no' : ok ? 'ok' : ''}">${label}</li>`).join('');
  const pass = res.every(r => r[1]);
  document.getElementById('finish-w').disabled = !pass;
  const bubble = document.querySelector('.bubble');
  const say = res[3][2] ? ['worry','앗! <b>비밀 정보</b>가 들어 있는 것 같아. 그 부분은 지우자.']
    : pass ? ['cheer','완벽한 질문이야! 복사해서 엄마·아빠랑 진짜 AI에게 물어봐도 좋아.']
    : t.trim() ? ['think','좋아, 계속 써 봐! 아래 동그라미가 다 초록색이 되면 성공이야.']
    : ['happy','여기에 질문을 써 봐. 아래 동그라미 4개가 초록색이 되면 성공!'];
  if (bubble){ bubble.innerHTML = say[1]; document.querySelector('.stage').firstElementChild.outerHTML = bot(say[0]); }
}

function render(){
  app.innerHTML = S.view === 'home' ? home() : lesson();
  if (S.view === 'home' && B.rows === null && !B.loading){ B.loading = true; loadBoard().finally(() => { B.loading = false; }); }
  if (S.view === 'lesson' && S.phase === 'act' && LESSONS[S.li].act.type === 'write') updateWrite();
}
function openLesson(i){
  S = { view:'lesson', li:i, phase:'talk', ti:0 };
  render(); window.scrollTo(0,0);
}
function startAct(){
  const t = LESSONS[S.li].act.type;
  const intro = { ox:'맞으면 <b>O</b>, 틀리면 <b>X</b>를 눌러 봐!', choose:'어떤 게 더 좋을까? 하나 골라 봐!',
    sort:'하나씩 골라 봐! 헷갈리면 "나를 알아볼 수 있나?"를 생각해.', build:'재료를 하나씩 골라서 질문을 완성해 봐!', write:'' };
  Object.assign(S, { phase:'act', r:0, ans:null, tried:[], sorted:{}, chosen:{}, text:'', mood:'happy', say:intro[t] });
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const d = b.dataset, L = LESSONS[S.li];
  if (['home','open','nextlesson','next','prev','start','round','copy','share','sfx'].includes(d.a)) SND.play('tap');
  switch (d.a){
    case 'music': SND.toggleMusic(); break;
    case 'sfx': SND.toggleSfx(); break;
    case 'home': S = { view:'home' }; break;
    case 'open': return openLesson(+d.i);
    case 'nextlesson': return openLesson(S.li + 1);
    case 'next': S.ti++; break;
    case 'prev': S.ti--; break;
    case 'start': startAct(); break;
    case 'ox': {
      const it = L.act.items[S.r], v = d.v === '1', ok = v === it.a;
      S.ans = { v, ok }; S.mood = ok ? 'cheer' : 'worry';
      SND.play(ok ? 'right' : 'wrong');
      S.say = (ok ? '딩동댕! ' : '앗, 아니야! ') + it.why;
      break;
    }
    case 'choose': {
      const o = L.act.items[S.r].options[+d.k];
      if (S.ans && S.ans.ok) break;
      if (!o.ok && !S.tried.includes(+d.k)) S.tried.push(+d.k);
      S.ans = { ok:o.ok }; S.mood = o.ok ? 'cheer' : 'think';
      SND.play(o.ok ? 'right' : 'wrong'); S.say = o.why + (o.ok ? '' : ' 다른 걸 골라 볼까?');
      break;
    }
    case 'round': S.r++; S.ans = null; S.tried = []; S.mood = 'happy'; S.say = '다음 문제! 잘 읽고 골라 봐.'; break;
    case 'sort': {
      const it = L.act.items[+d.k], v = d.v === '1';
      S.sorted[+d.k] = v;
      const ok = v === it.safe;
      const all = L.act.items.every((x, k) => S.sorted[k] === x.safe);
      S.mood = all ? 'cheer' : ok ? 'happy' : 'worry';
      SND.play(ok ? 'right' : 'wrong');
      S.say = all ? '전부 맞혔어! 너는 비밀 지킴이야.' : ok ? `맞아! "${it.t}"${it.safe ? '는 써도 괜찮아.' : '는 꼭 비밀!'}` : `다시 생각해 봐. "${it.t}"로 나를 알아볼 수 있을까?`;
      break;
    }
    case 'chip': {
      S.chosen[+d.g] = +d.k;
      SND.play('pick');
      const full = L.act.groups.every((_, gi) => S.chosen[gi] !== undefined);
      S.mood = full ? 'cheer' : 'happy';
      S.say = full ? '완성! 이 질문을 복사해서 엄마·아빠랑 진짜 AI에게 물어봐도 좋아.' : '좋아! 다른 재료도 골라 봐.';
      break;
    }
    case 'copy': return copyPrompt();
    case 'share': return sharePage();
    case 'bgame': SND.play('pick'); B.game = d.g; B.rows = null; break;
    case 'upload': return upload();
    case 'roll':
      SND.play('pick'); nick = rollNick(); B.msg = '';
      try { localStorage.setItem(NICK_KEY, nick); } catch(e){}
      break;
    case 'finish':
      SND.play('star');
      if (!done.includes(S.li)) { done.push(S.li); save(); }
      S.phase = 'done';
      break;
    default: return;
  }
  render();
  if (['open','home','next','prev','start','finish','round'].includes(d.a)) window.scrollTo(0,0);
});

app.addEventListener('input', e => {
  if (e.target.id === 'my-q'){ S.text = e.target.value; updateWrite(); }});

function copyPrompt(){
  const ta = document.getElementById('my-q');
  const box = document.getElementById('prompt-text');
  const text = ta ? ta.value.trim() : (box ? box.textContent.trim() : '');
  if (!text) return;
  const say = msg => { const bb = document.querySelector('.bubble'); if (bb) bb.innerHTML = msg; };
  const fallback = () => {
    if (ta) ta.select();
    else { const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    say('질문을 파랗게 골라 두었어. 길게 눌러서 복사해 줘!');
  };
  try {
    navigator.clipboard.writeText(text).then(() => say('복사했어! AI 채팅창에 붙여 넣어 봐.'), fallback);
  } catch(e){ fallback(); }
}

const SB_URL = 'https://burajsyrifmlptwatcqg.supabase.co/rest/v1';
const SB_KEY = 'sb_publishable_iO016BuOqDxQXtjfSCKCzw_3thXSBtk';
// 지뢰 찾기는 시간 기록(낮을수록 좋음)이라 점수판에서 뺀다
const BOARD = [['stars','수업 별','bs.none']].concat(
  [['01-block-stack','bs.scores.'],['02-star-fleet','ra-02-scores'],['03-maze-muncher','ra-03-scores'],['04-brick-break','ra-04-scores'],
   ['05-sky-ace','ra-05-scores'],['06-snake','ra-06-scores'],['08-frog-road','ra-08-scores'],['09-cave-runner','ra-09-scores']]
  .map(([id, key]) => [id, GAMES.find(g => g[0] === id)[1], key]));
// 별명은 뽑기로만 정한다(실명·연락처가 들어갈 틈을 없앰). DB도 같은 조합만 받는다
const ADJ = ['용감한','신나는','반짝이는','졸린','배고픈','씩씩한','수줍은','날쌘','똑똑한','엉뚱한','행복한','꼬마'];
const ANI = ['수달','펭귄','다람쥐','고양이','강아지','토끼','판다','여우','고래','공룡','부엉이','햄스터'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const rollNick = () => `${pick(ADJ)} ${pick(ANI)} ${1 + Math.floor(Math.random() * 99)}`;
const NICK_KEY = 'hi-playground-nick', SENT_KEY = 'hi-playground-sent';
let nick = '', sent = {};
try { nick = localStorage.getItem(NICK_KEY) || ''; sent = JSON.parse(localStorage.getItem(SENT_KEY)) || {}; } catch(e){}
const B = { game:'stars', rows:null, msg:'' };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function localBest(id, prefix){
  if (id === 'stars') return done.length;
  let best = 0;
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (!k.startsWith(prefix)) continue;
      for (const e of JSON.parse(localStorage.getItem(k)) || []) best = Math.max(best, Math.floor(+e.s) || 0);
    }
  } catch(e){}
  return best;
}
function boardHTML(){
  const tabs = BOARD.map(([id, name]) => `<button class="chip ${B.game === id ? 'on' : ''}" data-a="bgame" data-g="${id}">${name}</button>`).join('');
  let list;
  if (B.rows === null) list = '<li class="empty">불러오는 중…</li>';
  else if (!B.rows) list = '<li class="empty">점수판을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</li>';
  else if (!B.rows.length) list = '<li class="empty">아직 기록이 없어요. 첫 번째 주인공이 되어 봐!</li>';
  else list = B.rows.map((r, i) => `<li class="${r.nickname === nick ? 'me' : ''}"><span class="no">${i+1}</span><span class="nm">${esc(r.nickname)}</span><span class="sc">${esc(r.score)}</span></li>`).join('');
  return `<section class="board"><h2>친구 점수판</h2>
    <p>별명을 뽑고 내 최고 기록을 올려 봐! 친구에게 내 별명을 알려 주면 서로 찾을 수 있어.</p>
    <div class="chips">${tabs}</div><ol class="ranks">${list}</ol>
    <div class="nick"><span class="disp" style="font-size:20px">${nick ? '내 별명: ' + esc(nick) : '아직 별명이 없어요'}</span>
      <button class="btn ghost" data-a="roll">${nick ? '다시 뽑기' : '별명 뽑기'}</button>
      <button class="btn" data-a="upload">내 기록 올리기</button></div>
    <p class="small" id="board-msg" aria-live="polite">${esc(B.msg)}</p></section>`;
}
async function sb(path, opt = {}){
  const r = await fetch(SB_URL + path, Object.assign({ headers:{ apikey:SB_KEY, 'Content-Type':'application/json', Prefer:'return=minimal' } }, opt));
  if (!r.ok) throw new Error(r.status);
  return r.status === 204 || r.status === 201 ? null : r.json();
}
async function loadBoard(){
  try { B.rows = await sb(`/top_scores?select=nickname,score&game=eq.${encodeURIComponent(B.game)}&order=score.desc&limit=10`); }
  catch(e){ B.rows = false; }
  if (S.view === 'home') render();
}
async function upload(){
  const n = nick.trim();
  if (!n) { B.msg = '먼저 별명을 뽑아 줘!'; return render(); }
  const rows = BOARD.map(([id, , key]) => ({ nickname:n, game:id, score:localBest(id, key) }))
    .filter(r => r.score > 0 && r.score > (sent[n + '|' + r.game] || 0));
  if (!rows.length) { B.msg = '새로 올릴 기록이 없어. 수업을 하거나 게임을 한 판 해 봐!'; return render(); }
  B.msg = '올리는 중…'; render();
  try {
    await sb('/scores', { method:'POST', body:JSON.stringify(rows) });
    rows.forEach(r => { sent[n + '|' + r.game] = r.score; });
    try { localStorage.setItem(SENT_KEY, JSON.stringify(sent)); } catch(e){}
    B.msg = `기록 ${rows.length}개를 올렸어!`; SND.play('star');
  } catch(e){ B.msg = '올리지 못했어. 잠시 뒤에 다시 해 봐.'; }
  B.rows = null; render(); loadBoard();
}

const SITE = 'https://heiscool4u.github.io/hi-playground/';
function sharePage(){
  const say = msg => { const bb = document.querySelector('.bubble'); if (bb) bb.innerHTML = msg; };
  const show = () => say(`이 주소를 친구에게 보내 줘!<br><b>${SITE}</b>`);
  if (navigator.share){
    navigator.share({ title:'하이놀이터', text:'콩콩이랑 AI 쓰는 법 배우고 오락실 게임도 하자!', url:SITE }).catch(() => {});
    return;
  }
  try {
    navigator.clipboard.writeText(SITE).then(() => say('주소를 복사했어! 메신저에 붙여 넣어서 친구에게 보내 줘.'), show);
  } catch(e){ show(); }
}

render();
</script>
</body>
</html>
